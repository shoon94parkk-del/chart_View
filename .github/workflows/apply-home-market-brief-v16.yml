name: Apply Home Market Brief V16

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_home_market_brief_v16.py'
      - '.github/workflows/apply-home-market-brief-v16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply home market brief V16
        run: python scripts/apply_home_market_brief_v16.py
      - name: Validate JavaScript and expected hooks
        run: |
          set -euo pipefail
          node --check static/js/home_brief_v8.js
          node --check static/js/home_market_v9.js
          node --check static/js/ux_v3.js
          node --check static/js/ux_patch.js
          grep -q '주요 종목 오늘 시황' static/js/home_brief_v8.js
          grep -q "fetch('/api/heatmap'" static/js/home_brief_v8.js
          grep -q 'HOME V16 MARKET-FIRST' static/css/home_brief_v8.css
          grep -q 'home_brief_v8.js?v=20260911v16' static/js/ux_v3.js
          grep -q 'ux_patch.js?v=20260911v16' templates/index.html
          if grep -q '오늘은 여기부터 보세요' static/js/home_brief_v8.js; then
            echo 'Old recommendation hero still present'
            exit 1
          fi
      - name: Commit generated home changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/home_brief_v8.js static/js/home_market_v9.js static/css/home_brief_v8.css static/js/ux_v3.js static/js/ux_patch.js templates/index.html
          if git diff --cached --quiet; then
            echo 'Home V16 already applied'
          else
            git commit -m 'feat: make home market-first with major stock cards'
            git push
          fi
