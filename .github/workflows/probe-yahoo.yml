name: Probe Yahoo Valuation Endpoints

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-yahoo.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe crumb authenticated quoteSummary
        run: |
          python - <<'PY'
          import requests
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'})
          r=s.get('https://fc.yahoo.com',timeout=15,allow_redirects=True)
          print('fc',r.status_code,'cookies',list(s.cookies.keys()))
          c=s.get('https://query1.finance.yahoo.com/v1/test/getcrumb',timeout=15)
          print('crumb',c.status_code,repr(c.text[:100]))
          crumb=c.text.strip()
          for symbol in ['AAPL','NVDA','005930.KS','000660.KS']:
              u=f'https://query1.finance.yahoo.com/v10/finance/quoteSummary/{symbol}'
              q=s.get(u,params={'modules':'price,summaryDetail,defaultKeyStatistics,financialData','crumb':crumb},timeout=20)
              print('\n',symbol,'status',q.status_code)
              print(q.text[:2500])
          PY
