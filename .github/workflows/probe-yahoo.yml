name: Probe Live Build Version

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-yahoo.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live endpoints
        run: |
          set -e
          BASE='https://chart-view-bsg6.onrender.com'
          echo 'APPLE SEARCH:'
          curl -fsSL --get --data-urlencode 'q=애플' -w '\ntime=%{time_total}s\n' "$BASE/api/search"
          echo 'AAPL SEARCH:'
          curl -fsSL --get --data-urlencode 'q=AAPL' -w '\ntime=%{time_total}s\n' "$BASE/api/search"
          echo 'VALUATION:'
          curl -fsSL --get --data-urlencode 'tickers=AAPL,NVDA' -w '\ntime=%{time_total}s\n' "$BASE/api/valuation"
          echo 'HEATMAP:'
          curl -fsSL -o /tmp/h.json -w 'http=%{http_code} time=%{time_total}s\n' "$BASE/api/heatmap"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/h.json'))
          print('heatmap_count=',len(d.get('results',[])))
          PY
