name: Live Home Order Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-home-order-smoke.yml'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify stable home order
        run: |
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async()=>{
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 384, height: 824 },
              isMobile: true,
              hasTouch: true,
              userAgent: 'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));

            const res = await page.goto('https://chart-view-bsg6.onrender.com/?homeorder=32d', { waitUntil: 'domcontentloaded', timeout: 60000 });
            assert(res && res.status() === 200, 'production HTTP failed');

            for (const sel of ['#home-market-v9', '#home-v8-body', '#home-watchlist-v30', '#ux12-data-status']) {
              await page.waitForSelector(sel, { state: 'visible', timeout: 20000 });
            }

            async function readOrder() {
              return page.evaluate(() => {
                const home = document.querySelector('#home-tab .home-v8');
                const ids = Array.from(home?.children || []).map(x => x.id || x.className || x.tagName);
                const y = {};
                for (const id of ['home-market-v9','home-v8-body','home-watchlist-v30','ux12-data-status']) {
                  y[id] = document.getElementById(id)?.getBoundingClientRect().top ?? null;
                }
                return { ids, y, marker: home?.dataset.homeOrder || '' };
              });
            }

            function assertOrder(state, label) {
              const ids = state.ids;
              const m = ids.indexOf('home-market-v9');
              const b = ids.indexOf('home-v8-body');
              const w = ids.indexOf('home-watchlist-v30');
              const d = ids.indexOf('ux12-data-status');
              assert(m >= 0 && b > m && w > b && d > w, `${label}: DOM order wrong: ${ids.join(' > ')}`);
              assert(d === ids.length - 1, `${label}: data status is not last: ${ids.join(' > ')}`);
              assert(state.y['home-market-v9'] < state.y['home-v8-body'], `${label}: market must appear before daily summary`);
              assert(state.y['home-v8-body'] < state.y['home-watchlist-v30'], `${label}: watchlist must be below daily summary`);
              assert(state.y['home-watchlist-v30'] < state.y['ux12-data-status'], `${label}: data status must be bottom`);
              assert(state.marker === 'market-body-watchlist-status', `${label}: stable order marker missing`);
            }

            const first = await readOrder();
            assertOrder(first, 'initial');
            console.log('initial_order=', first.ids.join(' > '));

            await page.waitForTimeout(6000);
            const later = await readOrder();
            assertOrder(later, 'after-refresh');
            console.log('after_refresh_order=', later.ids.join(' > '));

            await page.locator('.app-bottom-btn[data-app-mode="market"]').tap();
            await page.waitForSelector('#macro-tab', { state: 'visible', timeout: 10000 });
            await page.locator('.app-bottom-btn[data-app-mode="home"]').tap();
            await page.waitForSelector('#home-tab', { state: 'visible', timeout: 10000 });
            await page.waitForTimeout(1500);
            const returned = await readOrder();
            assertOrder(returned, 'return-home');
            console.log('return_home_order=', returned.ids.join(' > '));

            if (errors.length) throw new Error('browser errors: ' + errors.join(' | '));
            console.log('LIVE HOME ORDER SMOKE PASSED');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node smoke.cjs
