name: App V31 Local Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-v31-local-smoke.yml'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          pip install -r requirements.txt >/dev/null
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Start app
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8080 >/tmp/chartview.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8080/health >/dev/null && exit 0; sleep 1; done
          cat /tmp/chartview.log; exit 1
      - name: Verify V31 UX
        run: |
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:384,height:824},isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'});
            const page=await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const r=await page.goto('http://127.0.0.1:8080/?v31=3',{waitUntil:'domcontentloaded',timeout:60000});
            assert(r&&r.status()===200);
            await page.waitForSelector('.app-bottom-nav',{timeout:20000});
            await page.waitForSelector('#home-watchlist-v30',{timeout:5000});
            const homeNames=await page.locator('#home-watchlist-v30 strong').allTextContents();
            console.log('home_watch=',homeNames);
            assert(homeNames.some(x=>x.includes('삼성전자')),'default home watchlist missing');
            const initialStored=await page.evaluate(()=>JSON.parse(localStorage.getItem('chartview-watchlist-v1')||'[]').length);
            assert.strictEqual(initialStored,3,'defaults not persisted on first load');

            await page.locator('[data-home-watch-all]').tap();
            await page.waitForSelector('#watchlist-tab',{state:'visible',timeout:5000});
            assert.strictEqual(await page.locator('.watchlist-v30-card').count(),3);

            await page.locator('.app-bottom-btn[data-app-mode="discover"]').tap();
            await page.waitForSelector('#screener-results .screen-watch',{timeout:15000});
            const candidate=page.locator('#screener-results .screen-watch:not(.active)').first();
            const symbol=await candidate.getAttribute('data-symbol');
            const name=await candidate.getAttribute('data-name');
            const before=await page.evaluate(()=>JSON.parse(localStorage.getItem('chartview-watchlist-v1')||'[]').length);
            await candidate.tap();
            const after=await page.evaluate(()=>JSON.parse(localStorage.getItem('chartview-watchlist-v1')||'[]').length);
            console.log('screener_added=',symbol,name,before,'->',after);
            assert.strictEqual(after,before+1,'screener star did not save');
            const savedStar=page.locator(`#screener-results .screen-watch[data-symbol="${symbol}"]`).first();
            assert(await savedStar.evaluate(x=>x.classList.contains('active')),'screener star not active');
            assert.strictEqual((await savedStar.textContent()).trim(),'★','screener star glyph not updated');

            await page.locator('.app-bottom-btn[data-app-mode="home"]').tap();
            await page.waitForSelector('#home-watchlist-v30',{timeout:5000});
            await page.waitForTimeout(350);
            const homeSymbols=await page.locator('#home-watchlist-v30 [data-home-watch-open]').evaluateAll(xs=>xs.map(x=>x.dataset.homeWatchOpen));
            console.log('home_symbols=',homeSymbols);
            assert(homeSymbols.includes(symbol),'new screener watch not reflected on home');

            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForSelector('.app-bottom-nav',{timeout:15000});
            await page.waitForSelector('#home-watchlist-v30',{timeout:5000});
            const persisted=await page.evaluate(s=>JSON.parse(localStorage.getItem('chartview-watchlist-v1')||'[]').some(x=>x.symbol===s),symbol);
            assert(persisted,'watchlist lost after reload');
            const persistedHome=await page.locator('#home-watchlist-v30 [data-home-watch-open]').evaluateAll((xs,s)=>xs.some(x=>x.dataset.homeWatchOpen===s),symbol);
            assert(persistedHome,'home shortcut lost after reload');
            if(errors.length) throw new Error(errors.join(' | '));
            console.log('APP V31 LOCAL SMOKE PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
