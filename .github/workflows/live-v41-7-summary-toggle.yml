name: Live V41.7 Summary Toggle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-v41-7-summary-toggle.yml'

permissions:
  contents: read

jobs:
  samsung-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify live summary toggle
        run: |
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport:{width:384,height:824}, isMobile:true, hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'
            });
            await context.addInitScript(()=>localStorage.setItem('chartview-watchlist-v1', JSON.stringify([
              {symbol:'005930.KS',name:'삼성전자'},{symbol:'000660.KS',name:'SK하이닉스'},{symbol:'NVDA',name:'엔비디아'},{symbol:'AAPL',name:'애플'},{symbol:'MU',name:'MU'}
            ])));
            const page = await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const res=await page.goto('https://chart-view-bsg6.onrender.com/?v417-live=1',{waitUntil:'domcontentloaded',timeout:60000});
            assert(res && res.status()===200,'HTTP failed');
            const summary=page.locator('#home-personal-news-v37 .news-v412-summary').first();
            await summary.waitFor({state:'visible',timeout:30000});
            assert.strictEqual(await summary.getAttribute('aria-expanded'),'false','should start collapsed');
            assert((await summary.innerText()).includes('전체보기'),'missing 전체보기');
            const before=await summary.evaluate(el=>({h:el.getBoundingClientRect().height, clamp:getComputedStyle(el.querySelector('.news-v417-summary-text')).webkitLineClamp}));
            await summary.tap();
            assert.strictEqual(await summary.getAttribute('aria-expanded'),'true','did not expand');
            assert((await summary.innerText()).includes('접기'),'missing 접기');
            assert(await summary.evaluate(el=>el.classList.contains('is-expanded')),'expanded class missing');
            const after=await summary.evaluate(el=>({h:el.getBoundingClientRect().height, clamp:getComputedStyle(el.querySelector('.news-v417-summary-text')).webkitLineClamp}));
            assert(after.h >= before.h,'expanded summary became smaller');
            await summary.tap();
            assert.strictEqual(await summary.getAttribute('aria-expanded'),'false','did not collapse again');
            assert.strictEqual(errors.length,0,'page errors: '+errors.join(' | '));
            console.log(JSON.stringify({before,after,text:(await summary.innerText()).slice(0,160)},null,2));
            console.log('LIVE V41.7 SUMMARY TOGGLE PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
