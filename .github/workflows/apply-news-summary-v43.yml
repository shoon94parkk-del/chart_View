name: Apply News Summary V43

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-news-summary-v43.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V43 wiring
        run: python scripts/apply_news_summary_v43.py
      - name: Syntax checks
        run: |
          python -m py_compile main.py news_service_v37.py news_summary_service.py
          node --check static/js/news_readability_v41_2.js
          node --check static/js/personalized_news_v40.js
          node --check static/js/my_hub_v41.js
          node --check static/js/home_watchlist_boot_v32c.js
      - name: Focused regression
        run: |
          python -m pip install -q -r requirements.txt pytest httpx
          python -m pytest -q tests/test_news_summary_v43.py tests/test_v37_personalized_news.py tests/test_v41_7_news_summary_toggle.py
      - name: Commit product wiring
        run: |
          if git diff --quiet; then
            echo 'No product changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py news_service_v37.py templates/index.html tests/test_v37_personalized_news.py static/js/news_readability_v41_2.js static/js/personalized_news_v40.js static/js/my_hub_v41.js static/js/home_watchlist_boot_v32c.js static/css/news_readability_v41_2.css
          git commit -m 'V43: summarize visible news from article content in Korean'
          git push
