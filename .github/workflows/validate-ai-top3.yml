name: Publish GPT-reviewed TOP3 track record

on:
  push:
    branches: [main]
    paths:
      - 'static/data/ai_daily_rankings.json'
      - 'scripts/validate_ai_rankings.py'
  pull_request:
    paths:
      - 'static/data/ai_daily_rankings.json'
      - 'scripts/validate_ai_rankings.py'

jobs:
  validate-and-refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_ai_rankings.py
      - run: python scripts/update_ai_recommendations.py
      - name: Commit refreshed track record
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/ai_recommendations.json static/data/ai_daily_rankings_meta.json
          if git diff --cached --quiet; then
            echo "No track-record changes"
          else
            git commit -m "data: refresh GPT TOP3 track record"
            git push origin HEAD:main
          fi
