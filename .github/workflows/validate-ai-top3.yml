name: Validate GPT TOP3

on:
  push:
    branches:
      - main
    paths:
      - 'static/data/ai_daily_rankings.json'
      - 'scripts/validate_ai_rankings.py'
      - 'scripts/update_ai_recommendations.py'
      - 'tests/test_validate_ai_rankings.py'
      - 'tests/test_ai_recommendations.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-ai-top3
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate GPT TOP3 contract and stock identity
        run: python scripts/validate_ai_rankings.py

      - name: Test recommendation performance guards
        run: |
          pip install -q pytest
          pytest -q tests/test_ai_recommendations.py tests/test_validate_ai_rankings.py

      - name: Refresh recommendation track record
        run: python scripts/update_ai_recommendations.py

      - name: Commit refreshed track record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/ai_daily_rankings_meta.json static/data/ai_recommendations.json
          if git diff --cached --quiet; then
            echo "No GPT TOP3 track-record changes"
          else
            git commit -m "data: refresh GPT TOP3 track record"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
