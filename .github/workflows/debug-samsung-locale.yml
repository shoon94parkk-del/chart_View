name: Debug Samsung Locale

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-samsung-locale.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Trace page errors
        run: |
          cat > debug.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:384,height:824},isMobile:true,hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'
            });
            const page=await context.newPage();
            page.on('pageerror',e=>console.log('PAGEERROR_STACK\n'+(e.stack||String(e))));
            page.on('console',m=>{if(m.type()==='error') console.log('CONSOLE_ERROR',m.text())});
            await page.goto('https://chart-view-bsg6.onrender.com/?debug_locale=1',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(8000);
            console.log('navigator.language=',await page.evaluate(()=>navigator.language));
            console.log('navigator.languages=',await page.evaluate(()=>navigator.languages));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node debug.cjs
