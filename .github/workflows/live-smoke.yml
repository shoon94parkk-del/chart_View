name: Live Render Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'market_service.py'
      - 'requirements.txt'
      - 'templates/**'
      - 'static/js/**'
      - 'static/css/**'
      - 'static/data/valuation_cache.json'
      - 'static/data/macro_cache.json'
      - '.github/workflows/live-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify current public build and endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://chart-view-bsg6.onrender.com'

          ready=0
          for i in $(seq 1 45); do
            code=$(curl -L -sS -o /tmp/home.html -w '%{http_code}' "$BASE/" || true)
            if [ "$code" = '200' ] \
              && grep -q '차트뷰' /tmp/home.html \
              && grep -q 'viewport-fit=cover' /tmp/home.html \
              && ! grep -q 'user-scalable=no' /tmp/home.html \
              && grep -q '/static/js/macro.js?v=20260911v1' /tmp/home.html \
              && grep -q '/static/js/ux_patch.js?v=20260911v1' /tmp/home.html; then
              ready=1
              echo "current mobile build detected on attempt=$i"
              break
            fi
            echo "attempt=$i status=$code: waiting for current build"
            sleep 10
          done
          test "$ready" = '1'

          curl -fsSL "$BASE/health" -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('status') == 'ok', d
          print('health OK')
          PY

          echo 'Search correctness:'
          for q in '삼성전자' '테크윙' 'AAPL' '애플' 'TSLA'; do
            curl -fsSL --get --data-urlencode "q=$q" -w " query=$q time=%{time_total}s\n" "$BASE/api/search" -o "/tmp/search-${q}.json"
          done
          python - <<'PY'
          import json
          checks=[('삼성전자','005930.KS'),('테크윙','089030.KQ'),('AAPL','AAPL'),('애플','AAPL'),('TSLA','TSLA')]
          for q,sym in checks:
              d=json.load(open(f'/tmp/search-{q}.json'))
              assert any(x.get('symbol') == sym for x in d.get('results', [])), (q,d)
          print('search OK')
          PY

          curl -fsSL "$BASE/static/data/screener.json" -o /tmp/screener.json
          curl -fsSL "$BASE/static/data/valuation_cache.json" -o /tmp/vcache.json
          curl -fsSL "$BASE/static/data/macro_cache.json" -o /tmp/mcache.json
          curl -fsSL "$BASE/static/js/ux_patch.js?v=20260911v1" -o /tmp/ux.js
          curl -fsSL "$BASE/static/js/ideas.js?v=20260911v1" -o /tmp/ideas.js
          curl -fsSL "$BASE/static/js/screener.js?v=20260911v1" -o /tmp/screener.js
          grep -Fq 'const isSixCharCode = (text) => /^\d{6}$/.test(text);' /tmp/ux.js
          grep -q 'ideas-market' /tmp/ideas.js
          grep -q 'data-screen-preset="momentum"' /tmp/screener.js

          python - <<'PY'
          import json
          s=json.load(open('/tmp/screener.json'))
          assert len(s.get('stocks', [])) > 2000
          v=json.load(open('/tmp/vcache.json'))
          for ticker in ('005930.KS','000660.KS'):
              pe=v.get('quotes',{}).get(ticker,{}).get('forwardPE')
              assert pe is not None and 0 < float(pe) < 250, (ticker, pe)
          m=json.load(open('/tmp/mcache.json'))
          rows=m.get('results',[])
          assert len(rows) == 13, len(rows)
          assert m.get('staleCount') == 0, m.get('staleCount')
          assert all(x.get('chart_data') and x.get('asOf') and 'delta' in x for x in rows)
          print('static caches OK:', len(s['stocks']), 'stocks /', len(rows), 'macro')
          PY

          curl -fsSL --get --data-urlencode 'tickers=AAPL,005930.KS' --data-urlencode 'period=1mo' "$BASE/api/compare" -o /tmp/compare.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/compare.json'))
          assert len(d.get('stocks', [])) == 2, d
          assert all(s.get('price', 0) > 0 and s.get('data') for s in d['stocks'])
          print('compare OK', [(x['ticker'],x['price']) for x in d['stocks']])
          PY

          curl -fsSL --get --data-urlencode 'tickers=AAPL,NVDA,005930.KS,000660.KS' "$BASE/api/valuation" -o /tmp/valuation.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/valuation.json'))
          rows={x.get('ticker'):x for x in d.get('stocks',[])}
          for ticker in ('AAPL','NVDA','005930.KS','000660.KS'):
              row=rows[ticker]
              assert row.get('price') and float(row['price']) > 0, (ticker,row)
              assert row.get('forwardPE') is not None and 0 < float(row['forwardPE']) < 250, (ticker,row)
          print('valuation OK', [(t,rows[t]['price'],rows[t]['forwardPE']) for t in rows])
          PY

          curl -fsSL "$BASE/api/heatmap" -o /tmp/heatmap.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/heatmap.json')).get('results',[])
          assert len(rows) >= 15, len(rows)
          assert all(x.get('price') for x in rows)
          print('heatmap OK',len(rows))
          PY

          curl -fsSL --max-time 30 "$BASE/api/macro" -o /tmp/macro.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/macro.json'))
          rows=d.get('results',[])
          assert d.get('cacheMode') == 'precomputed', d.get('cacheMode')
          assert len(rows) == 13, len(rows)
          assert d.get('freshCount') == 13 and d.get('staleCount') == 0, (d.get('freshCount'),d.get('staleCount'))
          assert all('delta' in x and x.get('chart_data') for x in rows)
          assert d.get('summary',{}).get('text')
          assert not d.get('net_liquidity',{}).get('error'), d.get('net_liquidity')
          print('macro OK', d.get('generatedAt'), d.get('summary',{}).get('level'))
          PY

          echo 'All current-build smoke checks passed.'
