name: Live Render Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'market_service.py'
      - 'requirements.txt'
      - 'templates/**'
      - 'static/js/**'
      - 'static/css/**'
      - '.github/workflows/live-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for latest Render build and test public endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://chart-view-bsg6.onrender.com'

          echo 'Waiting until the latest valuation-cache code is live...'
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -L -sS -o /tmp/home.html -w '%{http_code}' "$BASE/" || true)
            if [ "$code" = '200' ]; then
              curl -fsSL --get --data-urlencode 'tickers=AAPL,NVDA' "$BASE/api/valuation" -o /tmp/version-valuation.json || true
              if python - <<'PY'
          import json, sys
          try:
              d=json.load(open('/tmp/version-valuation.json'))
              rows={x.get('ticker'): x for x in d.get('stocks', [])}
              a=rows.get('AAPL', {})
              n=rows.get('NVDA', {})
              ok=(a.get('forwardPE') is not None and n.get('forwardPE') is not None and
                  'Daily Quote Cache' in str(a.get('dataSource', '')))
              sys.exit(0 if ok else 1)
          except Exception:
              sys.exit(1)
          PY
              then
                ready=1
                echo "latest build detected on attempt=$i"
                break
              fi
            fi
            echo "attempt=$i status=$code: old build still live"
            sleep 10
          done
          test "$ready" = '1'
          grep -q '차트뷰' /tmp/home.html

          echo 'Health:'
          curl -fsSL "$BASE/health" | tee /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('status') == 'ok', d
          PY

          echo 'Search speed and correctness:'
          for q in '삼성전자' '테크윙' 'AAPL' '애플' 'TSLA'; do
            curl -fsSL --get --data-urlencode "q=$q" -w " query=$q http=%{http_code} time=%{time_total}s\n" "$BASE/api/search" -o "/tmp/search-${q}.json"
          done
          python - <<'PY'
          import json
          checks=[('삼성전자','005930.KS'),('테크윙','089030.KQ'),('AAPL','AAPL'),('애플','AAPL'),('TSLA','TSLA')]
          for q,sym in checks:
              d=json.load(open(f'/tmp/search-{q}.json'))
              assert any(x.get('symbol') == sym for x in d.get('results', [])), (q,d)
          PY

          echo 'Screener JSON:'
          curl -fsSL "$BASE/static/data/screener.json" -o /tmp/screener.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/screener.json'))
          print('screener count=', d.get('count'), 'universe=', d.get('universeCount'), 'date=', d.get('tradeDate'))
          assert d.get('count', 0) > 2000
          PY

          echo 'Yahoo compare:'
          curl -fsSL --get --data-urlencode 'tickers=AAPL,005930.KS' --data-urlencode 'period=1mo' "$BASE/api/compare" -o /tmp/compare.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/compare.json'))
          print('compare=', [(s.get('ticker'), s.get('price'), len(s.get('data', []))) for s in d.get('stocks', [])])
          assert len(d.get('stocks', [])) == 2, d
          assert all(s.get('price', 0) > 0 and s.get('data') for s in d['stocks']), d
          PY

          echo 'Valuation snapshot:'
          curl -fsSL --get --data-urlencode 'tickers=AAPL,NVDA,005930.KS,000660.KS' "$BASE/api/valuation" -o /tmp/valuation.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/valuation.json'))
          rows={s.get('ticker'):s for s in d.get('stocks', [])}
          for s in d.get('stocks', []):
              print('valuation=', s.get('ticker'), 'price=', s.get('price'), 'fwdPE=', s.get('forwardPE'), 'PE=', s.get('trailingPE'), 'PBR=', s.get('pbr'), 'source=', s.get('dataSource'))
          assert len(rows) >= 4, d
          assert rows['AAPL'].get('forwardPE') is not None
          assert rows['NVDA'].get('forwardPE') is not None
          assert 'Daily Quote Cache' in rows['AAPL'].get('dataSource','')
          PY

          echo 'Heatmap:'
          curl -fsSL "$BASE/api/heatmap" -o /tmp/heatmap.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/heatmap.json'))
          rows=d.get('results', [])
          print('heatmap rows=',len(rows))
          assert len(rows) >= 15, len(rows)
          assert all(x.get('price') for x in rows), rows[:3]
          PY

          echo 'All latest-build smoke checks passed.'
