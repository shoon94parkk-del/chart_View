name: Live Mobile Interaction Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-interaction-v25.yml'

jobs:
  interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Test live mobile interactions
        shell: bash
        run: |
          cat > /tmp/live-ui.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async() => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport:{width:360,height:800},
              isMobile:true,
              hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 16; SM-S931N) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36'
            });
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', m => { if (m.type()==='error') errors.push('console:'+m.text()); });

            await page.goto('https://chart-view-bsg6.onrender.com/?ui_smoke=25', {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForSelector('.app-bottom-nav', {timeout:30000});
            await page.waitForSelector('#home-market-v9', {timeout:30000});
            await page.waitForSelector('.home16-stock', {timeout:30000});
            await page.waitForTimeout(1200);

            const uxPatch = await page.locator('script[src*="ux_patch.js"]').getAttribute('src');
            console.log('uxPatch=', uxPatch);
            assert(uxPatch && uxPatch.includes('v24'), 'live page is not loading ux_patch v24');

            async function heartbeat(label){
              const v = await page.evaluate(() => new Promise(resolve => setTimeout(() => resolve('ok'), 40)));
              assert.equal(v,'ok', label+' main thread stalled');
              console.log(label, 'heartbeat OK');
            }

            // 1) market more toggle must be a pure UI interaction.
            const more = page.locator('[data-home23-market-toggle]');
            await more.waitFor({state:'visible',timeout:15000});
            await more.tap({timeout:5000});
            await page.waitForTimeout(150);
            assert(await page.locator('#home-market-v9').evaluate(el=>el.classList.contains('home23-expanded')), 'market more did not expand');
            const visibleSecondary = await page.locator('#home-market-v9 .home23-secondary').evaluateAll(els => els.filter(e => getComputedStyle(e).display !== 'none').length);
            assert.equal(visibleSecondary, 4, 'secondary market cards not visible');
            await heartbeat('market-expand');
            await more.tap({timeout:5000});
            await heartbeat('market-collapse');
            console.log('market toggle OK');

            // 2) major stock must navigate to analysis.
            const stock = page.locator('.home16-stock').first();
            await stock.tap({timeout:5000});
            await page.waitForTimeout(250);
            assert(await page.locator('.app-bottom-btn[data-app-mode="analysis"]').evaluate(el=>el.classList.contains('active')), 'stock tap did not activate analysis nav');
            await heartbeat('stock-analysis');
            console.log('major stock tap OK');

            // 3) return Home.
            const home = page.locator('.app-bottom-btn[data-app-mode="home"]');
            await home.tap({timeout:5000});
            await page.waitForTimeout(250);
            assert(await home.evaluate(el=>el.classList.contains('active')), 'home nav did not react');
            await heartbeat('home-return');
            console.log('home nav OK');

            // 4) Tools nav must show the tools tab.
            const tools = page.locator('.app-bottom-btn[data-app-mode="tools"]');
            await tools.tap({timeout:5000});
            await page.waitForTimeout(250);
            assert(await tools.evaluate(el=>el.classList.contains('active')), 'tools nav did not activate');
            const toolsTab = page.locator('#tools-tab');
            await toolsTab.waitFor({state:'visible',timeout:5000});
            assert((await toolsTab.innerText()).includes('Finviz'), 'tools content missing Finviz');
            await heartbeat('tools-open');
            console.log('tools nav OK');

            // 5) External tool card must be a usable link that opens a new tab.
            const finviz = page.locator('a.investment-tool-card', {hasText:'Finviz'}).first();
            assert.equal(await finviz.getAttribute('target'), '_blank', 'Finviz does not target a new tab');
            assert((await finviz.getAttribute('href')).startsWith('https://finviz.com'), 'Finviz href is wrong');
            const popupPromise = context.waitForEvent('page', {timeout:5000});
            await finviz.tap({timeout:5000});
            const popup = await popupPromise;
            console.log('finviz popup=', popup.url());
            await popup.close().catch(()=>{});
            await heartbeat('tool-link');

            if (errors.length) {
              console.log('browser errors=', errors);
              throw new Error('browser errors found: '+errors.join(' | '));
            }
            console.log('ALL MOBILE INTERACTIONS PASSED');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node /tmp/live-ui.cjs
