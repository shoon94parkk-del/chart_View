name: Build Frontend Release Bundle

on:
  push:
    branches: [main]
    paths:
      - 'static/js/**'
      - '!static/js/chartview_release_bundle.js'
      - 'static/css/**'
      - '!static/css/chartview_release_bundle.css'
      - 'scripts/build_frontend_bundle.py'
      - 'tests/screener_freshness_regression.cjs'
      - 'tests/test_ai_pick_ledger_ui.py'
      - 'tests/test_frontend_bundle.py'
      - '.github/workflows/build-frontend-release.yml'

permissions:
  contents: write

concurrency:
  group: frontend-release-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Build release bundle
        run: python scripts/build_frontend_bundle.py
      - name: Bump immutable asset keys
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          token = os.environ['RELEASE_SHA'][:12]
          path = Path('templates/index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'chartview_release_bundle\.js\?v=[^"\s]+', f'chartview_release_bundle.js?v={token}', html)
          html = re.sub(r'ai_daily_widget\.js\?v=[^"\s]+', f'ai_daily_widget.js?v={token}', html)
          path.write_text(html, encoding='utf-8', newline='\n')
          PY
      - name: JavaScript syntax
        run: |
          node --check static/js/screener.js
          node --check static/js/ai_daily_widget.js
          node --check static/js/ai_pick_ledger_v52.js
          node --check static/js/chartview_release_bundle.js
      - name: Screener freshness regression
        run: node --test tests/screener_freshness_regression.cjs
      - name: PICK ledger regression
        run: python -m pytest -q tests/test_ai_pick_ledger_ui.py
      - name: Bundle freshness regression
        run: python -m pytest -q tests/test_frontend_bundle.py
      - name: Commit generated release files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/chartview_release_bundle.js static/css/chartview_release_bundle.css templates/index.html
          if git diff --cached --quiet; then
            echo 'No generated release changes.'
            exit 0
          fi
          git commit -m 'build: refresh frontend release bundle'
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main
