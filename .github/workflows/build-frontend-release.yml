name: Build Frontend Release Bundle

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'static/js/**'
      - '!static/js/chartview_release_bundle.js'
      - 'static/css/**'
      - '!static/css/chartview_release_bundle.css'
      - 'scripts/build_frontend_bundle.py'
      - 'templates/index.html'
      - 'tests/screener_freshness_regression.cjs'
      - 'tests/test_ai_pick_ledger_ui.py'
      - 'tests/test_frontend_bundle.py'
      - '.github/workflows/build-frontend-release.yml'

permissions:
  contents: read

concurrency:
  group: frontend-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Verify committed release bundle and asset keys
        run: python scripts/build_frontend_bundle.py --check
      - name: JavaScript syntax
        run: |
          node --check static/js/screener.js
          node --check static/js/ai_daily_widget.js
          node --check static/js/ai_pick_ledger_v52.js
          node --check static/js/chartview_release_bundle.js
      - name: Screener freshness regression
        run: node --test tests/screener_freshness_regression.cjs
      - name: PICK ledger regression
        run: python -m pytest -q tests/test_ai_pick_ledger_ui.py
      - name: Bundle freshness regression
        run: python -m pytest -q tests/test_frontend_bundle.py
