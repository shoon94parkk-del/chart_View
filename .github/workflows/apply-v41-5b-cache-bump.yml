name: Apply V41.5b Cache Bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v41-5b-cache-bump.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cache bump
        run: python scripts/apply_v41_5b_cache_bump.py
      - name: Validate assets
        run: |
          node --check static/js/home_watchlist_boot_v32c.js
          node --check static/js/home_polish_v41_4.js
          python -m pip install -q pytest
          python -m pytest -q tests/test_v41_5_consistency.py
      - name: Commit cache bump
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/home_watchlist_boot_v32c.js templates/index.html tests/test_v41_5_consistency.py
          git commit -m 'V41.5b: force fresh Home consistency assets'
          git push
