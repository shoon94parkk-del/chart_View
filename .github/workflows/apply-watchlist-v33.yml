name: Apply Watchlist V33

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-watchlist-v33.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V33 patch
        run: python scripts/apply_watchlist_v33.py
      - name: Validate JavaScript
        run: |
          node --check static/js/watchlist_v30.js
          node --check static/js/ux_patch.js
      - name: Verify V33 markers
        run: |
          grep -q 'chartview-watchlist-quotes-v33' static/js/watchlist_v30.js
          grep -q 'watchlist-v30.js?v=20260912v33' static/js/ux_patch.js
          grep -q 'watchlist-v30.css?v=20260912v33' static/js/ux_patch.js
          grep -q 'ux_patch.js?v=20260912v33' templates/index.html
      - name: Commit generated V33 cache bump
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/watchlist_v30.js static/js/ux_patch.js templates/index.html
          git commit -m 'feat: finalize watchlist ux v33'
          git push
