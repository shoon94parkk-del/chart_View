name: Apply Final Mobile Core Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-mobile-core-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact core fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      print(path, 'already patched')
                      return
                  raise SystemExit(f'expected block not found in {path}: {old[:80]!r}')
              text=text.replace(old,new,1)
              p.write_text(text,encoding='utf-8')
              print(path,'patched')

          replace_exact('market_service.py', '''    price = (\n        _positive(_raw(price_block.get("regularMarketPrice")))\n        or _positive(chart_meta.get("regularMarketPrice"))\n        or last_close\n        or 0.0\n    )''', '''    price = (\n        _positive(chart_meta.get("regularMarketPrice"))\n        or last_close\n        or _positive(_raw(price_block.get("regularMarketPrice")))\n        or 0.0\n    )''')

          replace_exact('static/js/chart.js', 'handleScale: { mouseWheel: false, pinch: false },', 'handleScale: { mouseWheel: false, pinch: true },')

          replace_exact('static/js/fwdper.js', "globalFilter.style.display = (tabId === 'chart' || tabId === 'fwdper') ? 'block' : 'none';", "globalFilter.style.display = (tabId === 'chart' || tabId === 'fwdper' || tabId === 'ideas') ? 'block' : 'none';")

          replace_exact('templates/index.html', '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">', '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">')
          replace_exact('templates/index.html', '/static/css/ux_patch.css?v=20260910v3', '/static/css/ux_patch.css?v=20260911v1')
          replace_exact('templates/index.html', '/static/js/chart.js?v=20260910v3', '/static/js/chart.js?v=20260911v1')
          replace_exact('templates/index.html', '/static/js/fwdper.js?v=20260910v3', '/static/js/fwdper.js?v=20260911v1')
          replace_exact('templates/index.html', '/static/js/macro.js?v=20260219v2', '/static/js/macro.js?v=20260911v1')
          replace_exact('templates/index.html', '/static/js/ux_patch.js?v=20260910', '/static/js/ux_patch.js?v=20260911v1')
          replace_exact('templates/index.html', '글로벌 경제 데이터를 번역하고 있습니다...', '최신 경제지표 캐시를 불러오는 중...')
          PY
      - name: Validate core syntax and invariants
        run: |
          python -m py_compile main.py market_service.py
          node --check static/js/chart.js
          node --check static/js/fwdper.js
          python - <<'PY'
          from pathlib import Path
          market=Path('market_service.py').read_text(encoding='utf-8')
          assert market.index('_positive(chart_meta.get("regularMarketPrice"))') < market.index('_positive(_raw(price_block.get("regularMarketPrice")))', market.index('def fetch_valuation_snapshot'))
          chart=Path('static/js/chart.js').read_text(encoding='utf-8')
          assert 'handleScale: { mouseWheel: false, pinch: true }' in chart
          fwd=Path('static/js/fwdper.js').read_text(encoding='utf-8')
          assert "tabId === 'ideas'" in fwd
          html=Path('templates/index.html').read_text(encoding='utf-8')
          assert 'user-scalable=no' not in html
          assert 'viewport-fit=cover' in html
          assert '20260911v1' in html
          print('core invariants OK')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_service.py static/js/chart.js static/js/fwdper.js templates/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'fix: prefer live prices and finalize mobile core UX'
            git push origin HEAD:main
          fi
