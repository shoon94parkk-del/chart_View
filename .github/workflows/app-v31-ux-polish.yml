name: App V31 UX Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-v31-ux-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V31
        run: python scripts/apply_v31_watchlist_ux.py
      - name: Validate V31
        run: |
          node --check static/js/screener.js
          node --check static/js/watchlist_v30.js
          node --check static/js/ux_patch.js
          grep -q 'screen-watch' static/js/screener.js
          grep -q 'home-watchlist-v30' static/js/watchlist_v30.js
          grep -q 'Make the in-memory defaults and persisted state identical' static/js/watchlist_v30.js
          grep -q 'watchlist-action-v31' static/css/screener.css
          grep -q 'home-watchlist-v31' static/css/watchlist_v30.css
          grep -q 'ux_patch.js?v=20260912v31' templates/index.html
      - name: Commit V31
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/screener.js static/js/watchlist_v30.js static/css/screener.css static/css/watchlist_v30.css static/js/ux_patch.js templates/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'fix: persist initial watchlist state'
            git push origin HEAD:main
          fi
