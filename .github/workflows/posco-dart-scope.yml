name: POSCO DART Revenue Scope Diagnostic
# parser-rerun: repeated-metric-pair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/posco-dart-scope.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Print POSCO company-wide revenue tables
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import io,json,os
          import pandas as pd
          import dart_business_service as d

          report=d._search_report_api(os.environ['DART_API_KEY'],'005490')
          year=d._report_year(report)
          broad=d._viewer_broad_business_web(report['rceptNo'])
          print('REPORT',json.dumps(report,ensure_ascii=False),'BROAD',len(broad))
          for di,html in enumerate(broad):
              try: tables=pd.read_html(io.StringIO(html))
              except Exception: continue
              for ti,table in enumerate(tables):
                  flat=' '.join(map(str,table.columns))+' '+table.astype(str).to_string(index=False)
                  if '매출' not in flat:
                      continue
                  scope_tokens=sum(token in flat for token in ('철강','인프라','이차전지','연결조정','친환경'))
                  if scope_tokens < 2:
                      continue
                  promoted=d._promote_embedded_header(d._flatten_columns(table))
                  pcols=list(promoted.columns)
                  label_info=d._label_column(pcols)
                  pair_info=d._repeated_revenue_metric_pair(promoted)
                  share_info=d._share_column(pcols)
                  amount_info=d._amount_column(pcols,allow_generic=bool(share_info))
                  parsed=d._extract_table(table,html,year)
                  print('PARSER_STAGE',json.dumps({
                      'table':ti,'promotedColumns':pcols,'label':label_info,
                      'pair':pair_info,'share':share_info,'amount':amount_info,
                  },ensure_ascii=False))
                  print('SCOPE_TABLE',json.dumps({
                      'doc':di,'table':ti,'shape':list(table.shape),
                      'columns':[str(x) for x in table.columns],
                      'scopeTokens':scope_tokens,'parsed':parsed,
                  },ensure_ascii=False))
                  print(table.head(25).to_string(index=False)[:14000])
          PY
