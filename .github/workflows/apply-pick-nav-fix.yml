name: Apply PICK Navigation Fix

on:
  push:
    branches:
      - fix/screener-pick-nav-stability-20260917
    paths:
      - '.github/workflows/apply-pick-nav-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/screener-pick-nav-stability-20260917
          fetch-depth: 1
      - name: Apply focused fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'static/js/home_watchlist_boot_v32c.js',
              "event.target.closest('.app-bottom-btn,.app-context-btn,.tab-btn')",
              "event.target.closest('.app-bottom-btn,.app-context-btn,.tab-btn,.ai-daily-more')",
          )
          replace(
              'templates/index.html',
              '/static/js/home_watchlist_boot_v32c.js?v=20260916v45',
              '/static/js/home_watchlist_boot_v32c.js?v=20260918v59',
          )
          replace(
              'main.py',
              'results = [row for row in (disk_snapshot.get("heatmap", {}).get("results") or []) if isinstance(row, dict)]',
              'results = [{**row, "stale": True} for row in (disk_snapshot.get("heatmap", {}).get("results") or []) if isinstance(row, dict)]',
          )
          replace(
              'tests/test_app_regressions.py',
              "disk = json.loads(Path('static/data/valuation_cache.json').read_text())",
              "disk = json.loads(Path('static/data/home_snapshot.json').read_text())",
          )

          mobile = Path('tests/mobile_smoke.cjs')
          text = mobile.read_text(encoding='utf-8')
          anchor = "      assert(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth), `${width}: home overflow`);\n"
          lines = [
              "      const pickHistory = page.locator('#ai-daily-section .ai-daily-more');",
              "      await pickHistory.waitFor({timeout:30000});",
              "      await pickHistory.click();",
              "      await delay(450);",
              "      await page.locator('#screener-tab.active').waitFor({timeout:10000});",
              "      await page.locator('[data-discovery-panel=\"ai-picks\"]:not([hidden])').waitFor({timeout:10000});",
              "      assert.equal(await page.locator('.app-bottom-btn[data-app-mode=\"discover\"]').evaluate(el => el.classList.contains('active')), true, `${width}: PICK history must keep discover navigation active`);",
              "      assert.equal(await page.locator('#home-tab').evaluate(el => el.classList.contains('active')), false, `${width}: PICK history bounced back to Home`);",
              "      await page.locator('.app-bottom-btn[data-app-mode=\"home\"]').click();",
              "      await page.locator('#home-tab.active').waitFor({timeout:10000});",
          ]
          addition = '\n'.join(lines) + '\n'
          if anchor not in text:
              raise SystemExit('mobile smoke insertion anchor missing')
          mobile.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY
      - name: Commit applied fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pick-nav-fix.yml
          git add main.py templates/index.html static/js/home_watchlist_boot_v32c.js tests/test_app_regressions.py tests/mobile_smoke.cjs
          git commit -m "fix: keep PICK history open and refresh boot cache"
          git push origin HEAD:fix/screener-pick-nav-stability-20260917
