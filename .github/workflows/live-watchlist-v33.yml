name: Live Watchlist V33

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-watchlist-v33.yml'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify live V33 watchlist
        run: |
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser = await chromium.launch({ headless:true });
            const context = await browser.newContext({
              viewport:{ width:384, height:824 },
              isMobile:true,
              hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'
            });
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror', e=>errors.push(String(e)));
            const res=await page.goto('https://chart-view-bsg6.onrender.com/?watch33=1',{ waitUntil:'domcontentloaded', timeout:60000 });
            assert(res && res.status()===200,'production HTTP failed');
            await page.waitForSelector('.app-bottom-nav',{ state:'visible', timeout:20000 });
            await page.waitForSelector('#home-watchlist-v30',{ state:'visible', timeout:20000 });

            const nav=await page.evaluate(()=>{
              const root=document.querySelector('.app-bottom-nav');
              const rr=root.getBoundingClientRect();
              const buttons=[...root.querySelectorAll('.app-bottom-btn')].map(el=>{const r=el.getBoundingClientRect();return {top:r.top,width:r.width,text:el.textContent.trim()}});
              return {height:rr.height,buttons};
            });
            assert.strictEqual(nav.buttons.length,5,'bottom nav must keep five destinations');
            assert(Math.max(...nav.buttons.map(x=>x.top))-Math.min(...nav.buttons.map(x=>x.top))<=2,'bottom nav wrapped');
            assert(nav.height<82,'bottom nav too tall');

            await page.waitForFunction(()=>[...document.querySelectorAll('#home-watchlist-v30 [data-home-watch-price]')].some(x=>x.textContent.trim()!=='-'),null,{timeout:20000});
            const home=await page.evaluate(()=>({
              cards:document.querySelectorAll('#home-watchlist-v30 [data-home-watch-open]').length,
              prices:[...document.querySelectorAll('#home-watchlist-v30 [data-home-watch-price]')].map(x=>x.textContent.trim()),
              returns:[...document.querySelectorAll('#home-watchlist-v30 [data-home-watch-return]')].map(x=>x.textContent.trim())
            }));
            assert(home.cards>=3,'home watchlist cards missing');
            assert(home.prices.some(x=>x!=='-'),'home prices did not load');
            assert(home.returns.some(x=>x!=='-'),'home returns did not load');

            await page.locator('.app-bottom-btn[data-app-mode="watchlist"]').tap();
            await page.waitForSelector('#watchlist-tab',{ state:'visible', timeout:10000 });
            await page.waitForSelector('.watchlist-v33-summary',{ state:'visible', timeout:10000 });
            await page.waitForFunction(()=>[...document.querySelectorAll('#watchlist-v30-grid [data-watch-price]')].some(x=>x.textContent.trim()!=='-'),null,{timeout:15000});

            const watch=await page.evaluate(()=>({
              cards:document.querySelectorAll('#watchlist-v30-grid [data-watch-card]').length,
              sortButtons:document.querySelectorAll('[data-watch-sort]').length,
              summary:[...document.querySelectorAll('.watchlist-v33-summary strong')].map(x=>x.textContent.trim()),
              prices:[...document.querySelectorAll('#watchlist-v30-grid [data-watch-price]')].map(x=>x.textContent.trim()),
              returns:[...document.querySelectorAll('#watchlist-v30-grid [data-watch-return]')].map(x=>x.textContent.trim()),
              scrollWidth:document.documentElement.scrollWidth,
              innerWidth:window.innerWidth
            }));
            assert(watch.cards>=3,'watchlist cards missing');
            assert.strictEqual(watch.sortButtons,4,'sort controls missing');
            assert(watch.prices.some(x=>x!=='-'),'watchlist prices did not load');
            assert(watch.returns.some(x=>x!=='-'),'watchlist returns did not load');
            assert(watch.scrollWidth<=watch.innerWidth+2,`horizontal overflow: ${watch.scrollWidth}/${watch.innerWidth}`);

            await page.locator('[data-watch-sort="return-desc"]').tap();
            assert(await page.locator('[data-watch-sort="return-desc"]').evaluate(el=>el.classList.contains('active')),'return sort did not activate');

            // Verify local quote cache paints before a deliberately delayed fresh API response.
            await page.route('**/api/compare**', async route=>{
              await new Promise(r=>setTimeout(r,2500));
              await route.continue();
            });
            await page.locator('.app-bottom-btn[data-app-mode="home"]').tap();
            await page.waitForSelector('#home-tab',{state:'visible',timeout:10000});
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#home-watchlist-v30 [data-home-watch-price]',{state:'visible',timeout:10000});
            await page.waitForTimeout(250);
            const cached=await page.locator('#home-watchlist-v30 [data-home-watch-price]').first().textContent();
            assert(cached && cached.trim()!=='-','cached quote did not paint immediately');

            if(errors.length) throw new Error('browser errors: '+errors.join(' | '));
            console.log('nav=',JSON.stringify(nav));
            console.log('home=',JSON.stringify(home));
            console.log('watch=',JSON.stringify(watch));
            console.log('cached_first_price=',cached.trim());
            console.log('LIVE WATCHLIST V33 PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
