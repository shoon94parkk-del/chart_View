name: Update Korean Stock Screener

on:
  schedule:
    # GitHub cron is a backup path. External watchdog/Cloudflare can dispatch this workflow.
    - cron: '0,20,40 7 * * 1-5'
    - cron: '0,20,40 8 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-screener.yml'
      - 'scripts/generate_screener.py'
      - 'scripts/export_screener_candidates.py'
      - 'scripts/update_ai_recommendations.py'
  workflow_run:
    workflows:
      - Update Macro Cache
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: korean-screener
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync latest main before deciding whether to run
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Check whether today's screener is already published
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          kst = timezone(timedelta(hours=9))
          now = datetime.now(kst)
          today = now.date().isoformat()
          event = os.environ.get('EVENT_NAME') or ''
          meta_path = Path('static/data/screener_meta.json')
          current = ''
          if meta_path.exists():
              try: current = str(json.loads(meta_path.read_text(encoding='utf-8')).get('tradeDate') or '')
              except Exception as exc: print('Unable to read existing screener meta:', exc)
          force = event in {'workflow_dispatch', 'push'}
          post_close_backup = event == 'workflow_run' and now.weekday() < 5 and now.hour >= 16
          scheduled = event == 'schedule'
          should_run = force or (current != today and (scheduled or post_close_backup))
          print(f'KST now={now.isoformat(timespec="seconds")} existing_trade_date={current or "missing"} event={event}')
          print('Decision:', 'RUN full screener' if should_run else 'SKIP')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'should_run={str(should_run).lower()}\n')
          PY

      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.should_run == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install screener dependencies
        if: steps.preflight.outputs.should_run == 'true'
        run: pip install 'yfinance>=0.2.50' pandas requests lxml html5lib

      - name: Generate exact-date screener
        if: steps.preflight.outputs.should_run == 'true'
        env:
          REQUIRE_KST_TRADE_DATE: '1'
        run: python scripts/generate_screener.py

      - name: Export and cross-check blended candidates
        if: steps.preflight.outputs.should_run == 'true'
        run: python scripts/export_screener_candidates.py

      - name: Validate AI input contract
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          top = json.loads(Path('static/data/screener_top100.json').read_text(encoding='utf-8'))
          meta = json.loads(Path('static/data/screener_meta.json').read_text(encoding='utf-8'))
          verification = top.get('verification') or {}
          stocks = top.get('stocks') or []
          trade_date = str(top.get('tradeDate') or '')
          exact = int(verification.get('exactDateUniverseCount') or 0)
          universe = int(meta.get('universeCount') or 0)
          candidate_count = int(verification.get('candidateCount') or 0)
          technical_count = int(verification.get('technicalDiscoveryCount') or 0)
          assert trade_date and trade_date == str(meta.get('tradeDate') or '')
          assert len(stocks) >= 100
          assert candidate_count == len(stocks)
          assert technical_count == 100
          assert all(str(row.get('date') or '') == trade_date for row in stocks)
          assert exact >= max(100, int(universe * 0.90))
          print('AI input OK:', trade_date, 'candidates=', len(stocks), 'exact=', exact, '/', universe)
          PY

      - name: Refresh published PICK ledger prices
        if: steps.preflight.outputs.should_run == 'true'
        run: python scripts/update_ai_recommendations.py

      - name: Commit screener and PICK price data
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/screener.json static/data/screener_meta.json static/data/screener_top100.json static/data/screener_validation.json static/data/ai_recommendations.json static/data/ai_daily_rankings_meta.json
          if git diff --cached --quiet; then
            echo "No screener or PICK price changes"
            exit 0
          fi
          git commit -m "data: refresh Korean stock screener and PICK prices"
          # Preserve generated data across concurrent main updates without touching AI ranking selections.
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main

      - name: Trigger Render deploy after screener publish
        if: steps.preflight.outputs.should_run == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; Render auto-deploy remains the fallback."
            exit 0
          fi
          curl --fail --show-error --silent --retry 3 --retry-delay 5 -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy requested after screener publish."
