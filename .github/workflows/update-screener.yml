name: Update Korean Stock Screener

on:
  schedule:
    # 17:30 KST on Korean weekdays, after the regular market close
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-screener.yml'
      - 'scripts/generate_screener.py'
      - 'scripts/export_screener_candidates.py'

permissions:
  contents: write

concurrency:
  group: korean-screener
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install screener dependencies
        run: pip install 'yfinance>=0.2.50' pandas requests lxml html5lib

      - name: Generate precomputed screener
        run: python scripts/generate_screener.py

      - name: Export and cross-check top 100 candidates
        run: python scripts/export_screener_candidates.py

      - name: Validate AI input contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          top = json.loads(Path('static/data/screener_top100.json').read_text(encoding='utf-8'))
          meta = json.loads(Path('static/data/screener_meta.json').read_text(encoding='utf-8'))
          verification = top.get('verification') or {}
          stocks = top.get('stocks') or []
          trade_date = str(top.get('tradeDate') or '')

          assert trade_date, 'missing tradeDate'
          assert trade_date == str(meta.get('tradeDate') or ''), 'tradeDate mismatch between meta and top100'
          assert len(stocks) == 100, f'top100 must contain 100 rows, got {len(stocks)}'
          assert verification.get('candidateExactDateCount') == 100, 'top100 contains stale-date rows'
          assert verification.get('priceMismatchCount', 0) == 0, 'secondary source price mismatch detected'
          print(
              'AI input OK:', trade_date,
              'verified=', verification.get('priceVerifiedCount'),
              'pending=', verification.get('pricePendingCount'),
          )
          PY

      - name: Refresh AI recommendation track record
        run: python scripts/update_ai_recommendations.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/screener.json static/data/screener_meta.json static/data/screener_top100.json static/data/screener_validation.json static/data/ai_recommendations.json
          if git diff --cached --quiet; then
            echo "No screener changes"
          else
            git commit -m "data: refresh Korean stock screener and validation"
            git push origin HEAD:main
          fi
