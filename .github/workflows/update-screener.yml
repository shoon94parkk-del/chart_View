name: Update Korean Stock Screener

on:
  schedule:
    # 17:30 KST on Korean weekdays, after the regular market close
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-screener.yml'

permissions:
  contents: write

concurrency:
  group: korean-screener
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install screener dependencies
        run: pip install 'yfinance>=0.2.50' pandas requests lxml html5lib

      - name: Generate precomputed screener
        run: python scripts/generate_screener.py

      - name: Export top 100 candidates
        run: python scripts/export_screener_candidates.py

      - name: Refresh AI recommendation track record
        run: python scripts/update_ai_recommendations.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/screener.json static/data/screener_meta.json static/data/screener_top100.json static/data/ai_recommendations.json
          if git diff --cached --quiet; then
            echo "No screener changes"
          else
            git commit -m "data: refresh Korean stock screener and recommendations"
            git push origin HEAD:main
          fi

