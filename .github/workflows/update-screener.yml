name: Update Korean Stock Screener

on:
  schedule:
    # 17:30 KST on Korean weekdays, after the regular market close
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: korean-screener
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Keep whole-market work off Render; the website only serves the JSON output.
      - name: Install screener dependencies
        run: pip install 'yfinance>=0.2.50' pandas requests lxml html5lib

      - name: Generate precomputed screener
        run: python scripts/generate_screener.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/screener.json static/data/screener_meta.json
          if git diff --cached --quiet; then
            echo "No screener changes"
          else
            git commit -m "data: refresh Korean stock screener"
            git push origin HEAD:main
          fi
