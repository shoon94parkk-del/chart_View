name: Live V32 Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-v32-production-smoke.yml'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify live V32c
        run: |
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:384,height:824}, isMobile:true, hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'
            });
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            const t0=Date.now();
            const response=await page.goto('https://chart-view-bsg6.onrender.com/?livev32c=1',{waitUntil:'domcontentloaded',timeout:60000});
            assert(response && response.status()===200,'production HTTP failed');
            await page.waitForSelector('.app-bottom-nav',{timeout:20000});
            assert.strictEqual(await page.locator('.app-bottom-btn').count(),5,'bottom nav should have 5 tabs');

            await page.waitForSelector('#home-market-v9',{state:'visible',timeout:20000});
            const marketReady=Date.now()-t0;
            console.log('market_ready_ms=',marketReady);
            assert(marketReady<15000,'home market took too long to appear');

            await page.waitForSelector('#home-watchlist-v30',{state:'visible',timeout:20000});
            const watchReady=Date.now()-t0;
            console.log('watchlist_ready_ms=',watchReady);
            assert(watchReady<15000,'home watchlist took too long to appear');
            const defaultNames=await page.locator('#home-watchlist-v30 strong').allTextContents();
            console.log('default_watchlist=',defaultNames.join(', '));
            assert(defaultNames.some(x=>x.includes('삼성전자')),'home watchlist missing Samsung Electronics');
            assert(defaultNames.some(x=>x.includes('엔비디아')),'home watchlist missing Nvidia');
            assert(defaultNames.some(x=>x.includes('애플')),'home watchlist missing Apple');

            await page.locator('.app-bottom-btn[data-app-mode="watchlist"]').tap();
            await page.waitForSelector('#watchlist-tab',{state:'visible',timeout:7000});
            assert.strictEqual(await page.evaluate(()=>history.state?.tab),'watchlist','watchlist history missing');
            assert((await page.locator('.watchlist-v30-card').count())>=3,'watchlist should show default stocks');

            await page.locator('.app-bottom-btn[data-app-mode="discover"]').tap();
            await page.waitForSelector('#screener-results .screen-add',{timeout:20000});
            assert.strictEqual(await page.evaluate(()=>history.state?.tab),'screener','screener history missing');
            const basis=await page.locator('#screener-tab').innerText();
            assert(basis.includes('2026-09-11'),'screener trade date is not 2026-09-11');

            await page.locator('#screener-results .screen-add').first().tap();
            await page.waitForSelector('#chart-tab',{state:'visible',timeout:10000});
            assert.strictEqual(await page.evaluate(()=>history.state?.tab),'chart','screener -> chart history missing');
            const sector=page.locator('.sector-section');
            assert(await sector.evaluate(el=>el.classList.contains('ux-collapsed')),'recommended stocks should start collapsed');

            await page.goBack().catch(()=>null);
            await page.waitForSelector('#screener-tab',{state:'visible',timeout:10000});
            assert.strictEqual(await page.evaluate(()=>history.state?.tab),'screener','back should return to screener');

            await page.locator('.app-bottom-btn[data-app-mode="market"]').tap();
            await page.waitForSelector('#macro-tab',{state:'visible',timeout:10000});
            assert.strictEqual(await page.evaluate(()=>history.state?.tab),'macro','market history missing');
            await page.locator('.app-context-btn[data-app-tab="tools"]').tap();
            await page.waitForSelector('#tools-tab',{state:'visible',timeout:7000});
            const toolCount=await page.locator('.investment-tool-card').count();
            console.log('tool_count=',toolCount);
            assert(toolCount===12,'investment tools count should be 12');

            if(errors.length) throw new Error('browser errors: '+errors.join(' | '));
            console.log('LIVE V32C PRODUCTION SMOKE PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
