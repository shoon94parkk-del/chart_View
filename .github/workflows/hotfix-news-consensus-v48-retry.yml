name: Apply News Consensus V48 Hotfix Retry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-news-consensus-v48-retry.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correct staged regex
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_news_consensus_v48.py')
          s = p.read_text(encoding='utf-8')
          old = r'([\d.]+%)[^.!?]{0,120}?(?:to|at)\s*(%s)" % money_pattern'
          new = r'([\d.]+%%)[^.!?]{0,120}?(?:to|at)\s*(%s)" % money_pattern'
          assert old in s, 'stock-loss regex target missing'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply focused patch
        run: python scripts/apply_news_consensus_v48.py
      - name: Verify focused regression tests
        run: |
          pip install -q -r requirements.txt pytest
          python -m py_compile news_summary_service.py consensus_service.py
          python -m pytest -q tests/test_news_consensus_regression_v48.py
      - name: Commit hotfix and clean one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-news-consensus-v48.yml .github/workflows/hotfix-news-consensus-v48-retry.yml scripts/apply_news_consensus_v48.py
          git add news_summary_service.py consensus_service.py tests/test_news_consensus_regression_v48.py
          git commit -m "fix: restore factual news summaries and consensus fallback"
          git push origin HEAD:main
