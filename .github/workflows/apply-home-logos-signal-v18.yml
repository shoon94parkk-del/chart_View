name: Apply Home Logos Signal V18

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_home_logos_signal_v18.py'
      - '.github/workflows/apply-home-logos-signal-v18.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply home logos and market signal
        run: python scripts/apply_home_logos_signal_v18.py
      - name: Validate generated assets
        run: |
          python -m py_compile scripts/apply_home_logos_signal_v18.py
          node --check static/js/home_brief_v8.js
          node --check static/js/ux_v3.js
          node --check static/js/ux_patch.js
          test -s static/logos/samsung.svg
          test -s static/logos/skhynix.svg
          test -s static/logos/nvidia.svg
          test -s static/logos/apple.svg
          test -s static/logos/microsoft.svg
          test -s static/logos/meta.svg
          test -s static/logos/tesla.svg
          test -s static/logos/google.svg
          grep -q 'home18-traffic' static/js/home_brief_v8.js
          grep -q 'home_brief_v8.js?v=20260911v18' static/js/ux_v3.js
          grep -q 'ux_patch.js?v=20260911v18' templates/index.html
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/logos static/js/home_brief_v8.js static/css/home_brief_v8.css static/js/ux_v3.js static/js/ux_patch.js templates/index.html
          git commit -m 'feat: local brand logos and macro signal light'
          git push
