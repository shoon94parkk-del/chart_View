name: App UX Live Smoke

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'market_service.py'
      - 'static/js/ux_patch.js'
      - 'static/js/ux_v3.js'
      - 'static/js/home_brief_v8.js'
      - 'static/js/home_market_v9.js'
      - 'static/js/valuation_overview_v4.js'
      - 'static/js/revision_radar.js'
      - 'static/js/decision_ux_v7.js'
      - 'static/css/ux_v3.css'
      - 'static/css/home_brief_v8.css'
      - 'static/css/home_market_v9.css'
      - 'static/css/decision_ux_v7.css'
      - 'static/css/bottom_nav_v6.css'
      - 'static/css/app_header_v5.css'
      - 'static/data/consensus_cache.json'
      - '.github/workflows/phase3-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          market=Path('market_service.py').read_text(encoding='utf-8')
          start=market.index('def fetch_quote_snapshot')
          block=market[start:market.index('def fetch_history_series', start)]
          assert 'period="1d", interval="5m"' in block
          assert 'current = good[-1] if good else' in block
          assert '_positive(meta.get("chartPreviousClose")) or _positive(meta.get("previousClose"))' in block
          assert '"source": "Yahoo Chart 5m"' in block
          main=Path('main.py').read_text(encoding='utf-8')
          assert '@app.get("/api/market-now")' in main and '"basis": "previous_close"' in main
          print('source market invariants OK')
          PY
      - name: Wait for app build and verify public assets
        run: |
          set -euo pipefail
          BASE='https://chart-view-bsg6.onrender.com'

          ready=0
          for i in $(seq 1 42); do
            code=$(curl -sS -o /tmp/home_market.js -w '%{http_code}' "$BASE/static/js/home_market_v9.js?v=20260911v9" || true)
            api_code=$(curl -sS -o /tmp/market_now.json -w '%{http_code}' "$BASE/api/market-now" || true)
            if [ "$code" = '200' ] && [ "$api_code" = '200' ] \
              && grep -q "fetch('/api/market-now'" /tmp/home_market.js \
              && grep -q '직전 종가 대비' /tmp/home_market.js \
              && grep -q 'Yahoo Chart 5m' /tmp/market_now.json; then
              ready=1
              echo "intraday market home build detected on attempt=$i"
              break
            fi
            echo "attempt=$i assets=$code api=$api_code: waiting for intraday deploy"
            sleep 10
          done
          test "$ready" = '1'

          curl -fsSL "$BASE/static/js/ux_v3.js?v=20260911v4" -o /tmp/app_ux.js
          curl -fsSL "$BASE/static/js/home_brief_v8.js?v=20260911v8" -o /tmp/home_brief.js
          curl -fsSL "$BASE/static/css/home_market_v9.css?v=20260911v9" -o /tmp/home_market.css
          curl -fsSL "$BASE/static/data/screener.json" -o /tmp/screener.json
          curl -fsSL "$BASE/static/data/consensus_cache.json" -o /tmp/consensus.json
          curl -fsSL "$BASE/health" -o /tmp/health.json
          curl -fsSL --get --data-urlencode 'tickers=AAPL,005930.KS' "$BASE/api/valuation" -o /tmp/valuation.json
          curl -fsSL --get --data-urlencode 'ticker=AAPL' "$BASE/api/consensus" -o /tmp/aapl_consensus.json
          curl -fsSL --get --data-urlencode 'ticker=AAPL' --data-urlencode 'years=3' "$BASE/api/valuation-band" -o /tmp/aapl_band.json
          curl -fsSL --max-time 30 "$BASE/api/macro" -o /tmp/macro.json

          node --check /tmp/app_ux.js
          node --check /tmp/home_brief.js
          node --check /tmp/home_market.js

          grep -q 'data-app-mode="home"' /tmp/app_ux.js
          grep -q '오늘은 여기부터 보세요' /tmp/home_brief.js
          grep -q '오늘의 시장' /tmp/home_market.js
          grep -q '미 10년물' /tmp/home_market.js
          grep -q 'WTI 유가' /tmp/home_market.js
          grep -q '원/달러' /tmp/home_market.js
          grep -q '직전 종가 대비' /tmp/home_market.js
          ! grep -q '/api/compare' /tmp/home_market.js
          ! grep -q '__openAppTab' /tmp/home_market.js
          grep -q 'body.home-clean-mode .home-v8-hero' /tmp/home_market.css
          grep -q 'text-align: center' /tmp/home_market.css
          grep -q 'cursor: default' /tmp/home_market.css

          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          health=json.load(open('/tmp/health.json'))
          assert health.get('status') == 'ok', health

          market=json.load(open('/tmp/market_now.json'))
          assert market.get('basis') == 'previous_close', market
          assert market.get('date') == datetime.now(ZoneInfo('Asia/Seoul')).strftime('%Y-%m-%d'), market.get('date')
          market_rows={x.get('ticker'):x for x in market.get('results', [])}
          required=('^GSPC','^IXIC','^TNX','^VIX','CL=F','KRW=X')
          missing=[x for x in required if x not in market_rows or market_rows[x].get('price') is None]
          assert not missing, ('market snapshot missing', missing, market.get('errors'))
          for ticker in required:
              assert market_rows[ticker].get('change') is not None, (ticker, market_rows[ticker])
              assert market_rows[ticker].get('source') == 'Yahoo Chart 5m', (ticker, market_rows[ticker])

          # Sanity bands catch stale range-baseline errors without hard-coding market values.
          assert abs(float(market_rows['^GSPC']['change'])) < 10
          assert abs(float(market_rows['^IXIC']['change'])) < 10
          assert abs(float(market_rows['KRW=X']['change'])) < 10

          screener=json.load(open('/tmp/screener.json'))
          stocks=screener.get('stocks', [])
          assert len(stocks) > 2000
          jyp=[x for x in stocks if 'jyp' in str(x.get('name','')).lower()]
          assert jyp and any(str(x.get('symbol','')).startswith('035900') for x in jyp)

          consensus=json.load(open('/tmp/consensus.json'))
          assert len(consensus.get('quotes', {})) >= 40

          valuation=json.load(open('/tmp/valuation.json'))
          rows={x.get('ticker'):x for x in valuation.get('stocks', [])}
          for ticker in ('AAPL','005930.KS'):
              assert ticker in rows and rows[ticker].get('price'), (ticker, rows.get(ticker))

          aapl_cons=json.load(open('/tmp/aapl_consensus.json'))
          assert (aapl_cons.get('periods') or {}).get('0y')

          band=json.load(open('/tmp/aapl_band.json'))
          assert ((band.get('per') or {}).get('stats') or {}).get('percentile') is not None

          macro=json.load(open('/tmp/macro.json'))
          assert macro.get('cacheMode') == 'precomputed'
          assert len(macro.get('results', [])) == 13

          print('Intraday home market smoke OK:', {k:(market_rows[k]['price'], market_rows[k]['change']) for k in required})
          PY
