name: Probe Macro CSV Feeds
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-dbnomics.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify macro data sources
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request

          equibles = [
              't10y2y','t10y3m','bamlh0a0hym2','rrpontsyd','t10yie',
              'unrate','rsafs','walcl','m2sl','fedfunds','vixcls'
          ]
          failures=[]
          for sym in equibles:
              try:
                  url=f'https://equibles.com/economicdata/{sym}.csv'
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      text=r.read().decode('utf-8-sig','replace')
                  rows=list(csv.DictReader(io.StringIO(text)))
                  valid=[]
                  for row in rows:
                      date=(row.get('Date') or '').strip()
                      value=(row.get('Value') or '').replace(',','').strip()
                      if date and value not in ('','.','NA','N/A'):
                          valid.append((date,float(value)))
                  valid.sort(key=lambda x:x[0])
                  if not valid: raise RuntimeError('no valid observations')
                  print(sym,'OK','count=',len(valid),'latest=',valid[-1])
              except Exception as exc:
                  failures.append((sym,str(exc)))
                  print(sym,'FAIL',exc)

          dbnomics = {
              'DFII10':'https://api.db.nomics.world/v22/series/FED/H15/RIFLGFCY10_XII_N.B?observations=1',
              'WTREGEN':'https://api.db.nomics.world/v22/series/FED/H41/RESPPLLDT_N.WW?observations=1',
          }
          for sym,url in dbnomics.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=25) as r: data=json.load(r)
                  docs=((data.get('series') or {}).get('docs') or [])
                  if not docs: raise RuntimeError('no docs')
                  doc=docs[0]
                  periods=doc.get('period') or []
                  values=doc.get('value') or []
                  valid=[(str(d),float(v)) for d,v in zip(periods,values) if d and v is not None]
                  valid.sort(key=lambda x:x[0])
                  if not valid: raise RuntimeError('no observations')
                  print(sym,'OK','series=',doc.get('series_code'),'count=',len(valid),'latest=',valid[-1])
              except Exception as exc:
                  failures.append((sym,str(exc)))
                  print(sym,'FAIL',exc)

          if failures:
              raise SystemExit(f'failed feeds: {failures}')
          print('ALL_FEEDS_OK',13)
          PY
