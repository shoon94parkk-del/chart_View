name: Probe DBnomics Macro Mappings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-dbnomics.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Equibles observation markup
        run: |
          python - <<'PY'
          import re, urllib.request
          for sym in ['t10y2y','walcl','rrpontsyd','bamlh0a0hym2','rsafs','vixcls']:
              url=f'https://equibles.com/economicdata/{sym}'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  text=r.read().decode('utf-8','replace')
              print('\n###',sym,'bytes',len(text))
              for needle in ['2026-09-09','2026-09-08','2026-09-07','2026-09-02','2026-07-01']:
                  p=text.find(needle)
                  if p>=0:
                      print('needle',needle,'snippet=',repr(text[max(0,p-250):p+500]))
                      break
              for pat in [r'"date":"(20\d\d-\d\d-\d\d)"[^}]{0,300}?"value":([^,}\]]+)', r'>(20\d\d-\d\d-\d\d)<.*?>(-?[\d,]+(?:\.\d+)?)<']:
                  m=re.search(pat,text,re.S)
                  print('pattern',pat[:25],'match=',m.groups() if m else None)
          PY
