name: Probe DBnomics Macro Mappings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-dbnomics.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe macro mirrors
        run: |
          python - <<'PY'
          import re, urllib.request
          for sym in ['t10y2y','walcl','rrpontsyd','bamlh0a0hym2','rsafs','vixcls']:
              url=f'https://equibles.com/economicdata/{sym}'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      text=r.read().decode('utf-8','replace')
                  matches=re.findall(r'(20\d{2}-\d{2}-\d{2}).{0,120}?(-?\d[\d,]*(?:\.\d+)?)',text,re.S)
                  print(sym,'status=200','bytes=',len(text),'matches=',len(matches),'tail=',matches[-3:])
              except Exception as e:
                  print(sym,'ERR',repr(e))
          PY
