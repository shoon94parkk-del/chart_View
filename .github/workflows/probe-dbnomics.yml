name: Probe DBnomics Macro Mappings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-dbnomics.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query DBnomics candidates
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          def dataset(provider,dataset,q,limit=20):
              url=f'https://api.db.nomics.world/v22/series/{provider}/{dataset}?observations=0&limit={limit}&q='+urllib.parse.quote(q)
              print('\n###',provider,dataset,q,url)
              try:
                  d=get(url)
                  docs=(d.get('series') or {}).get('docs') or []
                  for x in docs[:limit]:
                      print(x.get('series_code'), '|', x.get('series_name') or x.get('name'))
              except Exception as e: print('ERR',repr(e))

          def search(q,limit=20):
              url='https://api.db.nomics.world/v22/series?observations=0&limit='+str(limit)+'&q='+urllib.parse.quote(q)
              print('\n### GLOBAL',q,url)
              try:
                  d=get(url)
                  docs=(d.get('series') or {}).get('docs') or []
                  for x in docs[:limit]:
                      print(x.get('provider_code'),x.get('dataset_code'),x.get('series_code'),'|',x.get('series_name') or x.get('name'))
              except Exception as e: print('ERR',repr(e))

          dataset('FED','H15','Federal funds',30)
          dataset('FED','H15','Inflation indexed 10-year',30)
          dataset('FED','H41','Total assets',30)
          dataset('FED','H41','Treasury general account',30)
          dataset('FED','H41','U.S. Treasury',30)
          search('reverse repurchase agreements Federal Reserve overnight',30)
          search('US retail sales food services monthly',30)
          search('high yield option adjusted spread US',30)
          PY
