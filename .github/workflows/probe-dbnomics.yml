name: Verify Live Macro Endpoint
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-dbnomics.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check live health and macro payload
        run: |
          python - <<'PY'
          import json, time, urllib.request

          base='https://chart-view-bsg6.onrender.com'

          def get(path, attempts=5):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(base+path, headers={'User-Agent':'chart-view-smoke-test/1.0'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body=r.read().decode('utf-8')
                          print(path, 'HTTP', r.status, 'bytes', len(body))
                          return json.loads(body)
                  except Exception as exc:
                      last=exc
                      print(path, 'attempt', i+1, 'failed:', repr(exc))
                      time.sleep(5)
              raise last

          health=get('/health')
          assert health.get('status') == 'ok', health

          data=get('/api/macro')
          rows=data.get('results') or []
          symbols={(x.get('original_symbol') or x.get('symbol')) for x in rows}
          required={'T10Y2Y','T10Y3M','BAMLH0A0HYM2','RRPONTSYD','DFII10','T10YIE','UNRATE','RSAFS','WALCL','WTREGEN','M2SL','FEDFUNDS','^VIX'}
          assert data.get('cacheMode') == 'precomputed', data.get('cacheMode')
          assert len(rows) == 13, len(rows)
          assert symbols == required, (required-symbols, symbols-required)
          assert all(x.get('chart_data') for x in rows)
          assert data.get('staleCount') == 0, data.get('staleCount')
          assert not data.get('net_liquidity', {}).get('error'), data.get('net_liquidity')
          print('LIVE_MACRO_OK', 'rows=',len(rows), 'fresh=',data.get('freshCount'), 'stale=',data.get('staleCount'), 'generatedAt=',data.get('generatedAt'))
          print('SAMPLE', {x.get('original_symbol'): (x.get('value'), x.get('asOf')) for x in rows[:5]})
          PY
