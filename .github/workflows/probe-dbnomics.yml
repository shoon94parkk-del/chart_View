name: Probe Macro CSV Feeds
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-dbnomics.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Equibles CSV feeds
        run: |
          python - <<'PY'
          import csv, io, urllib.request
          symbols = [
              't10y2y','t10y3m','bamlh0a0hym2','rrpontsyd','dfii10','t10yie',
              'unrate','rsafs','walcl','wtregen','m2sl','fedfunds','vixcls'
          ]
          failures=[]
          for sym in symbols:
              url=f'https://equibles.com/economicdata/{sym}.csv'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      text=r.read().decode('utf-8-sig','replace')
                  rows=list(csv.reader(io.StringIO(text)))
                  valid=[row for row in rows[1:] if len(row)>=2 and row[0] and row[1] not in ('','.','NA','N/A')]
                  if not valid:
                      raise RuntimeError('no valid observations')
                  print(sym,'OK','header=',rows[0],'rows=',len(valid),'latest=',valid[-1][:2])
              except Exception as exc:
                  failures.append((sym,str(exc)))
                  print(sym,'FAIL',exc)
          if failures:
              raise SystemExit(f'failed feeds: {failures}')
          print('ALL_FEEDS_OK',len(symbols))
          PY
