name: UI V10 Check

on:
  push:
    branches: [main]
    paths:
      - 'static/js/home_priority_v10.js'
      - 'static/css/home_priority_v10.css'
      - 'static/css/valuation_matrix_v10.css'
      - 'static/js/valuation_meta.js'
      - 'static/js/valuation_overview_v4.js'
      - 'static/js/ux_patch.js'
      - '.github/workflows/ui-v10-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Source checks
        run: |
          set -euo pipefail
          node --check static/js/home_priority_v10.js
          node --check static/js/valuation_overview_v4.js
          node --check static/js/valuation_meta.js
          node --check static/js/ux_patch.js
          grep -q 'EPS 상향 <b>30%</b>' static/js/home_priority_v10.js
          grep -q '상향 의견 폭 <b>15%</b>' static/js/home_priority_v10.js
          grep -q '주가 미반영 <b>20%</b>' static/js/home_priority_v10.js
          grep -q '밸류 <b>20%</b>' static/js/home_priority_v10.js
          grep -q '추세 <b>15%</b>' static/js/home_priority_v10.js
          grep -q '매수 점수가 아니라' static/js/home_priority_v10.js
          grep -q 'grid-template-columns:repeat(5' static/css/home_priority_v10.css
          grep -q 'position:sticky' static/css/valuation_matrix_v10.css
          grep -q 'left:0!important' static/css/valuation_matrix_v10.css
          grep -q 'width:608px!important' static/css/valuation_matrix_v10.css
          grep -q 'metric-provenance{display:none' static/css/valuation_matrix_v10.css
          grep -q 'valuation-compact-cell' static/js/valuation_meta.js
          grep -q 'valuation_meta.js?v=20260911v2' static/js/ux_patch.js
          grep -q 'valuation_matrix_v10.css?v=20260911v11' static/js/ux_patch.js
          grep -q '밸류에이션 비교표' static/js/valuation_overview_v4.js
          echo 'UI compact valuation source checks OK'
      - name: Wait for production and smoke
        run: |
          set -euo pipefail
          BASE='https://chart-view-bsg6.onrender.com'
          ready=0
          for i in $(seq 1 45); do
            vm=$(curl -sS -o /tmp/valuation_matrix.css -w '%{http_code}' "$BASE/static/css/valuation_matrix_v10.css?v=20260911v11" || true)
            meta=$(curl -sS -o /tmp/valuation_meta.js -w '%{http_code}' "$BASE/static/js/valuation_meta.js?v=20260911v2" || true)
            up=$(curl -sS -o /tmp/ux_patch.js -w '%{http_code}' "$BASE/static/js/ux_patch.js?v=20260911v1" || true)
            if [ "$vm" = '200' ] && [ "$meta" = '200' ] && [ "$up" = '200' ] \
              && grep -q 'width:608px!important' /tmp/valuation_matrix.css \
              && grep -q 'valuation-compact-cell' /tmp/valuation_meta.js \
              && grep -q 'valuation_matrix_v10.css?v=20260911v11' /tmp/ux_patch.js; then
              ready=1
              echo "compact valuation production build detected attempt=$i"
              break
            fi
            echo "attempt=$i matrix=$vm meta=$meta loader=$up waiting"
            sleep 10
          done
          test "$ready" = '1'
          curl -fsSL --get --data-urlencode 'tickers=005930.KS,000660.KS' "$BASE/api/valuation" -o /tmp/valuation.json
          python - <<'PY'
          import json
          val=json.load(open('/tmp/valuation.json'))
          rows=val.get('stocks') or []
          assert len(rows) >= 2, val
          for row in rows[:2]:
              assert row.get('price') is not None
              assert row.get('forwardPE') is not None
          print('compact valuation production smoke OK', {'stocks': len(rows)})
          PY
