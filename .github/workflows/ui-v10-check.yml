name: UI V10 Check

on:
  push:
    branches: [main]
    paths:
      - 'static/js/home_priority_v10.js'
      - 'static/css/home_priority_v10.css'
      - 'static/css/valuation_matrix_v10.css'
      - 'static/js/valuation_meta.js'
      - 'static/js/release_ui_v40.js'
      - 'static/js/valuation_overview_v4.js'
      - 'static/js/ux_patch.js'
      - 'tests/frontend.test.cjs'
      - 'scripts/build_frontend_bundle.py'
      - 'scripts/build_boot_bundle.py'
      - 'scripts/verify_deployed_release.py'
      - 'templates/index.html'
      - '.github/workflows/ui-v10-check.yml'
  pull_request:
    paths:
      - 'static/js/home_priority_v10.js'
      - 'static/css/home_priority_v10.css'
      - 'static/css/valuation_matrix_v10.css'
      - 'static/js/valuation_meta.js'
      - 'static/js/release_ui_v40.js'
      - 'static/js/valuation_overview_v4.js'
      - 'static/js/ux_patch.js'
      - 'tests/frontend.test.cjs'
      - 'scripts/build_frontend_bundle.py'
      - 'scripts/build_boot_bundle.py'
      - 'scripts/verify_deployed_release.py'
      - 'templates/index.html'
      - '.github/workflows/ui-v10-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source checks
        run: |
          set -euo pipefail
          node --check static/js/home_priority_v10.js
          node --check static/js/valuation_overview_v4.js
          node --check static/js/valuation_meta.js
          node --check static/js/ux_patch.js
          grep -q 'EPS 상향 <b>30%</b>' static/js/home_priority_v10.js
          grep -q '상향 의견 폭 <b>15%</b>' static/js/home_priority_v10.js
          grep -q '주가 미반영 <b>20%</b>' static/js/home_priority_v10.js
          grep -q '밸류 <b>20%</b>' static/js/home_priority_v10.js
          grep -q '추세 <b>15%</b>' static/js/home_priority_v10.js
          grep -q '매수 점수가 아니라' static/js/home_priority_v10.js
          grep -q 'grid-template-columns:repeat(5' static/css/home_priority_v10.css
          grep -q '밸류에이션 비교표' static/js/valuation_overview_v4.js
          node --test tests/frontend.test.cjs
          python scripts/build_frontend_bundle.py --check
          python scripts/build_boot_bundle.py --check
          echo 'UI compact valuation source checks OK'
      - name: Wait for production and smoke
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          APP_URL: https://chart-view-pkv8.onrender.com
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/verify_deployed_release.py --attempts 45
          curl -fsSL --connect-timeout 10 --max-time 30 --get --data-urlencode 'tickers=005930.KS,000660.KS' "$APP_URL/api/valuation" -o /tmp/valuation.json
          python - <<'PY'
          import json, math
          val=json.load(open('/tmp/valuation.json'))
          rows=val.get('stocks') or []
          expected={'005930.KS', '000660.KS'}
          by_ticker={row.get('ticker'): row for row in rows}
          assert expected <= by_ticker.keys(), 'requested valuation stocks missing'
          for ticker in expected:
              row=by_ticker[ticker]
              price=row.get('price')
              assert isinstance(price, (int,float)) and not isinstance(price,bool) and math.isfinite(price) and price > 0, (ticker, 'price')
              forward=row.get('forwardPE')
              assert forward is None or (isinstance(forward,(int,float)) and not isinstance(forward,bool) and math.isfinite(forward)), (ticker, 'forwardPE')
          print('compact valuation production smoke OK', {'stocks': len(rows)})
          PY
          python scripts/verify_deployed_release.py --attempts 1 --output test-results/release-after.json
