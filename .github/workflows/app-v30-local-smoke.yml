name: App V30 Local Mobile Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-v30-local-smoke.yml'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install app and browser
        run: |
          pip install -r requirements.txt
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Start local app
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8080 >/tmp/chartview.log 2>&1 &
          echo $! >/tmp/chartview.pid
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/chartview.log
          exit 1
      - name: Mobile interaction regression
        shell: bash
        run: |
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:384,height:824},isMobile:true,hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'
            });
            const page=await context.newPage();
            const response=await page.goto('http://127.0.0.1:8080/?v30local=1',{waitUntil:'domcontentloaded',timeout:60000});
            assert(response && response.status()===200,'home failed');
            await page.waitForSelector('.app-bottom-nav',{timeout:20000});
            await page.waitForTimeout(1200);

            const labels=(await page.locator('.app-bottom-btn > span:last-child').allTextContents()).map(x=>x.trim());
            console.log('bottom=',labels);
            assert.deepStrictEqual(labels,['홈','관심','종목분석','종목발굴','시장']);
            assert(await page.locator('.app-bottom-btn[data-app-mode="home"]').evaluate(x=>x.classList.contains('active')));

            await page.locator('.app-bottom-btn[data-app-mode="watchlist"]').tap();
            await page.waitForSelector('#watchlist-tab',{state:'visible',timeout:5000});
            let count=await page.locator('.watchlist-v30-card').count();
            console.log('default_watchlist=',count);
            assert.strictEqual(count,3);

            const search=page.locator('#watchlist-v30-search');
            await search.fill('SK하이닉스');
            await page.waitForSelector('[data-watch-search-symbol="000660.KS"]',{timeout:5000});
            await page.locator('[data-watch-search-symbol="000660.KS"]').tap();
            count=await page.locator('.watchlist-v30-card').count();
            console.log('after_add=',count);
            assert.strictEqual(count,4);

            await page.locator('[data-watch-open="005930.KS"]').tap();
            await page.waitForSelector('#chart-tab',{state:'visible',timeout:5000});
            assert(await page.locator('.app-bottom-btn[data-app-mode="analysis"]').evaluate(x=>x.classList.contains('active')),'analysis nav not active');
            await page.waitForTimeout(300);
            const stars=await page.locator('#ticker-tags .tag-watchlist').count();
            console.log('ticker_stars=',stars);
            assert(stars>=3,'watchlist stars missing');

            await page.locator('.app-bottom-btn[data-app-mode="market"]').tap();
            await page.waitForSelector('#macro-tab',{state:'visible',timeout:5000});
            assert(await page.locator('.app-context-nav[data-app-context="market"]').isVisible(),'market context missing');
            await page.locator('.app-context-btn[data-app-tab="tools"]').tap();
            await page.waitForSelector('#tools-tab',{state:'visible',timeout:5000});
            assert((await page.locator('.investment-tool-card').count())===12,'tools count mismatch');

            await page.evaluate(()=>history.back());
            await page.waitForTimeout(500);
            assert(await page.locator('#macro-tab').isVisible(),'history back did not restore macro');

            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForSelector('.app-bottom-nav',{timeout:15000});
            await page.locator('.app-bottom-btn[data-app-mode="watchlist"]').tap();
            await page.waitForSelector('#watchlist-tab',{state:'visible',timeout:5000});
            count=await page.locator('.watchlist-v30-card').count();
            console.log('after_reload_watchlist=',count);
            assert.strictEqual(count,4,'watchlist did not persist');
            const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('chartview-watchlist-v1')||'[]'));
            assert(saved.some(x=>x.symbol==='000660.KS'),'SK Hynix missing from storage');

            console.log('APP V30 LOCAL MOBILE SMOKE PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
      - name: Print server log on failure
        if: failure()
        run: tail -200 /tmp/chartview.log || true
