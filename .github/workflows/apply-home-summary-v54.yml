name: Apply home summary v54 asset

on:
  push:
    branches:
      - feature/home-summary-v54
    paths:
      - .github/workflows/apply-home-summary-v54.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/home-summary-v54
      - name: Add versioned home summary asset
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('templates/index.html')
          text = path.read_text(encoding='utf-8')
          asset = '    <script defer src="/static/js/home_summary_v54.js?v=20260917v54"></script>\n'
          anchor = '    <script defer src="/static/js/ui_continuity_v53.js?v=20260916v53"></script>\n'
          if asset not in text:
              if anchor not in text:
                  raise SystemExit('ui continuity anchor not found')
              text = text.replace(anchor, anchor + asset, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched template
        run: |
          if git diff --quiet -- templates/index.html; then
            echo "Template already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html
          git commit -m "ui: load home summary v54"
          git push origin HEAD:feature/home-summary-v54
