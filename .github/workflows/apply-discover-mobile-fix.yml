name: Apply Discover Mobile UX Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-discover-mobile-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix discover search chrome and mobile screener cards
        run: |
          python - <<'PY'
          from pathlib import Path

          ux = Path('static/js/ux_v3.js')
          text = ux.read_text(encoding='utf-8')
          old = """    const utilityHeader = document.querySelector('.header');
    if (utilityHeader) utilityHeader.hidden = mode === 'home';"""
          new = """    const utilityHeader = document.querySelector('.header');
    if (utilityHeader) {
      const showStockSearch = mode === 'analysis';
      utilityHeader.hidden = !showStockSearch;
      utilityHeader.style.setProperty('display', showStockSearch ? 'block' : 'none', 'important');
    }"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('ux_v3 header visibility block not found')
          ux.write_text(text, encoding='utf-8')

          css = Path('static/css/screener.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* mobile-card-v2: no metric overlap */'
          patch = r'''

/* mobile-card-v2: no metric overlap */
@media(max-width:720px){
  .screener-table tbody tr{
    grid-template-columns:repeat(2,minmax(0,1fr));
    column-gap:8px;
    row-gap:8px;
    padding:14px;
  }
  .screener-table td{
    display:block;
    width:auto;
    min-width:0;
    padding:10px!important;
    border:0!important;
    border-radius:11px;
    background:#f7f8fa;
    text-align:left;
    overflow:hidden;
  }
  .screener-table td::before{
    display:block;
    margin:0 0 5px;
    color:#8b95a1;
    font-size:10px;
    font-weight:700;
    line-height:1.25;
    text-align:left;
    white-space:normal;
  }
  .screener-table td:first-child{
    grid-column:1/-1;
    display:block;
    padding:0 0 11px!important;
    margin:0 0 2px;
    border-radius:0;
    border-bottom:1px solid #f2f4f6!important;
    background:transparent;
    overflow:visible;
  }
  .screener-table td:first-child::before{display:none}
  .screener-table td:nth-child(7){grid-column:1/-1}
  .screener-table td:nth-child(9){
    grid-column:1/-1;
    padding:10px 0 0!important;
    margin-top:2px;
    border-radius:0;
    border-top:1px solid #f2f4f6!important;
    background:transparent;
    overflow:visible;
  }
  .screener-table td:nth-child(9)::before{display:none}
  .screener-table td>div,
  .screener-table td>strong,
  .screener-table td>span{
    max-width:100%;
  }
  .screener-table td:nth-child(2)>div:first-child,
  .screener-table td:nth-child(3)>strong,
  .screener-table td:nth-child(4)>strong,
  .screener-table td:nth-child(6),
  .screener-table td:nth-child(7)>strong{
    font-size:14px;
    font-weight:750;
    line-height:1.35;
  }
  .screener-table td:nth-child(2)>div+div{margin-top:3px;font-size:11px}
  .screen-badge{
    max-width:100%;
    padding:4px 6px;
    font-size:9.5px;
    line-height:1.3;
    white-space:normal;
    overflow-wrap:anywhere;
  }
  .screen-sub{
    display:block;
    margin-top:5px;
    font-size:9px;
    line-height:1.35;
    white-space:normal;
  }
  .screen-score{min-width:34px;height:28px}
  .screen-actions{width:100%;grid-template-columns:1fr 1fr;gap:8px}
  .screen-add,.screen-idea{width:100%;min-height:42px}
}

@media(max-width:380px){
  .screener-table tbody tr{column-gap:6px;row-gap:6px;padding:12px}
  .screener-table td{padding:9px!important}
  .screener-table td:nth-child(2)>div:first-child,
  .screener-table td:nth-child(3)>strong,
  .screener-table td:nth-child(4)>strong,
  .screener-table td:nth-child(6),
  .screener-table td:nth-child(7)>strong{font-size:13px}
}
'''
          if marker not in c:
              c += patch
              css.write_text(c, encoding='utf-8')

          patchjs = Path('static/js/ux_patch.js')
          p = patchjs.read_text(encoding='utf-8')
          p = p.replace('/static/css/screener.css?v=20260911v1', '/static/css/screener.css?v=20260911v2')
          p = p.replace('/static/js/ux_v3.js?v=20260911v4', '/static/js/ux_v3.js?v=20260911v5')
          patchjs.write_text(p, encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check static/js/ux_v3.js
          grep -q "showStockSearch = mode === 'analysis'" static/js/ux_v3.js
          grep -q 'mobile-card-v2: no metric overlap' static/css/screener.css
          grep -q 'screener.css?v=20260911v2' static/js/ux_patch.js
          grep -q 'ux_v3.js?v=20260911v5' static/js/ux_patch.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/ux_v3.js static/css/screener.css static/js/ux_patch.js
          if git diff --cached --quiet; then
            echo 'No patch needed'
          else
            git commit -m 'fix: clean discover header and mobile screener cards'
            git push
          fi
