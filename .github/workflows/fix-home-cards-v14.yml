name: Fix Home Cards V14

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_home_cards_v14.py'
      - '.github/workflows/fix-home-cards-v14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V14 rerender fix
        run: python scripts/fix_home_cards_v14.py
      - name: Validate fixed assets
        run: |
          set -euo pipefail
          node --check static/js/home_cards_v14.js
          node --check static/js/ux_patch.js
          grep -q "qsa('.home14-stack', root)" static/js/home_cards_v14.js
          grep -q "!qs('#home-v8-body .home14-stack')" static/js/home_cards_v14.js
          grep -q 'home_cards_v14.js?v=20260911v14a' static/js/ux_patch.js
          grep -q 'home_cards_v14.css?v=20260911v14a' static/js/ux_patch.js
          grep -q '.home14-logo{position:relative' static/css/home_cards_v14.css
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/home_cards_v14.js static/css/home_cards_v14.css static/js/ux_patch.js
          if git diff --cached --quiet; then
            echo 'V14 rerender fix already applied'
          else
            git commit -m 'fix: stabilize mobile home cards v14'
            git push
          fi
