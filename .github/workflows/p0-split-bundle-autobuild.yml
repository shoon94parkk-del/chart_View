name: P0 split bundle autobuild

on:
  push:
    branches:
      - perf/p0-split-release-bundle-20260928

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p0-split-release-bundle-20260928
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build split frontend bundles
        run: python scripts/build_frontend_bundle.py
      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/chartview_release_bundle.js static/js/chartview_release_deferred.js static/css/chartview_release_bundle.css templates/index.html
          if git diff --cached --quiet; then
            echo "Bundles already exact"
          else
            git commit -m "build: regenerate split frontend bundles"
            git push origin HEAD:perf/p0-split-release-bundle-20260928
          fi
