name: Apply Mobile Layout V32e

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-layout-v32e.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cache bump
        run: python scripts/apply_mobile_layout_v32e.py
      - name: Validate JavaScript
        run: node --check static/js/ux_patch.js
      - name: Commit generated cache bump
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/ux_patch.js templates/index.html
          git commit -m 'style: refresh mobile layout assets v32e'
          git push
