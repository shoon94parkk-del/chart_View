name: Update Macro Cache

on:
  schedule:
    # FRED series are daily/weekly/monthly; every 6 hours is sufficient.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-macro-cache.yml'
      - 'scripts/generate_macro_cache.py'
      - 'scripts/generate_inflation_release_cache.py'
      - 'scripts/pce_release_data.py'
      - 'inflation_release_service.py'

permissions:
  contents: write

concurrency:
  group: macro-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cache dependency
        run: pip install requests beautifulsoup4

      - name: Generate macro cache
        run: python scripts/generate_macro_cache.py

      - name: Validate macro cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('static/data/macro_cache.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          rows = data.get('results') or []
          symbols = [(x.get('original_symbol') or x.get('symbol')) for x in rows]
          required = {
              'T10Y2Y','T10Y3M','BAMLH0A0HYM2','RRPONTSYD','DFII10','T10YIE',
              'UNRATE','RSAFS','WALCL','WTREGEN','M2SL','FEDTARGET','DFF','^VIX',
              'PCEPI','PCETRIM12M159SFRBDAL'
          }
          assert len(rows) == 16, len(rows)
          assert required == set(symbols), (required - set(symbols), set(symbols) - required)
          assert all(x.get('chart_data') for x in rows)
          assert all(x.get('asOf') for x in rows)
          print('macro cache OK:', len(rows), 'fresh=', data.get('freshCount'), 'stale=', data.get('staleCount'))
          PY

      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/macro_cache.json
          if git diff --cached --quiet; then
            echo "No macro cache changes"
          else
            git commit -m "data: refresh precomputed macro indicators"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  # Independent job: an unavailable legacy macro feed must not prevent checking
  # the official inflation/calendar feeds, and either cache retains its data.
  refresh-inflation:
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install inflation cache dependencies
        run: pip install requests beautifulsoup4

      - name: Generate inflation and release cache
        run: python scripts/generate_inflation_release_cache.py

      - name: Validate inflation and release cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('static/data/inflation_release_cache.json').read_text(encoding='utf-8'))
          rows = data['inflation']['series']
          required = {'cpi', 'core_cpi', 'ppi', 'core_ppi'}
          allowed = required | {'pce', 'core_pce'}
          ids = {row['id'] for row in rows}
          assert required <= ids <= allowed
          assert len(rows) == len(ids), 'duplicate inflation series IDs'
          for row in rows:
              expected_yoy = 'SA' if row['id'] in {'pce', 'core_pce'} else 'NSA'
              assert row['basis'] == {'yoy': expected_yoy, 'mom': 'SA'}
              if row['id'] in {'pce', 'core_pce'}:
                  assert set(row['sourceIndices']) == {'sa'}
              assert len(row['points']) >= 36
              assert row['asOf'] and row['checkedAt'] and row['collectedAt']
          assert isinstance(data['releaseCalendar']['events'], list)
          print('inflation cache:', data['inflation']['status'], 'calendar:', data['releaseCalendar']['status'])
          PY

      - name: Commit refreshed inflation cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/inflation_release_cache.json
          if git diff --cached --quiet; then
            echo "No inflation cache changes"
          else
            git commit -m "data: refresh official inflation and release cache"
            # Other scheduled data jobs may publish main after this checkout.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
            done
            exit 1
          fi
