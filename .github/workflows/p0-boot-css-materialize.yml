name: Materialize boot CSS P0

on:
  push:
    branches:
      - perf/p0-original-boot-css-20260928

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p0-original-boot-css-20260928
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_frontend_bundle.py
      - run: python scripts/build_boot_bundle.py
      - run: |
          python scripts/build_frontend_bundle.py --check
          python scripts/build_boot_bundle.py --check
      - name: Commit generated assets
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/chartview_release_bundle.js static/css/chartview_release_bundle.css static/js/chartview_boot_bundle.js static/css/chartview_boot_bundle.css templates/index.html
          git commit -m "build: refresh boot bundles"
          git push origin HEAD:perf/p0-original-boot-css-20260928
