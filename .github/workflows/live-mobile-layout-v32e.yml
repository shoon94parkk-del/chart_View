name: Live Mobile Layout V32e

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-mobile-layout-v32e.yml'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify live mobile layout
        run: |
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport:{width:384,height:824}, isMobile:true, hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'
            });
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror', e=>errors.push(String(e)));
            const res=await page.goto('https://chart-view-bsg6.onrender.com/?layout32e=1',{waitUntil:'domcontentloaded',timeout:60000});
            assert(res && res.status()===200,'production HTTP failed');
            await page.waitForSelector('.app-bottom-nav',{state:'visible',timeout:20000});
            await page.waitForSelector('#home-watchlist-v30',{state:'visible',timeout:20000});
            await page.waitForSelector('#ux12-data-status',{state:'visible',timeout:20000});
            await page.waitForTimeout(1800);

            const nav = await page.evaluate(()=>{
              const root=document.querySelector('.app-bottom-nav');
              const rr=root.getBoundingClientRect();
              const buttons=[...root.querySelectorAll('.app-bottom-btn')].map(el=>{
                const r=el.getBoundingClientRect();
                return {top:r.top,left:r.left,right:r.right,width:r.width,height:r.height,text:el.textContent.trim()};
              });
              return {height:rr.height,width:rr.width,display:getComputedStyle(root).display,cols:getComputedStyle(root).gridTemplateColumns,buttons};
            });
            console.log('nav=',JSON.stringify(nav));
            assert.strictEqual(nav.buttons.length,5,'expected five nav buttons');
            assert(nav.display==='grid','bottom nav must be grid');
            const tops=nav.buttons.map(x=>x.top);
            assert(Math.max(...tops)-Math.min(...tops)<=2,'five nav items are not on one row');
            assert(nav.height<82,`bottom nav too tall: ${nav.height}`);
            const widths=nav.buttons.map(x=>x.width);
            assert(Math.max(...widths)-Math.min(...widths)<=3,'nav columns are not evenly divided');
            assert(nav.buttons[4].right<=385,'market tab overflows viewport');

            const cards = await page.evaluate(()=>{
              const w=document.getElementById('home-watchlist-v30').getBoundingClientRect();
              const d=document.getElementById('ux12-data-status').getBoundingClientRect();
              return {watch:{left:w.left,right:w.right,top:w.top,bottom:w.bottom,width:w.width},data:{left:d.left,right:d.right,top:d.top,bottom:d.bottom,width:d.width}};
            });
            console.log('cards=',JSON.stringify(cards));
            assert(Math.abs(cards.watch.left-cards.data.left)<=2,'data status left edge differs from watchlist');
            assert(Math.abs(cards.watch.right-cards.data.right)<=2,'data status right edge differs from watchlist');
            assert(Math.abs(cards.watch.width-cards.data.width)<=3,'data status width differs from watchlist');
            assert(cards.data.top>=cards.watch.bottom+4,`data status overlaps watchlist: gap=${cards.data.top-cards.watch.bottom}`);

            if(errors.length) throw new Error('browser errors: '+errors.join(' | '));
            console.log('LIVE MOBILE LAYOUT V32E PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
