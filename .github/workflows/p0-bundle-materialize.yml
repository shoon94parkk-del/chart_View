name: P0 bundle materialize

on:
  pull_request:
    branches: [main]

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact frontend bundle
        run: python scripts/build_frontend_bundle.py
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: p0-generated-bundle
          path: |
            static/js/chartview_release_bundle.js
            static/css/chartview_release_bundle.css
            templates/index.html
