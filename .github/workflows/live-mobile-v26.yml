name: Live Mobile V26 Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-mobile-v26.yml'

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Test V26 on Android profiles
        shell: bash
        run: |
          cat > live-v26.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const profiles = [
            {name:'Galaxy Chrome', viewport:{width:360,height:800}, ua:'Mozilla/5.0 (Linux; Android 16; SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'},
            {name:'Galaxy Samsung Internet', viewport:{width:384,height:824}, ua:'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'}
          ];
          async function run(browser,p){
            const c=await browser.newContext({viewport:p.viewport,isMobile:true,hasTouch:true,userAgent:p.ua});
            const page=await c.newPage(); const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+String(e)));
            page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});
            const t=Date.now();
            await page.goto('https://chart-view-bsg6.onrender.com/?mobile_v26=1',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('.app-bottom-nav',{timeout:20000});
            await page.waitForSelector('#home-market-v9',{timeout:20000});
            await page.waitForSelector('.home16-stock',{timeout:20000});
            const interactive=Date.now()-t; console.log(p.name,'interactiveMs=',interactive); assert(interactive<20000);
            const src=await page.locator('script[src*="ux_patch.js"]').getAttribute('src'); assert(src&&src.includes('v26'),p.name+' not V26');
            const heartbeat=async()=>assert.equal(await page.evaluate(()=>new Promise(r=>setTimeout(()=>r('ok'),60))),'ok');
            await heartbeat();
            const more=page.locator('[data-home23-market-toggle]'); await more.tap({timeout:5000}); await heartbeat();
            assert(await page.locator('#home-market-v9').evaluate(el=>el.classList.contains('home23-expanded'))); await more.tap({timeout:5000}); await heartbeat();
            await page.locator('.home16-stock').first().tap({timeout:5000}); await heartbeat();
            assert(await page.locator('.app-bottom-btn[data-app-mode="analysis"]').evaluate(el=>el.classList.contains('active')));
            await page.locator('.app-bottom-btn[data-app-mode="home"]').tap({timeout:5000}); await heartbeat();
            await page.locator('.app-bottom-btn[data-app-mode="tools"]').tap({timeout:5000});
            await page.waitForSelector('#tools-tab',{state:'visible',timeout:5000}); await heartbeat();
            assert((await page.locator('#tools-tab').innerText()).includes('Finviz'));
            if(errors.length) throw new Error(p.name+' browser errors: '+errors.join(' | '));
            console.log(p.name,'PASSED'); await c.close();
          }
          (async()=>{const b=await chromium.launch({headless:true}); for(const p of profiles) await run(b,p); await b.close(); console.log('ALL V26 MOBILE PROFILES PASSED')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node live-v26.cjs
