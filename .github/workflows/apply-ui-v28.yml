name: Apply UI V28

on:
  push:
    paths:
      - '.github/workflows/apply-ui-v28.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_ui_v28.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/chart.js static/js/fwdper.js static/js/ux_patch.js static/js/investment_tools_v22.js static/css/investment_tools_v22.css templates/index.html
          git commit -m "feat: default Samsung and expand branded investment tools v28"
          git push
