name: Apply Screener Freshness V29

on:
  push:
    paths:
      - '.github/workflows/apply-screener-freshness-v29.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply screener freshness patch
        run: python scripts/apply_screener_freshness_v29.py
      - name: Validate
        run: |
          python -m py_compile scripts/generate_screener.py scripts/apply_screener_freshness_v29.py
          node --check static/js/screener.js
          node --check static/js/ux_patterns_v12.js
          node --check static/js/ux_patch.js
          node --check static/js/home_brief_v8.js
          node --check static/js/ux_v3.js
          python - <<'PY'
          import json
          from pathlib import Path
          meta=json.loads(Path('static/data/screener_meta.json').read_text())
          data=json.loads(Path('static/data/screener.json').read_text())
          assert meta['tradeDate']==data['tradeDate']
          assert meta['count']==data['count']
          assert data['tradeDate']=='2026-09-11'
          print(meta)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate_screener.py static/data/screener_meta.json static/js/screener.js static/js/ux_patterns_v12.js static/js/ux_patch.js static/js/home_brief_v8.js static/js/ux_v3.js templates/index.html
          git commit -m 'fix: keep screener freshness cache in sync v29'
          git push
