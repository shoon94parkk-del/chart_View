name: Cleanup Runtime V5

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-runtime-v5.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Batch FRED macro and handle HEAD probe
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path('main.py')
          text = p.read_text(encoding='utf-8')

          # Render probes the root with HEAD while deploying. Return 200 explicitly.
          home = '''@app.get("/")
          async def home(request: Request):
              return templates.TemplateResponse("index.html", {"request": request})
          '''
          home = textwrap.dedent(home)
          if '@app.head("/")' not in text:
              replacement = home + '''\n@app.head("/")\nasync def home_head():\n    return JSONResponse(content={}, status_code=200)\n'''
              if home not in text:
                  raise RuntimeError('home route anchor not found')
              text = text.replace(home, replacement, 1)

          # Replace per-series FRED HTTP calls with one bundled CSV request.
          start = text.index('    def fetch_fred_data(symbol, info):')
          end = text.index('    def fetch_indicator(symbol, info):', start)
          block = textwrap.indent(textwrap.dedent('''\
          fred_bundle = {}
          fred_symbols = [s for s, meta in indicators.items() if meta.get("source") == "FRED"]
          try:
              start_date = (datetime.now() - timedelta(days=180)).strftime("%Y-%m-%d")
              response = requests.get(
                  "https://fred.stlouisfed.org/graph/fredgraph.csv",
                  params={"id": ",".join(fred_symbols), "cosd": start_date},
                  headers={"User-Agent": "Mozilla/5.0"},
                  timeout=15,
              )
              response.raise_for_status()
              frame = pd.read_csv(io.StringIO(response.text))
              if not frame.empty and len(frame.columns) >= 2:
                  date_col = frame.columns[0]
                  for symbol in fred_symbols:
                      if symbol not in frame.columns:
                          continue
                      values = pd.to_numeric(frame[symbol], errors="coerce")
                      rows = [
                          {"time": str(date)[:10], "value": float(value)}
                          for date, value in zip(frame[date_col], values)
                          if pd.notna(value)
                      ]
                      if rows:
                          fred_bundle[symbol] = rows[-100:]
              print(f"[FRED] bundled {len(fred_bundle)}/{len(fred_symbols)} series")
          except Exception as e:
              print(f"[FRED] bundled CSV failed: {e}")

          def fetch_fred_data(symbol, info):
              """Use the single FRED bundle; fallback only if that series is unavailable."""
              chart_data = fred_bundle.get(symbol) or []
              if len(chart_data) < 1:
                  return fetch_yahoo_fallback(symbol, info)
              current = chart_data[-1]["value"]
              prev = chart_data[-2]["value"] if len(chart_data) > 1 else current
              change = ((current - prev) / prev) * 100 if prev else 0.0
              return {
                  "original_symbol": symbol,
                  "symbol": symbol,
                  "name": info["name"],
                  "desc": info["desc"],
                  "link": info["link"],
                  "value": round(current, 2),
                  "change": round(change, 2),
                  "chart_data": chart_data,
                  "source": "FRED",
              }

          '''), '    ')
          text = text[:start] + block + text[end:]
          p.write_text(text, encoding='utf-8')

          # Sanity: compile and ensure the removed secret/AI paths do not reappear.
          main = p.read_text(encoding='utf-8')
          compile(main, 'main.py', 'exec')
          assert 'e4549aea' not in main
          assert 'GEMINI_API_KEYS' not in main
          assert '@app.head("/")' in main
          assert 'fred_bundle' in main and '",".join(fred_symbols)' in main
          print('macro batching patch complete')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          if git diff --cached --quiet; then
            echo "No cleanup changes"
          else
            git commit -m "fix: batch FRED macro fetch and root HEAD probe"
            git push origin HEAD:main
          fi
