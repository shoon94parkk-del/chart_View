name: Live Mobile V25 Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-mobile-v25.yml'

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Test live site on Android profiles
        shell: bash
        run: |
          cat > live-v25.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');

          const profiles = [
            {
              name: 'Galaxy Chrome',
              viewport: { width: 360, height: 800 },
              ua: 'Mozilla/5.0 (Linux; Android 16; SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'
            },
            {
              name: 'Galaxy Samsung Internet',
              viewport: { width: 384, height: 824 },
              ua: 'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'
            }
          ];

          async function runProfile(browser, profile) {
            const context = await browser.newContext({
              viewport: profile.viewport,
              isMobile: true,
              hasTouch: true,
              userAgent: profile.ua,
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror:'+String(e)));
            page.on('console', m => { if (m.type() === 'error') errors.push('console:'+m.text()); });

            const started = Date.now();
            await page.goto('https://chart-view-bsg6.onrender.com/?mobile_v25=1', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForSelector('.app-bottom-nav', { timeout: 20000 });
            await page.waitForSelector('#home-market-v9', { timeout: 20000 });
            await page.waitForSelector('.home16-stock', { timeout: 20000 });
            const interactiveMs = Date.now() - started;
            console.log(profile.name, 'interactiveMs=', interactiveMs);
            assert(interactiveMs < 20000, profile.name + ' interactive too slow');

            const uxPatch = await page.locator('script[src*="ux_patch.js"]').getAttribute('src');
            assert(uxPatch && uxPatch.includes('v25'), profile.name + ' not loading v25');

            const mutationCount = await page.evaluate(() => {
              return document.querySelectorAll('*').length;
            });
            await page.waitForTimeout(1500);
            const mutationCountLater = await page.evaluate(() => document.querySelectorAll('*').length);
            assert(Math.abs(mutationCountLater - mutationCount) < 300, profile.name + ' runaway DOM growth');

            async function heartbeat(label) {
              const result = await Promise.race([
                page.evaluate(() => new Promise(r => setTimeout(() => r('ok'), 60))),
                new Promise((_, reject) => setTimeout(() => reject(new Error(label+' heartbeat timeout')), 2000))
              ]);
              assert.equal(result, 'ok');
            }

            await heartbeat('initial');

            const more = page.locator('[data-home23-market-toggle]');
            await more.tap({ timeout: 5000 });
            await heartbeat('market-more');
            assert(await page.locator('#home-market-v9').evaluate(el => el.classList.contains('home23-expanded')));
            await more.tap({ timeout: 5000 });
            await heartbeat('market-collapse');

            await page.locator('.home16-stock').first().tap({ timeout: 5000 });
            await heartbeat('stock-analysis');
            assert(await page.locator('.app-bottom-btn[data-app-mode="analysis"]').evaluate(el => el.classList.contains('active')));

            await page.locator('.app-bottom-btn[data-app-mode="home"]').tap({ timeout: 5000 });
            await heartbeat('home-return');

            await page.locator('.app-bottom-btn[data-app-mode="tools"]').tap({ timeout: 5000 });
            await page.waitForSelector('#tools-tab', { state: 'visible', timeout: 5000 });
            await heartbeat('tools');
            assert((await page.locator('#tools-tab').innerText()).includes('Finviz'));

            if (errors.length) throw new Error(profile.name + ' browser errors: ' + errors.join(' | '));
            console.log(profile.name, 'PASSED');
            await context.close();
          }

          (async() => {
            const browser = await chromium.launch({ headless: true });
            for (const profile of profiles) await runProfile(browser, profile);
            await browser.close();
            console.log('ALL V25 MOBILE PROFILES PASSED');
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node live-v25.cjs
