name: Patch ledger rank cleanup once

on:
  push:
    branches: [fix/ledger-hide-rank-20260917]
    paths:
      - '.github/workflows/patch-ledger-hide-rank-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ledger-hide-rank-20260917
      - name: Remove visual rank column and bump assets
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('static/js/ai_pick_ledger_v52.js')
          js = js_path.read_text(encoding='utf-8')
          old_rank = '          <span class="ai-ledger-cell ledger-rank" data-label="순위">${esc(row.rank || \'-\')}위</span>\n'
          old_head = '<span>추천일</span><span>순위</span><span>종목</span><span>추천가</span><span>현재가</span><span>수익률</span><span>최고수익률</span><span>점수</span>'
          new_head = '<span>추천일</span><span>종목</span><span>추천가</span><span>현재가</span><span>수익률</span><span>최고수익률</span><span>점수</span>'
          assert old_rank in js
          assert old_head in js
          js = js.replace(old_rank, '', 1).replace(old_head, new_head, 1)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('static/css/ai_pick_ledger_v52.css')
          css = css_path.read_text(encoding='utf-8')
          replacements = {
              'grid-template-columns:92px 46px minmax(150px,1.45fr) 92px 92px 86px 98px 62px 20px': 'grid-template-columns:92px minmax(150px,1.45fr) 92px 92px 86px 98px 62px 20px',
              '#screener-tab .ledger-date,#screener-tab .ledger-rank{color:#6b7684;font-size:11px;font-weight:700}': '#screener-tab .ledger-date{color:#6b7684;font-size:11px;font-weight:700}',
              'padding:10px 14px 12px 158px': 'padding:10px 14px 12px 112px',
              'grid-template-columns:86px 42px minmax(135px,1.35fr) 84px 84px 82px 92px 56px 18px': 'grid-template-columns:86px minmax(135px,1.35fr) 84px 84px 82px 92px 56px 18px',
              'padding-left:142px': 'padding-left:104px',
              '  #screener-tab .ledger-rank{grid-area:meta;align-self:end;margin-top:18px;color:#4e5968;font-size:10px}\n': '',
          }
          for old, new in replacements.items():
              assert old in css, old
              css = css.replace(old, new, 1)
          css_path.write_text(css, encoding='utf-8')

          widget_path = Path('static/js/ai_daily_widget.js')
          widget = widget_path.read_text(encoding='utf-8')
          assert '/static/css/ai_pick_ledger_v52.css?v=20260916v52' in widget
          assert '/static/js/ai_pick_ledger_v52.js?v=20260916v52' in widget
          widget = widget.replace('/static/css/ai_pick_ledger_v52.css?v=20260916v52', '/static/css/ai_pick_ledger_v52.css?v=20260917v53', 1)
          widget = widget.replace('/static/js/ai_pick_ledger_v52.js?v=20260916v52', '/static/js/ai_pick_ledger_v52.js?v=20260917v53', 1)
          widget_path.write_text(widget, encoding='utf-8')

          html_path = Path('templates/index.html')
          html = html_path.read_text(encoding='utf-8')
          assert '/static/js/ai_daily_widget.js?v=20260916v52' in html
          html = html.replace('/static/js/ai_daily_widget.js?v=20260916v52', '/static/js/ai_daily_widget.js?v=20260917v53', 1)
          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/ai_pick_ledger_v52.js static/css/ai_pick_ledger_v52.css static/js/ai_daily_widget.js templates/index.html
          git diff --cached --check
          git commit -m 'ui: hide PICK rank in ledger'
          git push origin HEAD:fix/ledger-hide-rank-20260917
