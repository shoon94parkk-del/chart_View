name: App Regression Check

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'market_service.py'
      - 'market_service/**'
      - 'realtime_korea.py'
      - 'sitecustomize.py'
      - 'consensus_service.py'
      - 'valuation_band_service.py'
      - 'news_service_v37.py'
      - 'news_summary_service.py'
      - 'render.yaml'
      - 'requirements.txt'
      - 'tests/**'
      - 'scripts/**'
      - 'static/js/**'
      - 'static/css/**'
      - 'templates/**'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: |
          python -m py_compile main.py market_service.py market_service/__init__.py realtime_korea.py sitecustomize.py consensus_service.py valuation_band_service.py news_service_v37.py scripts/generate_macro_cache.py scripts/generate_screener.py scripts/generate_valuation_cache.py scripts/generate_consensus_cache.py
      - name: Frontend JavaScript syntax
        run: |
          for f in static/js/*.js; do
            node --check "$f"
          done
      - name: API and frontend regressions
        run: |
          pip install -q -r requirements.txt pytest httpx
          python -m pytest -q
          node --test tests/frontend.test.cjs
          node --test tests/live_quotes_v56_contract.cjs
          node --test tests/home_heatmap_v57_contract.cjs
          node --test tests/macro_policy_v62_contract.cjs
      - name: Static cache shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          screener=json.loads(Path('static/data/screener.json').read_text(encoding='utf-8'))
          stocks=screener.get('stocks', [])
          assert len(stocks) > 2000, len(stocks)
          jyp=[x for x in stocks if 'jyp' in str(x.get('name','')).lower()]
          assert jyp and any(str(x.get('symbol','')).startswith('035900') for x in jyp), jyp[:5]
          valuation=json.loads(Path('static/data/valuation_cache.json').read_text(encoding='utf-8'))
          for ticker in ('005930.KS','000660.KS'):
              pe=(valuation.get('quotes') or {}).get(ticker,{}).get('forwardPE')
              assert pe is not None and 0 < float(pe) < 250, (ticker, pe)
          consensus=json.loads(Path('static/data/consensus_cache.json').read_text(encoding='utf-8'))
          quotes=consensus.get('quotes', {})
          assert len(quotes) >= 40, len(quotes)
          price_ready=sum(1 for q in quotes.values() if (q.get('priceTrend') or {}).get('return30') is not None and (q.get('priceTrend') or {}).get('return90') is not None)
          assert price_ready >= 40, price_ready
          macro=json.loads(Path('static/data/macro_cache.json').read_text(encoding='utf-8'))
          rows=macro.get('results', [])
          assert len(rows) == 16, len(rows)
          assert all(x.get('chart_data') and x.get('asOf') for x in rows)
          macro_symbols={x.get('original_symbol') or x.get('symbol') for x in rows}
          assert {'PCEPI','PCETRIM12M159SFRBDAL'} <= macro_symbols, macro_symbols
          assert {'FEDTARGET','DFF'} <= macro_symbols, macro_symbols
          print('cache checks OK:', len(stocks), 'stocks /', len(quotes), 'consensus / JYP', jyp[0].get('symbol'))
          PY
      - name: App UX and market invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('templates/index.html').read_text(encoding='utf-8')
          assert 'viewport-fit=cover' in html and 'user-scalable=no' not in html
          main=Path('main.py').read_text(encoding='utf-8')
          assert '@app.get("/api/market-now")' in main
          assert 'MARKET_NOW_TICKERS' in main
          assert '"basis": "previous_close"' in main
          for symbol in ('^KS11','^KQ11','^GSPC','^IXIC','^TNX','^VIX','CL=F','KRW=X'):
              assert symbol in main, symbol
          ux=Path('static/js/ux_patch.js').read_text(encoding='utf-8')
          assert "'jyp': 'JYP Ent.'" in ux
          assert '/static/js/home_market_v9.js?v=' in ux
          assert '/static/css/home_market_v9.css?v=' in ux
          app=Path('static/js/ux_v3.js').read_text(encoding='utf-8')
          assert 'data-app-mode="home"' in app and '종목분석' in app and '종목발굴' in app and '시장' in app
          assert 'navigateUserTab' in app and '__closeStockDetail' in app
          hub=Path('static/js/my_hub_v41.js').read_text(encoding='utf-8')
          assert '__openMyNewsV41' in hub and '내 종목 뉴스' in hub and '관련도순' in hub
          assert 'receivedAt' in hub and 'relatedSymbols' in hub
          resilience=Path('static/js/resilience_v41_3.js').read_text(encoding='utf-8')
          assert 'MutationObserver' not in resilience and 'feedSnapshot' not in resilience
          home=Path('static/js/home_brief_v8.js').read_text(encoding='utf-8')
          for text in ('주요 종목 오늘 시황','시장 한줄 요약','1달 수익률'):
              assert text in home, text
          market_home=Path('static/js/home_market_v9.js').read_text(encoding='utf-8')
          for label in ('오늘의 시장','KOSPI','KOSDAQ','미 10년물','WTI 유가','원/달러','직전 종가 대비'):
              assert label in market_home, label
          assert "/api/market-now" in market_home
          assert "row?.change" in market_home
          assert '/api/compare' not in market_home
          assert '__openAppTab' not in market_home
          decision=Path('static/js/decision_ux_v7.js').read_text(encoding='utf-8')
          assert "new Set(['overview', 'bands', 'consensus'])" in decision
          assert 'EPS 상향 · 주가 약세 후보' in decision
          assert '%p' in decision
          service=Path('market_service.py').read_text(encoding='utf-8')
          assert '"priceBasis": price_basis' in service
          assert '"fieldMeta": field_meta' in service
          realtime=Path('realtime_korea.py').read_text(encoding='utf-8')
          assert 'Naver Finance KRX/Koscom' in realtime and '^KS11' in realtime and '^KQ11' in realtime
          shim=Path('market_service/__init__.py').read_text(encoding='utf-8')
          assert 'install_patch(_legacy)' in shim
          chart=Path('static/js/chart.js').read_text(encoding='utf-8')
          assert 'handleScale: { mouseWheel: false, pinch: true }' in chart
          # P0-2 performance/reliability contracts.
          assert 'src="https://unpkg.com/lightweight-charts' not in html
          assert 'function loadLightweightCharts()' in chart
          priority=Path('static/js/home_priority_v10.js').read_text(encoding='utf-8')
          assert '/api/valuation-bands?tickers=' in priority
          assert '/api/valuation-band?ticker=' not in priority
          assert 'HOME_INSIGHTS_SOURCE_TTL = 300' in main
          assert '@app.get("/api/valuation-bands")' in main
          assert Path('.github/workflows/screener-production-freshness.yml').exists()
          print('app UX invariants OK: V42 + P0-2 contracts')
          PY

  mobile:
    strategy:
      fail-fast: false
      matrix:
        suite: [mobile_smoke, app_release_stage12, v41_my_hub, news_summary_expand_v48, prelaunch_v42]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: |
          pip install -q -r requirements.txt
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start app and test mobile behavior
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8080 --lifespan off > /tmp/chart-view.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break || sleep 1; done
          node tests/${{ matrix.suite }}.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-review-${{ matrix.suite }}
          path: |
            test-results/
            /tmp/chart-view.log

  production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [check, mobile]
    strategy:
      fail-fast: false
      matrix:
        suite: [production_stage12, v41_my_hub, news_summary_expand_v48, prelaunch_v42]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact Render revision and release assets
        env:
          APP_URL: https://chart-view-pkv8.onrender.com
          EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/verify_deployed_release.py
      - name: Install production browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify production UI and navigation
        env:
          APP_URL: https://chart-view-pkv8.onrender.com
        run: node tests/${{ matrix.suite }}.cjs
      - name: Confirm revision and assets stayed unchanged
        env:
          APP_URL: https://chart-view-pkv8.onrender.com
          EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/verify_deployed_release.py --attempts 1 --output test-results/release-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-review-${{ matrix.suite }}
          path: test-results/
