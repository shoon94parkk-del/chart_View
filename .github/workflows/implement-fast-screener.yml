name: Implement Fast Korean Screener

on:
  push:
    branches: [feature/fast-screener]
    paths:
      - '.github/workflows/implement-fast-screener.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fast-screener

      - name: Build fast screener feature
        run: |
          mkdir -p scripts static/js static/css static/data .github/workflows

          cat > scripts/generate_screener.py <<'PY'
          """Generate a precomputed Korean stock screener JSON.

          Heavy market-wide calculations run in GitHub Actions after the Korean market closes.
          The web app only downloads the resulting JSON, so filtering is instant and free of
          per-request market API work.
          """
          from __future__ import annotations

          import io
          import json
          import math
          import time
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import pandas as pd
          import requests
          from pykrx import stock

          KST = timezone(timedelta(hours=9))
          OUT = Path("static/data/screener.json")
          HISTORY_CALENDAR_DAYS = 230
          MIN_HISTORY_ROWS = 120


          def finite(value, digits=2):
              try:
                  value = float(value)
                  if math.isnan(value) or math.isinf(value):
                      return None
                  return round(value, digits)
              except (TypeError, ValueError):
                  return None


          def load_names():
              """Load KOSPI/KOSDAQ names from KIND in two bulk requests."""
              result = {}
              headers = {"User-Agent": "Mozilla/5.0"}
              markets = [("stockMkt", "KOSPI", ".KS"), ("kosdaqMkt", "KOSDAQ", ".KQ")]
              for market_type, market_name, suffix in markets:
                  try:
                      r = requests.get(
                          "https://kind.krx.co.kr/corpgeneral/corpList.do",
                          params={"method": "download", "marketType": market_type},
                          headers=headers,
                          timeout=20,
                      )
                      r.raise_for_status()
                      frame = pd.read_html(io.StringIO(r.text))[0]
                      for _, row in frame.iterrows():
                          code = str(row["종목코드"]).zfill(6)
                          result[code] = {
                              "name": str(row["회사명"]).strip(),
                              "market": market_name,
                              "symbol": f"{code}{suffix}",
                          }
                  except Exception as exc:
                      print(f"[KIND] {market_name} failed: {exc}")
              return result


          def all_market_ohlcv(date_str):
              """Get one trading day's whole KOSPI+KOSDAQ snapshot."""
              frames = []
              for market in ("KOSPI", "KOSDAQ"):
                  try:
                      df = stock.get_market_ohlcv_by_ticker(date_str, market=market)
                      if df is not None and not df.empty:
                          df = df.copy()
                          df.index = df.index.astype(str).str.zfill(6)
                          frames.append(df)
                  except Exception as exc:
                      print(f"[OHLCV] {date_str} {market}: {exc}")
              if not frames:
                  return pd.DataFrame()
              return pd.concat(frames, axis=0)


          def latest_cross_section(date_str, getter):
              frames = []
              for market in ("KOSPI", "KOSDAQ"):
                  try:
                      df = getter(date_str, market=market)
                      if df is not None and not df.empty:
                          df = df.copy()
                          df.index = df.index.astype(str).str.zfill(6)
                          frames.append(df)
                  except Exception as exc:
                      print(f"[XSEC] {date_str} {market}: {exc}")
              return pd.concat(frames, axis=0) if frames else pd.DataFrame()


          def calculate_rsi(close):
              delta = close.diff()
              gain = delta.clip(lower=0)
              loss = -delta.clip(upper=0)
              avg_gain = gain.ewm(alpha=1 / 14, adjust=False, min_periods=14).mean()
              avg_loss = loss.ewm(alpha=1 / 14, adjust=False, min_periods=14).mean()
              rs = avg_gain / avg_loss.replace(0, float("nan"))
              rsi = 100 - (100 / (1 + rs))
              return rsi.fillna(100).where(avg_gain.ne(0), 0)


          def build():
              names = load_names()
              today = datetime.now(KST).date()
              business_days = pd.bdate_range(today - timedelta(days=HISTORY_CALENDAR_DAYS), today)

              closes = []
              volumes = []
              valid_dates = []

              for i, dt in enumerate(business_days):
                  ds = dt.strftime("%Y%m%d")
                  frame = all_market_ohlcv(ds)
                  if frame.empty or "종가" not in frame.columns:
                      continue
                  close = pd.to_numeric(frame["종가"], errors="coerce").where(lambda s: s > 0)
                  volume = pd.to_numeric(frame.get("거래량"), errors="coerce").fillna(0)
                  closes.append(close.rename(ds))
                  volumes.append(volume.rename(ds))
                  valid_dates.append(ds)
                  if i % 20 == 0:
                      print(f"loaded {len(valid_dates)} trading days, latest={ds}")
                  time.sleep(0.04)

              if len(closes) < MIN_HISTORY_ROWS:
                  raise RuntimeError(f"Only {len(closes)} valid trading days loaded; need {MIN_HISTORY_ROWS}")

              close = pd.DataFrame(closes).sort_index()
              volume = pd.DataFrame(volumes).reindex(close.index)
              latest_date = close.index[-1]

              ma20 = close.rolling(20).mean()
              ma60 = close.rolling(60).mean()
              ma120 = close.rolling(120).mean()
              vol20 = volume.rolling(20).mean()
              rsi = calculate_rsi(close)

              last = close.iloc[-1]
              prev = close.iloc[-2]
              last_ma20 = ma20.iloc[-1]
              prev_ma20 = ma20.iloc[-2]
              last_ma60 = ma60.iloc[-1]
              last_ma120 = ma120.iloc[-1]
              last_vol = volume.iloc[-1]
              last_vol20 = vol20.iloc[-1]
              last_rsi = rsi.iloc[-1]

              cap = latest_cross_section(latest_date, stock.get_market_cap_by_ticker)
              fundamentals = latest_cross_section(latest_date, stock.get_market_fundamental_by_ticker)

              rows = []
              for code in close.columns:
                  price = finite(last.get(code), 0)
                  if not price or price <= 0:
                      continue
                  meta = names.get(code)
                  if not meta:
                      # Fallback market lookup using presence in current lists.
                      try:
                          name = stock.get_market_ticker_name(code) or code
                      except Exception:
                          name = code
                      meta = {"name": name, "market": "KRX", "symbol": code}

                  m20 = finite(last_ma20.get(code), 0)
                  m60 = finite(last_ma60.get(code), 0)
                  m120 = finite(last_ma120.get(code), 0)
                  rsi14 = finite(last_rsi.get(code), 1)
                  vr = None
                  avg_vol = last_vol20.get(code)
                  if pd.notna(avg_vol) and avg_vol and avg_vol > 0:
                      vr = finite(last_vol.get(code, 0) / avg_vol, 2)

                  change1 = finite((last.get(code) / prev.get(code) - 1) * 100 if pd.notna(prev.get(code)) and prev.get(code) else None, 2)
                  ret5 = finite((last.get(code) / close[code].iloc[-6] - 1) * 100 if close[code].iloc[-6] and pd.notna(close[code].iloc[-6]) else None, 2)
                  ret20 = finite((last.get(code) / close[code].iloc[-21] - 1) * 100 if close[code].iloc[-21] and pd.notna(close[code].iloc[-21]) else None, 2)
                  ret60 = finite((last.get(code) / close[code].iloc[-61] - 1) * 100 if close[code].iloc[-61] and pd.notna(close[code].iloc[-61]) else None, 2)

                  cross20 = bool(
                      pd.notna(prev.get(code)) and pd.notna(prev_ma20.get(code)) and
                      pd.notna(last.get(code)) and pd.notna(last_ma20.get(code)) and
                      prev.get(code) <= prev_ma20.get(code) and last.get(code) > last_ma20.get(code)
                  )
                  aligned = bool(m20 and m60 and m120 and price > m20 > m60 > m120)
                  above20 = bool(m20 and price > m20)
                  above60 = bool(m60 and price > m60)

                  score = 0
                  if rsi14 is not None and 35 <= rsi14 <= 60: score += 20
                  if cross20: score += 25
                  if vr is not None and vr >= 1.5: score += 20
                  elif vr is not None and vr >= 1.2: score += 10
                  if above20: score += 15
                  if m20 and m60 and m20 > m60: score += 10
                  if m60 and m120 and m60 > m120: score += 10

                  market_cap = None
                  if not cap.empty and code in cap.index and "시가총액" in cap.columns:
                      market_cap = finite(cap.at[code, "시가총액"], 0)

                  per = pbr = div = None
                  if not fundamentals.empty and code in fundamentals.index:
                      if "PER" in fundamentals.columns: per = finite(fundamentals.at[code, "PER"], 2)
                      if "PBR" in fundamentals.columns: pbr = finite(fundamentals.at[code, "PBR"], 2)
                      if "DIV" in fundamentals.columns: div = finite(fundamentals.at[code, "DIV"], 2)
                      if per == 0: per = None
                      if pbr == 0: pbr = None

                  rows.append({
                      "code": code,
                      "symbol": meta["symbol"],
                      "name": meta["name"],
                      "market": meta["market"],
                      "price": price,
                      "change1d": change1,
                      "rsi14": rsi14,
                      "volumeRatio": vr,
                      "ma20": m20,
                      "ma60": m60,
                      "ma120": m120,
                      "above20": above20,
                      "above60": above60,
                      "cross20": cross20,
                      "aligned": aligned,
                      "ret5": ret5,
                      "ret20": ret20,
                      "ret60": ret60,
                      "marketCap": market_cap,
                      "per": per,
                      "pbr": pbr,
                      "dividendYield": div,
                      "score": score,
                  })

              rows.sort(key=lambda x: (x.get("score") or 0, x.get("marketCap") or 0), reverse=True)
              payload = {
                  "updated": datetime.now(KST).isoformat(timespec="seconds"),
                  "tradeDate": latest_date,
                  "count": len(rows),
                  "source": "KRX (pykrx/KIND), precomputed by GitHub Actions",
                  "stocks": rows,
              }
              OUT.parent.mkdir(parents=True, exist_ok=True)
              OUT.write_text(json.dumps(payload, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              print(f"wrote {len(rows)} stocks to {OUT} ({OUT.stat().st_size / 1024:.1f} KB)")


          if __name__ == "__main__":
              build()
          PY

          cat > static/js/screener.js <<'JS'
          let screenerPayload = null;
          let screenerPreset = 'candidate';
          let screenerMarket = 'ALL';
          let screenerMinCap = 100000000000; // 1,000억원
          let screenerSort = 'score';

          const fmtNum = (v, digits = 1) => (v === null || v === undefined || Number.isNaN(Number(v))) ? '-' : Number(v).toLocaleString('ko-KR', {maximumFractionDigits: digits});
          const fmtPct = v => (v === null || v === undefined) ? '-' : `${v > 0 ? '+' : ''}${Number(v).toFixed(1)}%`;
          const fmtCap = v => {
            if (!v) return '-';
            if (v >= 1e12) return `${(v / 1e12).toFixed(1)}조`;
            return `${Math.round(v / 1e8).toLocaleString()}억`;
          };

          function screenerMatches(s) {
            if (screenerMarket !== 'ALL' && s.market !== screenerMarket) return false;
            if ((s.marketCap || 0) < screenerMinCap) return false;
            const q = (document.getElementById('screener-search')?.value || '').trim().toLowerCase();
            if (q && !`${s.name} ${s.code} ${s.symbol}`.toLowerCase().includes(q)) return false;

            if (screenerPreset === 'oversold') return s.rsi14 !== null && s.rsi14 <= 35;
            if (screenerPreset === 'volume') return (s.volumeRatio || 0) >= 2;
            if (screenerPreset === 'cross20') return s.cross20 === true;
            if (screenerPreset === 'aligned') return s.aligned === true;
            if (screenerPreset === 'candidate') {
              return (s.score || 0) >= 55 && (s.rsi14 === null || s.rsi14 <= 65) && (s.volumeRatio || 0) >= 1.2;
            }
            return true;
          }

          function sortScreenerRows(rows) {
            const sorted = [...rows];
            const desc = key => sorted.sort((a,b) => (b[key] ?? -Infinity) - (a[key] ?? -Infinity));
            if (screenerSort === 'volumeRatio') return desc('volumeRatio');
            if (screenerSort === 'ret20') return desc('ret20');
            if (screenerSort === 'marketCap') return desc('marketCap');
            if (screenerSort === 'rsi') return sorted.sort((a,b) => (a.rsi14 ?? Infinity) - (b.rsi14 ?? Infinity));
            return desc('score');
          }

          function maLabel(s) {
            if (s.aligned) return '<span class="screen-badge good">정배열</span>';
            if (s.cross20) return '<span class="screen-badge cross">20일선 돌파</span>';
            if (s.above20 && s.above60) return '<span class="screen-badge">20·60일선 위</span>';
            if (s.above20) return '<span class="screen-badge">20일선 위</span>';
            return '<span class="screen-badge muted">이평선 아래</span>';
          }

          function renderScreener() {
            const body = document.getElementById('screener-results');
            const summary = document.getElementById('screener-summary');
            if (!body || !screenerPayload) return;

            let rows = sortScreenerRows(screenerPayload.stocks.filter(screenerMatches));
            const total = rows.length;
            rows = rows.slice(0, 200);
            summary.textContent = `${total.toLocaleString()}개 종목 · ${screenerPayload.tradeDate || ''} 기준 · 미리 계산된 데이터라 필터링은 즉시 반영됩니다.`;

            if (!rows.length) {
              body.innerHTML = '<div class="screener-empty">조건에 맞는 종목이 없습니다. 필터를 완화해 보세요.</div>';
              return;
            }

            body.innerHTML = `<div class="screener-table-wrap"><table class="screener-table">
              <thead><tr><th>종목</th><th>현재가</th><th>RSI</th><th>거래량</th><th>추세</th><th>20일</th><th>PER/PBR</th><th>점수</th><th></th></tr></thead>
              <tbody>${rows.map(s => `<tr>
                <td><div class="screen-name">${s.name}</div><div class="screen-code">${s.code} · ${s.market}</div></td>
                <td><div>${fmtNum(s.price,0)}원</div><div class="${(s.change1d||0)>=0?'screen-up':'screen-down'}">${fmtPct(s.change1d)}</div></td>
                <td><strong>${fmtNum(s.rsi14,1)}</strong></td>
                <td><strong>${s.volumeRatio ? `${s.volumeRatio.toFixed(1)}x` : '-'}</strong></td>
                <td>${maLabel(s)}</td>
                <td class="${(s.ret20||0)>=0?'screen-up':'screen-down'}">${fmtPct(s.ret20)}</td>
                <td><div>${s.per ? `PER ${fmtNum(s.per,1)}` : 'PER -'}</div><div class="screen-sub">${s.pbr ? `PBR ${fmtNum(s.pbr,1)}` : `시총 ${fmtCap(s.marketCap)}`}</div></td>
                <td><span class="screen-score">${s.score}</span></td>
                <td><button class="screen-add" onclick="addScreenerToChart('${s.symbol}','${String(s.name).replace(/'/g,"\\'")}')">비교+</button></td>
              </tr>`).join('')}</tbody></table></div>`;
          }

          async function loadScreenerData() {
            const body = document.getElementById('screener-results');
            if (screenerPayload) { renderScreener(); return; }
            if (body) body.innerHTML = '<div class="screener-loading"><div class="spinner"></div><span>스크리너 데이터를 불러오는 중...</span></div>';
            try {
              const res = await fetch('/static/data/screener.json', {cache:'no-store'});
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              screenerPayload = await res.json();
              renderScreener();
            } catch (e) {
              console.error(e);
              if (body) body.innerHTML = '<div class="screener-empty">첫 스크리너 데이터 생성 중입니다. 잠시 후 새로고침해 주세요.</div>';
            }
          }

          window.addScreenerToChart = function(symbol, name) {
            if (typeof addGlobalTicker === 'function') addGlobalTicker(symbol, name);
            if (typeof switchTab === 'function') switchTab('chart');
            window.scrollTo({top:0, behavior:'smooth'});
          };

          document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('[data-tab="screener"]')?.addEventListener('click', loadScreenerData);

            document.querySelectorAll('[data-screen-preset]').forEach(btn => btn.addEventListener('click', () => {
              document.querySelectorAll('[data-screen-preset]').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              screenerPreset = btn.dataset.screenPreset;
              renderScreener();
            }));
            document.querySelectorAll('[data-screen-market]').forEach(btn => btn.addEventListener('click', () => {
              document.querySelectorAll('[data-screen-market]').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              screenerMarket = btn.dataset.screenMarket;
              renderScreener();
            }));
            document.getElementById('screener-search')?.addEventListener('input', renderScreener);
            document.getElementById('screener-cap')?.addEventListener('change', e => { screenerMinCap = Number(e.target.value); renderScreener(); });
            document.getElementById('screener-sort')?.addEventListener('change', e => { screenerSort = e.target.value; renderScreener(); });
          });
          JS

          cat > static/css/screener.css <<'CSS'
          .screener-section{margin:12px 16px 30px;background:#fff;border-radius:18px;box-shadow:var(--card-shadow);padding:22px}.screener-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.screener-title{font-size:22px;font-weight:800;color:#191f28}.screener-desc{font-size:13px;color:#6b7684;margin-top:4px}.screener-update{font-size:11px;color:#8b95a1;text-align:right}.screener-controls{display:flex;flex-direction:column;gap:12px}.screener-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.screener-search{flex:1;min-width:220px;border:1px solid #e5e8eb;background:#f7f8fa;border-radius:12px;padding:11px 14px;font:inherit}.screener-search:focus{outline:none;border-color:#3182f6;background:#fff}.screen-chip{border:1px solid #e5e8eb;background:#fff;color:#4e5968;border-radius:18px;padding:8px 12px;font:inherit;font-size:12px;font-weight:650;cursor:pointer}.screen-chip.active{background:#3182f6;border-color:#3182f6;color:#fff}.screen-select{border:1px solid #e5e8eb;border-radius:10px;background:#fff;padding:8px 10px;color:#4e5968;font:inherit;font-size:12px}.screener-summary{font-size:11px;color:#8b95a1;margin:14px 0 8px}.screener-table-wrap{overflow:auto;border:1px solid #f2f4f6;border-radius:12px}.screener-table{width:100%;border-collapse:collapse;min-width:900px;font-size:12px}.screener-table th{position:sticky;top:0;background:#f7f8fa;color:#6b7684;text-align:left;padding:10px;white-space:nowrap}.screener-table td{padding:11px 10px;border-top:1px solid #f2f4f6;vertical-align:middle}.screener-table tbody tr:hover{background:#f9fbff}.screen-name{font-size:13px;font-weight:750;color:#191f28}.screen-code,.screen-sub{font-size:10px;color:#8b95a1;margin-top:2px}.screen-up{color:#f04452}.screen-down{color:#3182f6}.screen-badge{display:inline-block;border-radius:8px;background:#f2f4f6;color:#4e5968;padding:4px 7px;font-size:10px;font-weight:700;white-space:nowrap}.screen-badge.good{background:#eaf8ef;color:#1f9d55}.screen-badge.cross{background:#fff3e8;color:#e46f19}.screen-badge.muted{color:#8b95a1}.screen-score{display:inline-flex;min-width:34px;height:28px;align-items:center;justify-content:center;border-radius:9px;background:#f2f7ff;color:#1b64da;font-weight:800}.screen-add{border:0;border-radius:9px;background:#3182f6;color:#fff;padding:7px 9px;font-size:11px;font-weight:700;cursor:pointer}.screener-loading,.screener-empty{padding:50px 20px;display:flex;gap:10px;justify-content:center;align-items:center;color:#8b95a1;font-size:13px}.screener-note{margin-top:10px;font-size:10px;color:#8b95a1;line-height:1.5}@media(max-width:600px){.screener-section{margin:8px;padding:16px}.screener-head{display:block}.screener-update{text-align:left;margin-top:7px}.screener-title{font-size:19px}.screener-search{min-width:100%;}.tab-btn{font-size:12px;padding-left:6px;padding-right:6px}}
          CSS

          cat > .github/workflows/update-screener.yml <<'YAML'
          name: Update Korean Stock Screener

          on:
            schedule:
              # 16:10 KST on Korean weekdays, after the 15:30 close
              - cron: '10 7 * * 1-5'
            workflow_dispatch:
            push:
              branches: [main, feature/fast-screener]
              paths:
                - 'scripts/generate_screener.py'
                - '.github/workflows/update-screener.yml'

          permissions:
            contents: write

          concurrency:
            group: korean-screener-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 25
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.ref_name }}
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                    cache: pip
                - name: Install screener dependencies
                  run: pip install pykrx pandas requests lxml html5lib
                - name: Generate precomputed screener
                  run: python scripts/generate_screener.py
                - name: Commit refreshed data
                  run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add static/data/screener.json
                    if git diff --cached --quiet; then
                      echo "No screener changes"
                    else
                      git commit -m "data: refresh Korean stock screener"
                      git push origin HEAD:${{ github.ref_name }}
                    fi
          YAML

          python - <<'PY'
          from pathlib import Path

          p = Path('templates/index.html')
          h = p.read_text(encoding='utf-8')
          h = h.replace(
              '주식 수익률 비교, 밸류에이션 분석, FRED 경제 지표를 한눈에. AI 투자 어시스턴트와 대화도 가능합니다.',
              '주식 수익률 비교, 밸류에이션, KOSPI·KOSDAQ 기술적 스크리너와 경제 지표를 한눈에.'
          )
          h = h.replace('<button class="tab-btn" data-tab="ai">🤖 AI 질문</button>', '<button class="tab-btn" data-tab="screener">🔎 종목 발굴</button>')

          start = h.find('        <!-- AI 질문 탭 -->')
          end = h.find('        <!-- 푸터 / 면책 조항 -->')
          if start == -1 or end == -1 or end <= start:
              raise RuntimeError('AI tab markers not found')

          screener = '''        <!-- 종목 발굴 탭 -->
          <div id="screener-tab" class="tab-content">
              <section class="screener-section">
                  <div class="screener-head">
                      <div>
                          <h2 class="screener-title">🔎 한국 주식 빠른 스크리너</h2>
                          <p class="screener-desc">KOSPI·KOSDAQ 전체를 미리 계산해 클릭 즉시 필터링합니다.</p>
                      </div>
                      <div class="screener-update">장 마감 후 자동 갱신 · 서버 실시간 전수조회 없음</div>
                  </div>
                  <div class="screener-controls">
                      <div class="screener-row">
                          <input id="screener-search" class="screener-search" placeholder="종목명 또는 6자리 코드 검색">
                          <select id="screener-cap" class="screen-select" aria-label="최소 시가총액">
                              <option value="0">시총 전체</option>
                              <option value="100000000000" selected>시총 1,000억+</option>
                              <option value="500000000000">시총 5,000억+</option>
                              <option value="1000000000000">시총 1조+</option>
                          </select>
                          <select id="screener-sort" class="screen-select" aria-label="정렬">
                              <option value="score">기술점수 높은순</option>
                              <option value="volumeRatio">거래량 급증순</option>
                              <option value="rsi">RSI 낮은순</option>
                              <option value="ret20">20일 수익률순</option>
                              <option value="marketCap">시총순</option>
                          </select>
                      </div>
                      <div class="screener-row">
                          <button class="screen-chip active" data-screen-market="ALL">전체 시장</button>
                          <button class="screen-chip" data-screen-market="KOSPI">KOSPI</button>
                          <button class="screen-chip" data-screen-market="KOSDAQ">KOSDAQ</button>
                      </div>
                      <div class="screener-row">
                          <button class="screen-chip active" data-screen-preset="candidate">종합 후보</button>
                          <button class="screen-chip" data-screen-preset="oversold">RSI 과매도</button>
                          <button class="screen-chip" data-screen-preset="volume">거래량 2배+</button>
                          <button class="screen-chip" data-screen-preset="cross20">20일선 돌파</button>
                          <button class="screen-chip" data-screen-preset="aligned">정배열</button>
                          <button class="screen-chip" data-screen-preset="all">조건 없음</button>
                      </div>
                  </div>
                  <div id="screener-summary" class="screener-summary">종목 발굴 탭을 열면 데이터를 불러옵니다.</div>
                  <div id="screener-results"><div class="screener-empty">종목 발굴 탭을 열어주세요.</div></div>
                  <div class="screener-note">기술점수는 RSI·이평선·거래량을 단순 조합한 탐색용 지표이며 투자판단 점수가 아닙니다. 데이터는 장 마감 후 갱신됩니다.</div>
              </section>
          </div>

          '''
          h = h[:start] + screener + h[end:]
          h = h.replace('    <script src="/static/js/gemini.js?v=20260219v2"></script>\n', '')
          if '/static/css/screener.css' not in h:
              h = h.replace('</head>', '    <link rel="stylesheet" href="/static/css/screener.css?v=20260910">\n</head>')
          if '/static/js/screener.js' not in h:
              h = h.replace('</body>', '    <script src="/static/js/screener.js?v=20260910"></script>\n</body>')
          p.write_text(h, encoding='utf-8')

          # Enable gzip for the precomputed JSON and the rest of the app.
          m = Path('main.py')
          s = m.read_text(encoding='utf-8')
          if 'from fastapi.middleware.gzip import GZipMiddleware' not in s:
              s = s.replace('from fastapi.middleware.cors import CORSMiddleware', 'from fastapi.middleware.cors import CORSMiddleware\nfrom fastapi.middleware.gzip import GZipMiddleware')
          marker = 'app = FastAPI(title="주식 비교 차트", version="1.0.0")\n'
          if 'GZipMiddleware, minimum_size=500' not in s:
              s = s.replace(marker, marker + 'app.add_middleware(GZipMiddleware, minimum_size=500)\n')
          m.write_text(s, encoding='utf-8')
          PY

          # The bootstrap workflow was only for the initial repository copy.
          rm -f .github/workflows/bootstrap-sync.yml

          # Remove this one-time implementation workflow from the resulting feature branch.
          rm -f .github/workflows/implement-fast-screener.yml

      - name: Validate implementation
        run: |
          python -m py_compile main.py scripts/generate_screener.py
          node --check static/js/screener.js
          grep -q 'data-tab="screener"' templates/index.html
          ! grep -q 'data-tab="ai"' templates/index.html
          ! grep -q '/static/js/gemini.js' templates/index.html

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace AI tab with fast precomputed Korean screener"
          git push origin HEAD:feature/fast-screener
