name: Probe Official Inflation

on:
  workflow_dispatch:
  push:
    branches: ['chore/probe-official-inflation-20261016']
    paths: ['.github/workflows/probe-official-inflation.yml']

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 920cc6013f02baea2dfec15934d37615c9529f37
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install existing collector dependencies
        run: pip install requests beautifulsoup4

      - name: Run exact fallback collector without writing its cache
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          from scripts import generate_inflation_release_cache as collector

          out = Path('source-proof')
          out.mkdir()
          original = collector.OUT.read_bytes()
          previous = json.loads(original)
          counts = {'blsPost': 0, 'icsGet': 0}
          real_post, real_get = collector.requests.post, collector.requests.get
          def observed_post(url, **kwargs):
              if url == collector.BLS_API_URL:
                  counts['blsPost'] += 1
                  (out / 'request.json').write_text(json.dumps(kwargs['json'], indent=2))
              response = real_post(url, **kwargs)
              if url == collector.BLS_API_URL:
                  (out / 'bls-api-response.json').write_bytes(response.content)
              return response
          def observed_get(url, **kwargs):
              if url == collector.ICS_URL:
                  counts['icsGet'] += 1
              response = real_get(url, **kwargs)
              if url == collector.ICS_URL:
                  (out / 'bls-calendar.ics').write_bytes(response.content)
              return response
          collector.requests.post, collector.requests.get = observed_post, observed_get
          checked = datetime.now(timezone.utc)
          result = collector.refresh_cache(previous, now=checked)
          (out / 'collector-result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2))
          rows = result['inflation']['series']
          events = result['releaseCalendar']['events']
          current = collector.stamp(checked)
          summary = {
              'testedCollectorSha': '920cc6013f02baea2dfec15934d37615c9529f37',
              'requestCounts': counts,
              'cacheUnchanged': collector.OUT.read_bytes() == original,
              'originalCacheSha256': hashlib.sha256(original).hexdigest(),
              'inflation': [{'id': r['id'], 'status': r['status'], 'asOf': r['asOf'],
                             'checkedAt': r['checkedAt'], 'publishedAt': r['publishedAt'],
                             'source': r['source'], 'coverage': r['coverage'],
                             'latest': r['points'][-1], 'observationStatus': r.get('observationStatus')}
                            for r in rows],
              'calendar': {'status': result['releaseCalendar']['status'],
                           'checkedAt': result['releaseCalendar']['checkedAt'],
                           'eventCount': len(events),
                           'currentCheckCount': sum(e.get('checkedAt') == current for e in events),
                           'retainedCheckCount': sum(e.get('checkedAt') != current for e in events),
                           'sources': result['releaseCalendar']['sources']},
              'providerErrors': result['errors'],
          }
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2))
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          assert summary['cacheUnchanged']
          assert counts['blsPost'] <= 1 and counts['icsGet'] <= 1
          assert len(rows) == 4 and all(r['status'] in ('ok', 'partial') and len(r['points']) == 60 and r['checkedAt'] == current for r in rows)
          if summary['calendar']['retainedCheckCount']:
              assert result['releaseCalendar']['status'] == 'partial'
              assert result['releaseCalendar']['checkedAt'] == previous['releaseCalendar']['checkedAt']
          PY

      - name: Upload official collector proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-inflation-collector-proof-${{ github.run_id }}
          path: source-proof/
          retention-days: 7
          if-no-files-found: error
