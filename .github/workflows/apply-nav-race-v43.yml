name: Apply V43 Navigation Race Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-nav-race-v43.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/fix_nav_race_v43.py
      - name: Syntax check
        run: node --check static/js/ux_v3.js
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/ux_v3.js tests/v41_my_hub.cjs
          git commit -m 'fix: navigate by visible tab instead of stale active class'
          git push
