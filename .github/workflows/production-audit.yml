name: Production Mobile Verification
on:
  workflow_run:
    workflows: ['App Regression Check']
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production-mobile-verification
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify deployed revision and release assets
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python scripts/verify_deployed_release.py
      - name: Verify production mobile flows
        env:
          APP_URL: https://chart-view-pkv8.onrender.com
          LIVE: '1'
        run: node tests/mobile_smoke.cjs
      - name: Confirm revision and assets stayed unchanged
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python scripts/verify_deployed_release.py --attempts 1 --output test-results/release-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-mobile-review
          path: test-results/
