name: Apply Prelaunch V42 Stabilization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-prelaunch-v42.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prelaunch patch
        run: |
          python scripts/apply_prelaunch_v42.py
          python scripts/fix_prelaunch_v42_tests.py
      - name: Syntax checks
        run: |
          python -m py_compile news_service_v37.py
          for f in static/js/*.js; do node --check "$f"; done
      - name: Focused regression
        run: |
          python -m pip install -q -r requirements.txt pytest httpx
          python -m pytest -q tests/test_prelaunch_v42.py tests/test_v41_2_news_readability.py tests/test_v41_5_consistency.py tests/test_v37_personalized_news.py
          node --test tests/frontend.test.cjs
      - name: Commit generated product changes
        run: |
          git checkout -- .github/workflows/app-check.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            news_service_v37.py \
            static/js/app_state_v40.js \
            static/js/detail_visibility_v40_1.js \
            static/js/ux_v3.js \
            static/js/home_market_v9.js \
            static/js/home_polish_v41_4.js \
            static/js/my_hub_v41.js \
            static/js/resilience_v41_3.js \
            static/js/news_readability_v41_2.js \
            static/js/personalized_news_v40.js \
            static/js/single_detail_v40.js \
            static/js/home_watchlist_boot_v32c.js \
            static/css/my_hub_v41.css \
            static/css/detail_ui_v40.css \
            templates/index.html \
            tests/test_v41_2_news_readability.py \
            tests/test_v41_5_consistency.py \
            tests/test_v37_personalized_news.py \
            tests/test_prelaunch_v42.py \
            tests/prelaunch_v42.cjs
          if git diff --cached --quiet; then
            echo 'No generated product changes'
            exit 0
          fi
          git commit -m 'V42: stabilize prelaunch navigation news state and detail UX'
          git push
