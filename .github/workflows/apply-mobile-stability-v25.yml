name: Apply Mobile Stability V25

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_mobile_stability_v25.py'
      - '.github/workflows/apply-mobile-stability-v25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply stability patch
        run: python scripts/apply_mobile_stability_v25.py
      - name: Validate JavaScript and cache versions
        run: |
          python -m py_compile scripts/apply_mobile_stability_v25.py
          node --check static/js/ux_v3.js
          node --check static/js/ux_patch.js
          node --check static/js/home_ux_v23.js
          node --check static/js/home_market_v9.js
          grep -q 'ux_patch.js?v=20260911v25' templates/index.html
          grep -q 'ux_v3.js?v=20260911v25' static/js/ux_patch.js
          grep -q 'home_market_v9.js?v=20260911v25' static/js/ux_patch.js
          grep -q 'home_ux_v23.js?v=20260911v25' static/js/ux_patch.js
          ! grep -q 'observer.observe(document.body' static/js/ux_v3.js
          ! grep -q 'loadUniverse();' static/js/ux_patch.js
      - name: Commit generated stability changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/ux_v3.js static/js/ux_patch.js static/js/home_ux_v23.js static/js/home_market_v9.js templates/index.html
          if git diff --cached --quiet; then
            echo 'V25 already applied'
          else
            git commit -m 'fix: eliminate mobile startup observers v25'
            git push
          fi
