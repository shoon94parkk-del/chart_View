name: Apply Market Fixes V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-market-fixes-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path

          # Backend routes
          p=Path('main.py'); text=p.read_text(encoding='utf-8')
          imp='from market_service import fetch_compare_stock, fetch_valuation_snapshot\n'
          if imp not in text:
              text=text.replace('import threading\n','import threading\n'+imp,1)
          compare='''@app.get("/api/compare")
          async def compare_stocks(tickers: str, period: str = "1mo", start: str = None, end: str = None):
              ticker_list = [t.strip().upper() for t in tickers.split(",") if t.strip()][:6]
              if not ticker_list:
                  return JSONResponse({"error": "종목을 입력해주세요"}, status_code=400)
              fetched = await asyncio.gather(*[asyncio.to_thread(fetch_compare_stock, t, period, start, end) for t in ticker_list], return_exceptions=True)
              by_ticker, errors = {}, []
              for ticker, item in zip(ticker_list, fetched):
                  if isinstance(item, Exception): errors.append({"ticker": ticker, "message": str(item)})
                  elif item: by_ticker[ticker] = item
                  else: errors.append({"ticker": ticker, "message": "시세 데이터를 가져오지 못했습니다."})
              return {"stocks": [by_ticker[t] for t in ticker_list if t in by_ticker], "errors": errors,
                      "timestamp": datetime.now().strftime("%Y-%m-%d %H:%M:%S"), "source": "Yahoo Finance Chart"}
          '''.replace('\n          ','\n').lstrip()
          s=text.index('@app.get("/api/compare")'); e=text.index('@app.get("/api/popular")',s)
          text=text[:s]+compare+'\n\n'+text[e:]
          valuation='''@app.get("/api/fwd-per")
          @app.get("/api/valuation")
          async def valuation_data(tickers: str):
              ticker_list = [t.strip().upper() for t in tickers.split(",") if t.strip()][:6]
              if not ticker_list: return {"stocks": []}
              fetched = await asyncio.gather(*[asyncio.to_thread(fetch_valuation_snapshot, t) for t in ticker_list], return_exceptions=True)
              stocks, errors = [], []
              for ticker, item in zip(ticker_list, fetched):
                  if isinstance(item, Exception): errors.append({"ticker": ticker, "message": str(item)})
                  elif item: stocks.append(item)
                  else: errors.append({"ticker": ticker, "message": "밸류에이션 데이터를 가져오지 못했습니다."})
              return {"stocks": stocks, "errors": errors, "timestamp": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                      "source": "Yahoo Finance Chart + Fundamentals"}
          '''.replace('\n          ','\n').lstrip()
          s=text.index('@app.get("/api/fwd-per")'); e=text.index('# ========================\n# Gemini AI 질문 답변 API',s)
          text=text[:s]+valuation+'\n\n'+text[e:]
          p.write_text(text,encoding='utf-8')

          # Valuation UI: reliable overview, lazy loading, no fake zero
          p=Path('static/js/fwdper.js'); js=p.read_text(encoding='utf-8-sig')
          s=js.index("    'overview': {"); e=js.index("    'fwd_per': {",s)
          overview='''    'overview': {
              title: '종합 밸류에이션 비교',
              description: '현재 확인 가능한 핵심 투자 지표를 한눈에 비교합니다.',
              columns: [
                  { key: 'trailingPE', label: 'PER', format: 'number', color: true },
                  { key: 'pbr', label: 'PBR', format: 'number', color: true },
                  { key: 'psr', label: 'PSR', format: 'number', color: true },
                  { key: 'roe', label: 'ROE(%)', format: 'percent', color: true }
              ],
              barKey: 'trailingPE', barLabel: 'PER (최근 실적)', sortKey: 'trailingPE',
              colorFunc: (v) => v > 0 && v < 25 ? '#3182F6' : '#6B7684'
          },
          '''.replace('\n          ','\n')
          js=js[:s]+overview+js[e:]
          price_line="        const priceStr = isKR ? `₩${stock.price?.toLocaleString()}` : `$${stock.price?.toLocaleString()}`;"
          if price_line in js:
              js=js.replace(price_line,"        const hasPrice = stock.price != null && Number(stock.price) > 0;\n        const priceStr = !hasPrice ? '-' : (isKR ? `₩${Math.round(Number(stock.price)).toLocaleString()}` : `$${Number(stock.price).toLocaleString(undefined, { maximumFractionDigits: 2 })}`);",1)
          s=js.index('window.addPerTickerDirect = function (ticker) {'); e=js.index('window.removePerTicker = function (ticker)',s)
          lazy='''window.addPerTickerDirect = function (ticker) {
              if (!perTickers.includes(ticker)) {
                  perTickers.push(ticker);
                  const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
                  if (activeTab === 'fwdper') loadPerData();
              }
          };

          '''.replace('\n          ','\n')
          js=js[:s]+lazy+js[e:]
          js=js.replace('    // 초기 로드\n    loadPerData();','    // 밸류에이션 탭을 열 때만 데이터 로드',1)
          p.write_text(js,encoding='utf-8')

          # Chart loader becomes a small inline status chip
          p=Path('static/js/chart.js'); chart=p.read_text(encoding='utf-8-sig')
          s=chart.index('function showLoading(show) {'); e=chart.index('// 이벤트 리스너',s)
          loader='''function showLoading(show) {
              const section = document.querySelector('.chart-section');
              if (!section) return;
              let indicator = section.querySelector('.ux-inline-loader');
              if (!indicator) {
                  indicator = document.createElement('div');
                  indicator.className = 'ux-inline-loader';
                  indicator.innerHTML = '<span class="ux-mini-spinner"></span><span>차트 업데이트 중</span>';
                  const header = section.querySelector('.chart-header');
                  if (header) header.insertAdjacentElement('afterend', indicator); else section.prepend(indicator);
              }
              indicator.classList.toggle('show', !!show);
          }

          '''.replace('\n          ','\n')
          chart=chart[:s]+loader+chart[e:]
          p.write_text(chart,encoding='utf-8')

          # CSS: never block the whole app during routine data refreshes
          p=Path('static/css/ux_patch.css'); css=p.read_text(encoding='utf-8')
          if '/* nonblocking-loaders-v2 */' not in css:
              css += '''

          /* nonblocking-loaders-v2 */
          #loading.loading { display:none !important; }
          .chart-section,.per-section { position:relative; }
          .ux-inline-loader { display:none;align-items:center;gap:7px;width:max-content;margin:4px 16px 8px auto;padding:6px 10px;border-radius:999px;background:#f2f4f6;color:#6b7684;font-size:12px;font-weight:600; }
          .ux-inline-loader.show { display:flex; }
          .ux-mini-spinner { width:13px;height:13px;border:2px solid #d1d6db;border-top-color:#3182f6;border-radius:50%;animation:ux-spin .7s linear infinite; }
          @keyframes ux-spin { to { transform:rotate(360deg); } }
          #per-loading.loading { position:absolute !important;inset:0 !important;min-height:160px;background:rgba(255,255,255,.72);z-index:20;border-radius:16px; }
          #per-loading.loading.hidden { display:none !important; }
          #per-loading.loading:not(.hidden) { display:flex !important; }
          '''.replace('\n          ','\n')
          p.write_text(css,encoding='utf-8')

          compile(Path('main.py').read_text(encoding='utf-8'),'main.py','exec')
          compile(Path('market_service.py').read_text(encoding='utf-8'),'market_service.py','exec')
          print('OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py static/js/fwdper.js static/js/chart.js static/css/ux_patch.css
          git commit -m "fix: remove blocking loaders and restore valuation data"
          git push origin HEAD:main
