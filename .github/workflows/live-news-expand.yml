name: Live MY News Expansion

on:
  push:
    branches: [main]
    paths:
      - 'static/js/news_readability_v41_2.js'
      - 'static/js/home_watchlist_boot_v32c.js'
      - 'static/css/news_summary_expand_v48.css'
      - 'tests/live_news_expand.cjs'
      - '.github/workflows/live-news-expand.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-news-expand:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for exact Render revision
        env:
          APP_URL: https://chart-view-bsg6.onrender.com
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const expected = process.env.EXPECTED_SHA;
          const base = process.env.APP_URL;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            let last = null;
            for (let i = 0; i < 96; i++) {
              try {
                const r = await fetch(`${base}/health?live_news_expand_revision=${Date.now()}`, { cache: 'no-store' });
                const j = await r.json();
                last = j.revision;
                console.log(`revision attempt ${i + 1}:`, last);
                if (last === expected) return;
              } catch (e) {
                console.log(`revision attempt ${i + 1} failed:`, e.message);
              }
              await sleep(5000);
            }
            throw new Error(`Render revision mismatch. expected=${expected} last=${last}`);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify real MY news full expansion
        env:
          APP_URL: https://chart-view-bsg6.onrender.com
        run: node tests/live_news_expand.cjs
