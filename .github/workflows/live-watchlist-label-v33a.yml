name: Live Watchlist Label V33a

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-watchlist-label-v33a.yml'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify live one-month labels
        run: |
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport:{width:384,height:824}, isMobile:true, hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'
            });
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror', e=>errors.push(String(e)));
            const res=await page.goto('https://chart-view-bsg6.onrender.com/?label33a=2',{waitUntil:'domcontentloaded',timeout:60000});
            assert(res && res.status()===200,'HTTP failed');
            await page.waitForSelector('.app-bottom-btn[data-app-mode="watchlist"]',{state:'visible',timeout:20000});
            await page.locator('.app-bottom-btn[data-app-mode="watchlist"]').tap();
            await page.waitForSelector('#watchlist-tab',{state:'visible',timeout:10000});
            await page.waitForFunction(()=>document.querySelector('#watchlist-tab')?.innerText.includes('1달 수익률'),null,{timeout:15000});
            const text=await page.locator('#watchlist-tab').innerText();
            assert(text.includes('현재가와 1달 수익률'),'header not explicit');
            assert(text.includes('1달 상승'),'1-month up summary missing');
            assert(text.includes('1달 하락'),'1-month down summary missing');
            assert(text.includes('1달 수익률↑'),'1-month high sort label missing');
            assert(text.includes('1달 수익률↓'),'1-month low sort label missing');
            assert(!text.includes('1개월 수익률'),'old ambiguous wording remains');
            await page.waitForFunction(()=>[...document.querySelectorAll('#watchlist-v30-grid .watchlist-v30-meta')].some(x=>x.textContent.includes('1달 수익률')),null,{timeout:15000});
            if(errors.length) throw new Error('browser errors: '+errors.join(' | '));
            console.log('LIVE WATCHLIST LABEL V33A PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
