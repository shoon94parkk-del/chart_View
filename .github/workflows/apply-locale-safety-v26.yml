name: Apply Locale Safety V26

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_locale_safety_v26.py'
      - '.github/workflows/apply-locale-safety-v26.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply locale safety patch
        run: python scripts/apply_locale_safety_v26.py
      - name: Validate
        run: |
          python -m py_compile scripts/apply_locale_safety_v26.py
          node --check static/js/home_brief_v8.js
          node --check static/js/ux_v3.js
          node --check static/js/ux_patch.js
          grep -q "toLocaleString('en-US'" static/js/home_brief_v8.js
          grep -q 'home_brief_v8.js?v=20260911v26' static/js/ux_v3.js
          grep -q 'ux_v3.js?v=20260911v26' static/js/ux_patch.js
          grep -q 'ux_patch.js?v=20260911v26' templates/index.html
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/home_brief_v8.js static/js/ux_v3.js static/js/ux_patch.js templates/index.html
          if git diff --cached --quiet; then
            echo 'V26 already applied'
          else
            git commit -m 'fix: make mobile locale formatting deterministic v26'
            git push
          fi
