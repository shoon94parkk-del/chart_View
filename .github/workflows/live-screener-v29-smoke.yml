name: Live Screener V29 Smoke

on:
  push:
    paths:
      - '.github/workflows/live-screener-v29-smoke.yml'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify live screener freshness
        shell: bash
        run: |
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport:{width:384,height:824}, isMobile:true, hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'
            });
            const page = await context.newPage();
            const errors=[];
            const requests=[];
            page.on('pageerror', e=>errors.push(String(e)));
            page.on('request', r=>{ if(r.url().includes('screener')) requests.push(r.url()); });
            const res = await page.goto('https://chart-view-bsg6.onrender.com/?v29fresh=1',{waitUntil:'domcontentloaded',timeout:60000});
            assert(res && res.status()===200,'homepage HTTP failed');
            await page.waitForSelector('#ux12-data-status [data-status="screener"] strong',{timeout:20000});
            await page.waitForTimeout(1200);
            const status = (await page.locator('#ux12-data-status [data-status="screener"] strong').textContent()).trim();
            console.log('home_status=',status);
            assert(status.includes('09.11'),'home screener status is stale: '+status);

            await page.locator('.app-bottom-btn[data-app-mode="discover"]').tap({timeout:5000});
            await page.waitForSelector('#screener-summary',{state:'visible',timeout:5000});
            await page.waitForFunction(()=>document.querySelector('#screener-summary')?.textContent?.includes('2026-09-11'),null,{timeout:20000});
            const summary=(await page.locator('#screener-summary').textContent()).trim();
            console.log('screener_summary=',summary);
            assert(summary.includes('2026-09-11'),'screener tab stale: '+summary);

            const metaRes=await context.request.get('https://chart-view-bsg6.onrender.com/static/data/screener_meta.json?smoke=1');
            assert(metaRes.ok(),'meta endpoint failed');
            const meta=await metaRes.json();
            console.log('meta=',meta);
            assert(meta.tradeDate==='2026-09-11');
            assert(meta.count===2604);
            console.log('screener_requests=',requests.filter(x=>x.includes('screener.json')).join('\n'));
            assert(requests.some(x=>x.includes('screener.json?v=2026-09-11')),'versioned screener request missing');
            if(errors.length) throw new Error('browser errors: '+errors.join(' | '));
            console.log('LIVE SCREENER V29 SMOKE PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
