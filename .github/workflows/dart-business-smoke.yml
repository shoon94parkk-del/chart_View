name: DART Business Report Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dart_business_service.py'
      - 'tests/test_dart_business_service.py'
      - '.github/workflows/dart-business-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: pip install -q -r requirements.txt
      - name: Probe representative DART business reports
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import json, time
          import pandas as pd
          from io import StringIO
          import dart_business_service as d

          probes=[
              ('208370.KQ','셀바스헬스케어'),
              ('196300.KQ','HLB펩'),
          ]

          def retry_get(session,url,*,params=None,tries=5):
              last=None
              for attempt in range(1,tries+1):
                  try:
                      res=session.get(url,params=params,timeout=d.REQUEST_TIMEOUT)
                      res.raise_for_status()
                      return res
                  except Exception as exc:
                      last=exc
                      print('DART_DIAG_RETRY',attempt,type(exc).__name__,str(exc)[:180])
                      time.sleep(attempt*1.5)
              raise last

          def diagnose(result,label):
              if not result.get('reportFound') or result.get('available'):
                  return
              session=d._session()
              try:
                  main=retry_get(
                      session,
                      f"{d.DART_BASE}/dsaf001/main.do",
                      params={'rcpNo':result['rceptNo']},
                  )
              except Exception as exc:
                  print(label,'DART_DIAG_MAIN_FAIL',type(exc).__name__,str(exc)[:300])
                  return
              nodes=d._viewer_nodes(main.text)
              titles=[node.get('title') for node in nodes if node.get('title')]
              print(f'{label}_DART_NODE_TITLES=',json.dumps(titles[:120],ensure_ascii=False))

              targets=[
                  node for node in nodes
                  if any(word in (node.get('title') or '') for word in d.TARGET_SECTION_WORDS)
              ]
              targets.sort(key=lambda x:(0 if any(word in x['title'] for word in d.TARGET_SECTION_WORDS[:5]) else 1,len(x['title'])))
              print(f'{label}_DART_TARGETS=',json.dumps([{k:n.get(k) for k in ('title','dcm','ele','offset','length')} for n in targets[:10]],ensure_ascii=False))

              docs=[]
              for node in targets[:8]:
                  try:
                      response=retry_get(
                          session,
                          f"{d.DART_BASE}/report/viewer.do",
                          params={
                              'rcpNo':node['rcp'],'dcmNo':node['dcm'],'eleId':node['ele'],
                              'offset':node['offset'],'length':node['length'],'dtd':node['dtd'],
                          },
                      )
                  except Exception as exc:
                      print(label,'VIEWER_FAIL',node.get('title'),type(exc).__name__)
                      continue
                  if '매출' in response.text or '판매' in response.text:
                      docs.append((node.get('title') or '',response.text))

              print(f'{label}_DART_SELECTED_DOCS=',len(docs))
              for idx,(title,html) in enumerate(docs):
                  try:
                      tables=pd.read_html(StringIO(html))
                  except Exception as exc:
                      print(label,'DOC',idx,title,'READ_HTML_FAIL',type(exc).__name__)
                      continue
                  for tidx,table in enumerate(tables):
                      flat=' '.join(map(str,table.columns))+' '+table.astype(str).to_string(index=False)
                      if '매출' not in flat and '매출액' not in flat and '판매' not in flat:
                          continue
                      print(label,'DART_TABLE',idx,tidx,'SECTION',title,'SHAPE',table.shape,
                            'COLUMNS',json.dumps([str(x) for x in table.columns],ensure_ascii=False))
                      print(table.head(22).to_string(index=False)[:10000])

          results={}
          for ticker,name in probes:
              result=d.fetch_business_report(ticker,name)
              results[ticker]=result
              safe={k:v for k,v in result.items() if k not in {'raw'}}
              print('===',ticker,name,'===')
              print(json.dumps(safe,ensure_ascii=False,indent=2))
              print('DART_SMOKE',
                    'ticker=',ticker,
                    'reportFound=',bool(result.get('reportFound')),
                    'available=',bool(result.get('available')),
                    'mode=',result.get('sourceMode'),
                    'reason=',result.get('reason'))
              diagnose(result,ticker.replace('.','_'))

          selvas=results['208370.KQ']
          assert selvas.get('available') is True
          assert (selvas.get('topItem') or {}).get('name') == '체성분분석기'
          assert abs(float((selvas.get('topItem') or {}).get('share') or 0)-31.12) < 0.01
          PY
