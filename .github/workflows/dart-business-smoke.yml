name: DART Business Report Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dart_business_service.py'
      - 'tests/test_dart_business_service.py'
      - '.github/workflows/dart-business-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: pip install -q -r requirements.txt
      - name: Probe latest SELVAS Healthcare business report
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from dart_business_service import fetch_business_report
          result=fetch_business_report('208370.KQ','셀바스헬스케어')
          safe={k:v for k,v in result.items() if k not in {'raw'}}
          print(json.dumps(safe,ensure_ascii=False,indent=2))
          print('DART_SMOKE reportFound=', bool(result.get('reportFound')),
                'available=', bool(result.get('available')),
                'mode=', result.get('sourceMode'),
                'reason=', result.get('reason'))
          if result.get('reportFound') and not result.get('available'):
              import re, pandas as pd
              from io import StringIO
              import dart_business_service as d
              session=d._session()
              main=session.get(f"{d.DART_BASE}/dsaf001/main.do",params={'rcpNo':result['rceptNo']},timeout=d.REQUEST_TIMEOUT)
              for token in ('viewDoc(', 'dcmNo', 'treeNode', 'text:'):
                  pos=main.text.find(token)
                  print('DART_MAIN_TOKEN',token,'POS',pos)
                  if pos>=0:
                      print(main.text[max(0,pos-2500):pos+8000])
              nodes=d._viewer_nodes(main.text)
              titles=[node.get('title') for node in nodes if node.get('title')]
              print('DART_NODE_TITLES=', json.dumps(titles[:120],ensure_ascii=False))
              docs=d._viewer_sections_web(result['rceptNo'])
              print('DART_SELECTED_DOCS=', len(docs))
              for idx,html in enumerate(docs):
                  try:
                      tables=pd.read_html(StringIO(html))
                  except Exception as exc:
                      print('DOC',idx,'READ_HTML_FAIL',type(exc).__name__)
                      continue
                  for tidx,table in enumerate(tables):
                      text=' '.join(map(str,table.columns))+' '+table.astype(str).to_string(index=False)
                      if '매출' not in text:
                          continue
                      print('DART_TABLE',idx,tidx,'SHAPE',table.shape,'COLUMNS',json.dumps([str(x) for x in table.columns],ensure_ascii=False))
                      print(table.head(12).to_string(index=False)[:5000])
          PY
