name: Apply V41.7 News Summary Toggle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v41-7-news-summary-toggle.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V41.7 patch
        run: python scripts/apply_v41_7_news_summary_toggle.py
      - name: Validate syntax
        run: |
          node --check static/js/news_readability_v41_2.js
          node --check static/js/home_watchlist_boot_v32c.js
      - name: Run focused regression
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_v41_7_news_summary_toggle.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/news_readability_v41_2.js static/css/news_readability_v41_2.css static/js/home_watchlist_boot_v32c.js templates/index.html tests/test_v41_7_news_summary_toggle.py
          git commit -m 'V41.7: make news summaries expandable'
          git push
