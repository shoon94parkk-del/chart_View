name: Live V28 Mobile Smoke

on:
  push:
    paths:
      - '.github/workflows/live-v28-smoke.yml'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify live V28
        shell: bash
        run: |
          cat > smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport:{width:384,height:824}, isMobile:true, hasTouch:true,
              userAgent:'Mozilla/5.0 (Linux; Android 16; SAMSUNG SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/29.0 Chrome/140.0 Mobile Safari/537.36'
            });
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror', e=>errors.push(String(e)));

            const res = await page.goto('https://chart-view-bsg6.onrender.com/?v28smoke=1',{waitUntil:'domcontentloaded',timeout:60000});
            assert(res && res.status()===200,'HTTP failed');
            await page.waitForSelector('.ticker-tag',{timeout:20000});
            await page.waitForTimeout(1200);

            const tags = await page.locator('.ticker-tag').allTextContents();
            console.log('tags=',tags);
            assert(tags.length===3,'expected 3 default stocks');
            assert(tags.some(t=>t.includes('삼성전자')),'Samsung Electronics missing');

            const sector = page.locator('.sector-section');
            assert(await sector.evaluate(el=>el.classList.contains('ux-collapsed')),'recommendations not collapsed');
            const toggle = page.locator('.ux-sector-toggle');
            assert((await toggle.getAttribute('aria-expanded'))==='false','recommendation toggle should start closed');

            await page.locator('.app-bottom-btn[data-app-mode="tools"]').tap({timeout:5000});
            await page.waitForSelector('#tools-tab',{state:'visible',timeout:5000});
            const cards = page.locator('.investment-tool-card');
            assert((await cards.count())===12,'expected 12 investment tools');
            const names = await cards.locator('strong').allTextContents();
            console.log('tools=',names.join(', '));
            for (const name of ['Koyfin','Macrotrends','Trading Economics','Seeking Alpha']) assert(names.includes(name),name+' missing');

            const imgs = page.locator('.investment-tool-icon img');
            assert((await imgs.count())===12,'expected 12 logo images');
            const srcs = await imgs.evaluateAll(els=>els.map(x=>x.getAttribute('src')||''));
            assert(srcs.every(x=>x.includes('google.com/s2/favicons')),'brand favicons not configured');
            await page.waitForTimeout(2500);
            const loaded = await imgs.evaluateAll(els=>els.filter(x=>x.complete && x.naturalWidth>0).length);
            console.log('logos_loaded=',loaded);
            assert(loaded>=10,'too many tool logos failed to load');

            if(errors.length) throw new Error('browser errors: '+errors.join(' | '));
            console.log('LIVE V28 MOBILE SMOKE PASSED');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
