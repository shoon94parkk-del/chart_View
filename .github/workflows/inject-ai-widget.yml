name: Inject AI Top3 Widget

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-ai-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject widget script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '    <script src="/static/js/ai_daily_widget.js"></script>\n'
          if '/static/js/ai_daily_widget.js' not in s:
              s = s.replace('    <script src="/static/js/chart.js"></script>', tag + '    <script src="/static/js/chart.js"></script>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Already injected"
          else
            git commit -m "feat: show daily AI top3 on home"
            git push origin HEAD:main
          fi
