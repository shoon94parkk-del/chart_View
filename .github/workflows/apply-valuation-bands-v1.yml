name: Apply Valuation Bands V1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-valuation-bands-v1.yml'
      - 'scripts/apply_valuation_bands_v1.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/apply_valuation_bands_v1.py
      - name: Syntax checks
        run: |
          python -m py_compile main.py valuation_band_service.py
          node --check static/js/valuation_bands.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py templates/index.html .github/workflows/live-smoke.yml
          if git diff --cached --quiet; then
            echo "No integration changes"
          else
            git commit -m "feat: integrate historical PER PBR valuation bands"
            git push origin HEAD:main
          fi
