name: V37 Router Patch

on:
  push:
    branches:
      - v37-personalized-news

permissions:
  contents: write

jobs:
  patch-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply router patch
        run: python scripts/patch_v37_main.py
      - name: Commit router patch if needed
        run: |
          if git diff --quiet -- main.py; then
            echo "main.py already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "feat: mount v37 personalized news router"
          git push origin HEAD:v37-personalized-news
