name: Export Screener Candidates Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-candidates-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export top 100 from existing screener
        run: python scripts/export_screener_candidates.py
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/screener_top100.json
          if git diff --cached --quiet; then
            echo "No candidate changes"
          else
            git commit -m "data: export screener top 100"
            git push origin HEAD:main
          fi
