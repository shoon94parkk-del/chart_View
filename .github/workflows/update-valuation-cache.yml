name: Update Valuation Detail Cache

on:
  schedule:
    # 07:30 KST Monday-Friday = 22:30 UTC Sunday-Thursday.
    - cron: '30 22 * * 0-4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_valuation_cache.py'
      - '.github/workflows/update-valuation-cache.yml'

permissions:
  contents: write

concurrency:
  group: valuation-detail-cache
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Generate cache
        run: python scripts/generate_valuation_cache.py
      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/valuation_cache.json
          if git diff --cached --quiet; then
            echo "No cache changes"
          else
            git commit -m "data: refresh valuation detail cache"
            git push origin HEAD:main
          fi
