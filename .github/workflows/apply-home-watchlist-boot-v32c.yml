name: Apply Home Watchlist Boot V32c

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-home-watchlist-boot-v32c.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/apply_home_watchlist_boot_v32c.py
      - name: Validate
        run: grep -q 'home_watchlist_boot_v32c.js?v=20260912v32c' templates/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: load home watchlist boot guard v32c'
          git push
