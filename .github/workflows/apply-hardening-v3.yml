name: Apply Runtime Hardening V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hardening-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply hardening fixes
        run: python scripts/apply_hardening_v3.py
      - name: Validate syntax
        run: |
          python -m py_compile market_service.py main.py
          node --check static/js/chart.js
          node --check static/js/fwdper.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_service.py static/js/chart.js static/js/fwdper.js templates/index.html .github/workflows/update-valuation-cache.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: harden chart races, valuation cache and removal sync"
            git push origin HEAD:main
          fi
