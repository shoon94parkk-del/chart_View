name: Fix Home Cache V17 Patcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-cache-v17-patcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix patcher newline escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_home_cache_v17.py')
          s = p.read_text(encoding='utf-8')
          old = "snapshot_code = r'''\\n\\n"
          new = "snapshot_code = '''\n\n"
          if old not in s:
              raise SystemExit('patcher target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply HOME V17
        run: python scripts/apply_home_cache_v17.py
      - name: Validate
        run: |
          python -m py_compile main.py
          node --check static/js/home_brief_v8.js
          grep -q '/api/home-snapshot' main.py
          grep -q 'stale-while-revalidate' main.py
          grep -q 'cdn.simpleicons.org/samsung' static/js/home_brief_v8.js
          grep -q 'chartview-home-snapshot-v17' static/js/home_brief_v8.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_home_cache_v17.py main.py static/js/home_brief_v8.js
          git commit -m 'feat: shared cached home snapshot and clean brand logos'
          git push
