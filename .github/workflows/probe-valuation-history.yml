name: Probe Historical Valuation Series
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-valuation-history.yml','valuation_band_service.py']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Verify reconstructed PER/PBR bands
        run: |
          python - <<'PY'
          from valuation_band_service import fetch_valuation_bands
          for s in ['AAPL','NVDA','005930.KS','000660.KS']:
              d=fetch_valuation_bands(s,3)
              ps=d['per']['stats']; bs=d['pbr']['stats']
              print(s,'PER',ps,'PBR',bs,'validation',d.get('perValidation'))
              assert d['per']['points'] and d['pbr']['points']
              assert ps['observations'] >= 30 and bs['observations'] >= 30
              assert 0 < ps['current'] < 200
              assert 0 < bs['current'] < 100
              assert 0 <= ps['percentile'] <= 100
              assert 0 <= bs['percentile'] <= 100
              # A stock split must not create an artificial multi-fold jump in PBR.
              p=[float(x['value']) for x in d['pbr']['points']]
              jumps=[max(a/b,b/a) for a,b in zip(p,p[1:]) if a>0 and b>0]
              assert not jumps or max(jumps) < 3.0, (s,max(jumps))
          PY
