name: Probe Historical Valuation Series
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-valuation-history.yml','valuation_band_service.py']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Verify reconstructed PER/PBR bands
        run: |
          python - <<'PY'
          from valuation_band_service import fetch_valuation_bands
          for s in ['AAPL','005930.KS','000660.KS']:
              d=fetch_valuation_bands(s,3)
              ps=d['per']['stats']; bs=d['pbr']['stats']
              print(s,'PER',ps,'PBR',bs)
              assert d['per']['points'] and d['pbr']['points']
              assert ps['observations'] >= 30 and bs['observations'] >= 30
              assert 0 < ps['current'] < 200
              assert 0 < bs['current'] < 100
              assert 0 <= ps['percentile'] <= 100
              assert 0 <= bs['percentile'] <= 100
          PY
