  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1070" cy="80" r="210" fill="#5b8def" opacity=".12"/>
  <circle cx="1120" cy="570" r="260" fill="#7c9cff" opacity=".08"/>

