    <path d="M13 48h38" stroke="#5b8def" stroke-width="4" stroke-linecap="round"/>
    <text x="86" y="43" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">Chart View</text>
  </g>

  <text x="82" y="238" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#fff">주식 비교를 더 빠르고 선명하게</text>
  <text x="82" y="302" font-family="Arial, sans-serif" font-size="31" font-weight="500" fill="#cbd5e1">한국·미국 종목의 차트, 밸류에이션, 투자판단 근거를 한 곳에서</text>

