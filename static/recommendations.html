<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Chart View | AI 추천 기록</title>
  <style>
    :root{--ink:#191f28;--muted:#6b7684;--line:#e8edf3;--blue:#1b64da;--surface:#fff;--wash:#f5f8fc;--up:#e23d4a;--down:#2675d9}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1080px;margin:auto;padding:24px 16px 72px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.back{min-height:44px;display:inline-flex;align-items:center;color:#3c4858;text-decoration:none;font-size:14px;font-weight:750}.eyebrow{margin:0 0 6px;color:var(--blue);font-size:12px;font-weight:850;letter-spacing:.08em}.title h1{margin:0;font-size:clamp(24px,4vw,32px);letter-spacing:-.65px;text-wrap:balance}.title p{max-width:680px;margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.55}.notice{margin:18px 0;background:#edf5ff;border:1px solid #d4e6ff;border-radius:14px;padding:12px 14px;color:#36516f;font-size:13px;line-height:1.5}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0 30px}.kpi,.day,.track{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(25,31,40,.03)}.kpi{padding:15px}.kpi span{display:block;color:var(--muted);font-size:12px}.kpi b{display:block;margin-top:8px;font-size:22px;font-variant-numeric:tabular-nums}.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 0 10px}.section-title h2{margin:0;font-size:19px;letter-spacing:-.3px}.section-title span{color:#8b95a1;font-size:12px}.days{display:grid;gap:10px}.day{padding:16px}.day-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.day-date{font-size:16px;font-weight:850}.day-status{max-width:58%;color:var(--muted);font-size:11px;line-height:1.45;text-align:right}.rank-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:13px}.rank{min-width:0;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfcfe}.rank-top,.track-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.rank-label,.rank-score,.pill{font-size:11px;font-weight:800}.rank-label{color:var(--muted)}.rank-score{color:var(--blue);font-variant-numeric:tabular-nums}.stock{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px;font-size:16px}.price{margin-top:5px;color:#4e5968;font-size:13px;font-variant-numeric:tabular-nums}.pill{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:999px;background:#eef5ff;color:#245cab}.reason{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.track-list{display:grid;gap:9px}.track{padding:15px}.track-name{font-size:17px}.track-sub{margin-top:3px;color:var(--muted);font-size:12px}.return{font-size:21px;font-weight:850;font-variant-numeric:tabular-nums}.up{color:var(--up)}.down{color:var(--down)}.track-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}.track-grid div{padding:9px;background:#f7f9fc;border-radius:10px;min-width:0}.track-grid span{display:block;color:var(--muted);font-size:10px}.track-grid b{display:block;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}.empty{padding:36px 16px;border:1px dashed #cfd9e6;border-radius:16px;color:var(--muted);text-align:center;background:var(--surface);line-height:1.55}@media(max-width:700px){.wrap{padding:18px 14px 84px}.head{gap:8px}.back{font-size:13px}.summary{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:24px}.kpi{padding:13px}.rank-grid{grid-template-columns:1fr}.day-status{max-width:52%;font-size:10px}.track-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.track-grid div:last-child{grid-column:span 2}.section-title{align-items:flex-start;flex-direction:column;gap:3px}}
  </style>
</head>
<body><main class="wrap"><header class="head"><div class="title"><p class="eyebrow">DAILY SCREENER LEDGER</p><h1>AI 추천 기록과 성과 추적</h1><p>각 거래일의 TOP3와 추천 당시 종가를 고정하고, 이후 최신 스크리너 종가로 수익률을 비교합니다.</p></div><a class="back" href="/" aria-label="차트뷰 홈으로 돌아가기">← 차트뷰</a></header><div class="notice">자동 기술 스크리너 결과이며 매수·매도 권유가 아닙니다. 가격 2차 검증 대기 상태와 수익률 기준일을 함께 확인하세요.</div><section id="summary" class="summary" aria-label="추천 성과 요약"></section><div class="section-title"><h2>날짜별 TOP3</h2><span>추천 당시 가격·점수 고정</span></div><section id="daily" class="days" aria-live="polite"></section><div class="section-title"><h2>추천 트랙레코드</h2><span>최신 스크리너 종가 기준</span></div><section id="list" class="track-list" aria-live="polite"></section></main>
<script>
const f=n=>Number.isFinite(+n)?Math.round(+n).toLocaleString('ko-KR'):'-';const p=n=>Number.isFinite(+n)?`${+n>0?'+':''}${(+n).toFixed(2)}%`:'-';const e=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const cls=n=>Number(n)>0?'up':Number(n)<0?'down':'';
async function json(url,opts){const r=await fetch(url,opts);if(!r.ok)throw new Error(r.status);return r.json()}
(async()=>{try{const meta=await json('/static/data/ai_daily_rankings_meta.json?v=20260915v1',{cache:'no-store'}).catch(()=>({}));const v=encodeURIComponent(meta.updated||'20260915v1');const [dailyData,recData]=await Promise.all([json(`/static/data/ai_daily_rankings.json?v=${v}`,{cache:'default'}),json(`/static/data/ai_recommendations.json?v=${v}`,{cache:'default'})]);const days=Array.isArray(dailyData.days)?dailyData.days:[];const rows=Array.isArray(recData.recommendations)?recData.recommendations:[];const wins=rows.filter(x=>Number(x.returnPct)>0);const avg=rows.length?rows.reduce((sum,x)=>sum+(Number(x.returnPct)||0),0)/rows.length:0;document.querySelector('#summary').innerHTML=`<div class="kpi"><span>누적 추천일</span><b>${days.length}</b></div><div class="kpi"><span>누적 추천 종목</span><b>${rows.length}</b></div><div class="kpi"><span>수익 구간 비율</span><b>${rows.length?(wins.length/rows.length*100).toFixed(0):0}%</b></div><div class="kpi"><span>평균 수익률</span><b class="${cls(avg)}">${p(avg)}</b></div>`;const daily=document.querySelector('#daily');daily.innerHTML=days.length?[...days].reverse().map(d=>`<article class="day"><div class="day-head"><div class="day-date">${e(d.tradeDate||'-')}</div><div class="day-status">${e(d.status||'')}</div></div><div class="rank-grid">${(d.top3||[]).slice(0,3).map(x=>`<div class="rank"><div class="rank-top"><span class="rank-label">${e(x.rank)}위 · ${e(x.grade||'관찰')}</span><span class="rank-score">${e(x.totalScore)}점</span></div><strong class="stock">${e(x.name||x.symbol)}</strong><div class="price">추천가 ${f(x.close)}원 · <span class="${cls(x.changePct)}">${p(x.changePct)}</span></div><p class="reason">${e(x.reason||'')}</p></div>`).join('')}</div></article>`).join(''):'<div class="empty">아직 누적된 TOP3 기록이 없습니다.</div>';const list=document.querySelector('#list');list.innerHTML=rows.length?[...rows].sort((a,b)=>String(b.recommendedDate).localeCompare(String(a.recommendedDate))||Number(a.rank)-Number(b.rank)).map(x=>`<article class="track"><div class="track-top"><div><strong class="track-name">${e(x.name||x.symbol)}</strong><div class="track-sub">${e(x.recommendedDate)} · ${e(x.rank)}위 · ${e(x.statusLabel||'성과 추적 중')}</div></div><div class="return ${cls(x.returnPct)}">${p(x.returnPct)}</div></div><div class="track-grid"><div><span>추천가</span><b>${f(x.recommendedPrice)}원</b></div><div><span>현재가</span><b>${f(x.currentPrice)}원</b></div><div><span>최고 수익률</span><b class="${cls(x.bestReturnPct)}">${p(x.bestReturnPct)}</b></div><div><span>점수</span><b>${e(x.score)}점</b></div><div><span>기준일</span><b>${e(x.lastUpdatedTradeDate||'-')}</b></div></div><span class="pill">${e(x.grade||'관찰')}</span><p class="reason">${e(x.reason||'')}</p></article>`).join(''):'<div class="empty">다음 정상 장 마감 후 첫 3개 추천부터 성과가 누적됩니다.</div>'}catch(err){document.querySelector('#daily').innerHTML='<div class="empty">추천 기록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';console.error('[recommendations]',err)}})();
</script></body></html>
