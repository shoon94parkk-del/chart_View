<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Chart View | AI 추천 기록</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#191f28;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1080px;margin:auto;padding:20px 16px 64px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.head a{color:#4e5968;text-decoration:none;font-weight:800}.title h1{margin:0;font-size:25px}.title p{margin:7px 0 0;color:#6b7684;font-size:14px}.section-title{display:flex;justify-content:space-between;align-items:end;margin:24px 0 10px}.section-title h2{margin:0;font-size:19px}.section-title span{color:#8b95a1;font-size:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.kpi,.card,.day{background:#fff;border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.kpi span{display:block;color:#8b95a1;font-size:12px}.kpi b{display:block;margin-top:8px;font-size:21px}.days,.grid{display:grid;gap:12px}.day-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.day-date{font-size:17px;font-weight:900}.day-status{color:#8b95a1;font-size:11px;text-align:right;max-width:55%;line-height:1.4}.rank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rank{border:1px solid #edf1f5;border-radius:14px;padding:13px;background:#fbfcfe}.rank-top{display:flex;justify-content:space-between;gap:8px}.rank-title{font-size:12px;font-weight:900;color:#6b7684}.rank-score{font-size:18px;font-weight:900;color:#1b64da}.rank strong{display:block;margin-top:7px;font-size:16px}.rank .price{margin-top:5px;font-size:13px;color:#4e5968}.rank .reason{margin:9px 0 0;color:#6b7684;font-size:12px;line-height:1.5}.badge{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:999px;background:#eef6ff;color:#1b64da;font-size:10px;font-weight:800}.top{display:flex;justify-content:space-between;gap:12px}.stock strong{font-size:18px}.stock small{display:block;color:#8b95a1;margin-top:4px}.ret{font-size:21px;font-weight:800}.up{color:#f04452}.down{color:#3182f6}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.meta div{background:#f7f8fa;border-radius:12px;padding:10px}.meta span{display:block;color:#8b95a1;font-size:11px}.meta b{display:block;margin-top:5px;font-size:14px}.reason{margin:12px 0 0;color:#4e5968;font-size:13px;line-height:1.5}.empty{text-align:center;background:#fff;border-radius:18px;padding:44px;color:#8b95a1}@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}.rank-grid{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,1fr)}.day-status{max-width:48%;font-size:10px}}
  </style>
</head>
<body><main class="wrap"><div class="head"><div class="title"><h1>AI 추천 기록</h1><p>매일 전종목 스크리닝 후 업황·기업·밸류·기술을 합산한 TOP3를 날짜별로 누적합니다.</p></div><a href="/">← 차트뷰</a></div><section id="summary" class="summary"></section><div class="section-title"><h2>날짜별 TOP3</h2><span>추천 당시 점수·가격 고정</span></div><section id="daily" class="days"></section><div class="section-title"><h2>추천 트랙레코드</h2><span>현재가 기준 성과 추적</span></div><section id="list" class="grid"></section></main>
<script>
const f=n=>Number.isFinite(+n)?(+n).toLocaleString('ko-KR'):'-';const p=n=>Number.isFinite(+n)?`${+n>0?'+':''}${(+n).toFixed(2)}%`:'-';const e=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
Promise.all([
 fetch('/static/data/ai_daily_rankings.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({days:[]})),
 fetch('/static/data/ai_recommendations.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({recommendations:[]}))
]).then(([dailyData,recData])=>{
 const days=Array.isArray(dailyData.days)?dailyData.days:[];const a=Array.isArray(recData.recommendations)?recData.recommendations:[];const active=a.filter(x=>(x.status||'active')!=='closed'),wins=a.filter(x=>Number(x.returnPct)>0);const avg=a.length?a.reduce((s,x)=>s+(Number(x.returnPct)||0),0)/a.length:0;
 document.querySelector('#summary').innerHTML=`<div class="kpi"><span>누적 추천일</span><b>${days.length}</b></div><div class="kpi"><span>누적 추천 종목</span><b>${a.length}</b></div><div class="kpi"><span>수익 추천 비율</span><b>${a.length?(wins.length/a.length*100).toFixed(0):0}%</b></div><div class="kpi"><span>평균 수익률</span><b>${p(avg)}</b></div>`;
 const daily=document.querySelector('#daily');if(!days.length)daily.innerHTML='<div class="empty">아직 날짜별 TOP3 기록이 없습니다.</div>';else daily.innerHTML=[...days].sort((x,y)=>String(y.tradeDate||'').localeCompare(String(x.tradeDate||''))).map(d=>`<article class="day"><div class="day-head"><div class="day-date">${e(d.tradeDate||'-')}</div><div class="day-status">${e(d.status||'')}</div></div><div class="rank-grid">${(d.top3||[]).slice(0,3).map(x=>{const c=Number(x.changePct)>0?'up':Number(x.changePct)<0?'down':'';return `<div class="rank"><div class="rank-top"><span class="rank-title">${x.rank===1?'🥇':x.rank===2?'🥈':'🥉'} ${x.rank}위</span><span class="rank-score">${e(x.totalScore)}점</span></div><strong>${e(x.name||x.symbol)}</strong><div class="price">${f(x.close)}원 · <span class="${c}">${p(x.changePct)}</span></div><span class="badge">${e(x.grade||'관찰')}</span><p class="reason">${e(x.reason||'')}</p></div>`}).join('')}</div></article>`).join('');
 const list=document.querySelector('#list');if(!a.length){list.innerHTML='<div class="empty">공식 매수 추천으로 확정된 종목은 아직 없습니다.</div>';return}list.innerHTML=[...a].sort((x,y)=>String(y.recommendedDate||'').localeCompare(String(x.recommendedDate||''))).map(x=>{const c=Number(x.returnPct)>0?'up':Number(x.returnPct)<0?'down':'';return `<article class="card"><div class="top"><div class="stock"><strong>${e(x.name||x.symbol)}</strong><small>${e(x.symbol||'')}</small></div><div class="ret ${c}">${p(x.returnPct)}</div></div><div class="meta"><div><span>추천일</span><b>${e(x.recommendedDate||'-')}</b></div><div><span>추천가</span><b>${f(x.recommendedPrice)}</b></div><div><span>현재가</span><b>${f(x.currentPrice)}</b></div><div><span>최고 수익률</span><b>${p(x.bestReturnPct)}</b></div></div><span class="badge">${e(x.statusLabel||((x.status||'active')==='closed'?'종료':'관찰중'))}</span><p class="reason">${e(x.reason||'')}</p></article>`}).join('')
});
</script></body></html>
