<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Chart View | 추천 트랙레코드</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#191f28;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1040px;margin:auto;padding:20px 16px 56px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.head a{color:#4e5968;text-decoration:none;font-weight:700}.title h1{margin:0;font-size:25px}.title p{margin:7px 0 0;color:#6b7684;font-size:14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.kpi,.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.kpi span{display:block;color:#8b95a1;font-size:12px}.kpi b{display:block;margin-top:8px;font-size:21px}.grid{display:grid;gap:12px}.top{display:flex;justify-content:space-between;gap:12px}.stock strong{font-size:18px}.stock small{display:block;color:#8b95a1;margin-top:4px}.ret{font-size:21px;font-weight:800}.up{color:#f04452}.down{color:#3182f6}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.meta div{background:#f7f8fa;border-radius:12px;padding:10px}.meta span{display:block;color:#8b95a1;font-size:11px}.meta b{display:block;margin-top:5px;font-size:14px}.reason{margin:12px 0 0;color:#4e5968;font-size:13px;line-height:1.5}.badge{display:inline-block;margin-top:12px;padding:6px 9px;border-radius:999px;background:#eef6ff;color:#1b64da;font-size:11px;font-weight:800}.empty{text-align:center;background:#fff;border-radius:18px;padding:44px;color:#8b95a1}@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}.meta{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><main class="wrap"><div class="head"><div class="title"><h1>추천 트랙레코드</h1><p>추천 당시 가격은 고정하고 이후 성과만 매 거래일 갱신합니다.</p></div><a href="/">← 차트뷰</a></div><section id="summary" class="summary"></section><section id="list" class="grid"></section></main>
<script>
const f=n=>Number.isFinite(+n)?(+n).toLocaleString('ko-KR'):'-';const p=n=>Number.isFinite(+n)?`${+n>0?'+':''}${(+n).toFixed(2)}%`:'-';
fetch('/static/data/ai_recommendations.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const a=d.recommendations||[],active=a.filter(x=>(x.status||'active')!=='closed'),wins=a.filter(x=>Number(x.returnPct)>0);const avg=a.length?a.reduce((s,x)=>s+(Number(x.returnPct)||0),0)/a.length:0;document.querySelector('#summary').innerHTML=`<div class="kpi"><span>누적 추천</span><b>${a.length}</b></div><div class="kpi"><span>진행중</span><b>${active.length}</b></div><div class="kpi"><span>수익 추천 비율</span><b>${a.length?(wins.length/a.length*100).toFixed(0):0}%</b></div><div class="kpi"><span>평균 수익률</span><b>${p(avg)}</b></div>`;const list=document.querySelector('#list');if(!a.length){list.innerHTML='<div class="empty">아직 공식 추천 이력이 없습니다.</div>';return}list.innerHTML=[...a].sort((x,y)=>String(y.recommendedDate||'').localeCompare(String(x.recommendedDate||''))).map(x=>{const c=Number(x.returnPct)>0?'up':Number(x.returnPct)<0?'down':'';return `<article class="card"><div class="top"><div class="stock"><strong>${x.name||x.symbol}</strong><small>${x.symbol||''}</small></div><div class="ret ${c}">${p(x.returnPct)}</div></div><div class="meta"><div><span>추천일</span><b>${x.recommendedDate||'-'}</b></div><div><span>추천가</span><b>${f(x.recommendedPrice)}</b></div><div><span>현재가</span><b>${f(x.currentPrice)}</b></div><div><span>최고 수익률</span><b>${p(x.bestReturnPct)}</b></div></div><span class="badge">${x.statusLabel||((x.status||'active')==='closed'?'종료':'관찰중')}</span><p class="reason">${x.reason||''}</p></article>`}).join('')}).catch(()=>document.querySelector('#list').innerHTML='<div class="empty">추천 데이터를 불러오지 못했습니다.</div>');
</script></body></html>
